/* ---------------- Historial de precios por material ---------------- */
function normalizarMaterial(s){ return String(s||'').trim().toUpperCase().replace(/\s+/g,' '); }
function buildHistorialMateriales(ordenes, proveedores){
  const map = {};
  ordenes.forEach(o=>{
    if(o.estado==='Desestimado') return; // un precio de una OC desestimada no es un dato confiable de compra real
    const proveedor = proveedores.find(p=>p.id===o.proveedorId);
    (o.items||[]).forEach(it=>{
      const key = normalizarMaterial(it.detalle);
      if(!key) return;
      if(!map[key]) map[key] = { nombre: (it.detalle||'').trim(), entradas: [] };
      map[key].entradas.push({
        fecha: o.fecha, pu: Number(it.pu)||0, und: it.und||'', moneda: o.moneda||'SOLES',
        proveedorNombre: proveedor?proveedor.razonSocial:'—', codigo: o.codigo, ocId: o.id,
      });
    });
  });
  Object.values(map).forEach(m=>{
    m.entradas.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));
    m.ultimo = m.entradas[0];
    m.vecesComprado = m.entradas.length;
    ['SOLES','DOLARES'].forEach(mon=>{
      const vals = m.entradas.filter(e=>(e.moneda||'SOLES')===mon).map(e=>Math.abs(e.pu));
      const suf = mon==='SOLES'?'Soles':'Dolares';
      m['promedio'+suf] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
      m['min'+suf] = vals.length ? Math.min(...vals) : null;
      m['max'+suf] = vals.length ? Math.max(...vals) : null;
    });
    const mismaMoneda = m.entradas.filter(e=>(e.moneda||'SOLES')===(m.ultimo.moneda||'SOLES'));
    m.tendencia = mismaMoneda.length>=2 ? (Math.abs(mismaMoneda[0].pu)>Math.abs(mismaMoneda[1].pu)?'up':Math.abs(mismaMoneda[0].pu)<Math.abs(mismaMoneda[1].pu)?'down':'same') : null;
  });
  return map;
}
function formatMoney(n){ return new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(n||0); }
function formatMoneyCur(n, moneda){ const isUsd = moneda==='DOLARES'; return new Intl.NumberFormat(isUsd?'en-US':'es-PE',{style:'currency',currency:isUsd?'USD':'PEN'}).format(n||0); }
function sumByCurrency(ordenes, filterFn){ const r={soles:0,dolares:0}; ordenes.forEach(o=>{ if(filterFn && !filterFn(o)) return; if(o.moneda==='DOLARES') r.dolares+=(o.montoTotal||0); else r.soles+=(o.montoTotal||0); }); return r; }
function MoneyDual({soles, dolares, className}){
  if(!soles && !dolares) return <span className={className}>{formatMoney(0)}</span>;
  return <span className={className}>{soles>0 && formatMoney(soles)}{soles>0 && dolares>0 && <span className="text-[#5C6376]"> · </span>}{dolares>0 && formatMoneyCur(dolares,'DOLARES')}</span>;
}
function formatDate(d){ if(!d) return '—'; const date=new Date(d+'T00:00:00'); if(isNaN(date)) return d; return date.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'}); }
function formatDateShort(d){ if(!d) return ''; const date=new Date(d+'T00:00:00'); if(isNaN(date)) return d; const dd=String(date.getDate()).padStart(2,'0'); const mm=String(date.getMonth()+1).padStart(2,'0'); return `${dd}/${mm}/${date.getFullYear()}`; }
function cleanPhoneForWa(phone){ let p=(phone||'').replace(/[^\d]/g,''); if(p.length===9) p='51'+p; return p; }
function waLink(phone,message){ return `https://wa.me/${cleanPhoneForWa(phone)}?text=${encodeURIComponent(message)}`; }

const UNIDS=['','UNO','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE','VEINTE'];
const VEINTIS=['VEINTE','VEINTIUNO','VEINTIDÓS','VEINTITRÉS','VEINTICUATRO','VEINTICINCO','VEINTISÉIS','VEINTISIETE','VEINTIOCHO','VEINTINUEVE'];
const DECENAS=['TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
const CENTENAS=['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
function convertirDecenas(n){ if(n===0) return ''; if(n<=20) return UNIDS[n]; if(n<30) return VEINTIS[n-20]; const d=Math.floor(n/10),u=n%10; if(u===0) return DECENAS[d-3]; return DECENAS[d-3]+' Y '+UNIDS[u]; }
function convertirGrupo(n){ if(n===100) return 'CIEN'; const c=Math.floor(n/100), r=n%100; let s=c>0?CENTENAS[c]+' ':''; s+=convertirDecenas(r); return s.trim(); }
function convertirNumero(n){ if(n===0) return 'CERO'; const millones=Math.floor(n/1000000); n%=1000000; const miles=Math.floor(n/1000); n%=1000; const partes=[]; if(millones>0) partes.push(millones===1?'UN MILLÓN':`${convertirGrupo(millones)} MILLONES`); if(miles>0) partes.push(miles===1?'MIL':`${convertirGrupo(miles)} MIL`); if(n>0) partes.push(convertirGrupo(n)); return partes.join(' ').trim(); }
function numeroALetras(monto, moneda='SOLES'){ const red=Math.round((monto||0)*100)/100; const entero=Math.floor(red); const dec=Math.round((red-entero)*100); const letras=entero===0?'CERO':convertirNumero(entero); return `${letras} CON ${String(dec).padStart(2,'0')}/100 ${moneda}`; }

/* ---------------- Almacenamiento en la nube (Supabase) ---------------- */
// La "anon key" es pública por diseño (va en el navegador de cualquiera que use la app);
// lo que realmente protege los datos es la Seguridad a Nivel de Fila (RLS) configurada
// en la tabla cantera_kv, que solo deja a cada usuario leer/escribir sus propias filas.
const SUPABASE_URL = 'https://rosrayeqyjrouktfctbs.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_57RXaNUwrEmzxJF-TiTs6w_8WFD75sv';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// idbGet/idbSet conservan el mismo nombre y firma que antes (cuando usaban IndexedDB)
// a propósito: así el resto del código (App, cada *View, etc.) no tuvo que cambiar,
// solo cambió DÓNDE vive el dato — de este navegador, a la nube.
async function idbGet(key, fallback){
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return fallback;
    const { data, error } = await supabaseClient
      .from('cantera_kv').select('value')
      .eq('user_id', user.id).eq('key', key)
      .maybeSingle();
    if(error){ console.error('idbGet (Supabase): error leyendo', key, error); return fallback; }
    return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
  } catch(e){ console.error('idbGet (Supabase): excepción leyendo', key, e); return fallback; }
}
async function idbSet(key, value){
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if(!user) return false;
    const { error } = await supabaseClient
      .from('cantera_kv')
      .upsert({ user_id: user.id, key, value, updated_at: new Date().toISOString() });
    if(error){ console.error('idbSet (Supabase): error guardando', key, error); return false; }
    return true;
  } catch(e){ console.error('idbSet (Supabase): excepción guardando', key, e); return false; }
}
// compatibilidad: loadLS/saveLS síncronos se usan solo para datos pequeños (config de conexión, no datos de negocio)
function loadLS(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function saveLS(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch(e){ return false; } }

function ProyectosView({proyectos, setProyectos, ordenes, setOrdenes, proveedores, onIrAOrdenes}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [detalle, setDetalle] = useState(null);
  const [showFusion, setShowFusion] = useState(false);
  const save = (form) => { setProyectos(prev => prev.some(p=>p.id===form.id) ? prev.map(p=>p.id===form.id?form:p) : [...prev, form]); setShowForm(false); setEditing(null); };
  const remove = (id) => { if(confirm('¿Eliminar esta obra? Las OC ya generadas para ella se conservarán.')) setProyectos(prev => prev.filter(p=>p.id!==id)); };
  const fusionar = (mantenerId, eliminarId) => {
    const mantener = proyectos.find(p=>p.id===mantenerId);
    if(!confirm(`Se moverán todas las OC de "${(proyectos.find(p=>p.id===eliminarId)||{}).nombre}" a "${mantener.nombre}", y se eliminará el duplicado. ¿Continuar?`)) return;
    setOrdenes(prev => prev.map(o => o.proyectoId===eliminarId ? {...o, proyectoId: mantenerId} : o));
    setProyectos(prev => prev.filter(p=>p.id!==eliminarId));
    setShowFusion(false);
  };
  const gastoPorProyecto = useMemo(()=>{ const s={}; ordenes.forEach(o=>{ if(!o.proyectoId) return; if(!s[o.proyectoId]) s[o.proyectoId]={soles:0,dolares:0}; if(o.moneda==='DOLARES') s[o.proyectoId].dolares+=(o.montoTotal||0); else s[o.proyectoId].soles+=(o.montoTotal||0); }); return s; }, [ordenes]);
  const ocsPorProyecto = useMemo(()=>{ const s={}; ordenes.forEach(o=>{ if(o.proyectoId) s[o.proyectoId]=(s[o.proyectoId]||0)+1; }); return s; }, [ordenes]);
  return (
    <div>
      <div className="flex justify-end gap-2 mb-4">
        {!READONLY && <button onClick={()=>setShowFusion(true)} disabled={proyectos.length<2} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5 disabled:opacity-40">🔗 Fusionar obras duplicadas</button>}
        {!READONLY && <button onClick={()=>{setEditing(null); setShowForm(true);}} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">+ Nueva obra</button>}
      </div>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
        {proyectos.map(p=>(
          <div key={p.id} onClick={()=>setDetalle(p)} className="bg-[#141821] rounded-xl border border-[#232838] p-4 cursor-pointer hover:border-[#E1602A] hover:shadow-sm transition-all">
            <div className="flex items-start justify-between mb-2">
              <div className="w-9 h-9 rounded-lg flex items-center justify-center bg-[#14293D]/10 text-lg">🏗️</div>
              <div className="flex items-center gap-2" onClick={e=>e.stopPropagation()}>
                <button onClick={()=>{setEditing(p); setShowForm(true);}} className="text-[#5C6376] hover:text-[#DADDE5]">✏️</button>
                <button onClick={()=>remove(p.id)} className="text-[#5C6376] hover:text-red-400">🗑️</button>
              </div>
            </div>
            <p className="font-semibold text-[#EDEFF3]">{p.nombre}</p>
            <p className="text-xs text-[#5C6376] font-mono mb-1">Centro de costo: {p.centroCosto}</p>
            <p className="text-xs text-[#8B92A5]">📍 {p.region}</p>
            {p.solicitante && <p className="text-xs text-[#8B92A5] mt-1">Solicitante: {p.solicitante}</p>}
            <div className="flex items-center justify-between mt-2 pt-2 border-t border-[#1E2330]">
              <MoneyDual soles={(gastoPorProyecto[p.id]||{}).soles||0} dolares={(gastoPorProyecto[p.id]||{}).dolares||0} className="text-sm font-mono text-[#DADDE5]"/>
              <p className="text-xs text-[#5C6376]">{ocsPorProyecto[p.id]||0} OC · ver detalle →</p>
            </div>
          </div>
        ))}
        {proyectos.length===0 && <div className="col-span-full bg-[#141821] border border-dashed border-[#2E3547] rounded-xl p-10 text-center text-[#5C6376] text-sm">Aún no registras obras.</div>}
      </div>
      {showForm && <Modal title={editing?'Editar obra':'Nueva obra'} onClose={()=>{setShowForm(false); setEditing(null);}}><ProyectoForm initial={editing} onSave={save} onCancel={()=>{setShowForm(false); setEditing(null);}}/></Modal>}
      {detalle && <ObraDetalleModal proyecto={detalle} ordenes={ordenes} proveedores={proveedores} onClose={()=>setDetalle(null)} onIrAOrdenes={(id)=>{ setDetalle(null); onIrAOrdenes(id); }}/>}
      {showFusion && <FusionarObrasModal proyectos={proyectos} onClose={()=>setShowFusion(false)} onFusionar={fusionar}/>}
    </div>
  );
}

/* ---------------- Proveedor ---------------- */
function ProveedorForm({initial, onSave, onCancel}){
  const [form, setForm] = useState(initial || {id:generateId(), razonSocial:'', ruc:'', categorias:[], region:REGIONES[14], distrito:'', representanteLegal:'', contacto:'', telefono:'', email:'', banco:'', cuenta:'', homologado:false, notas:''});
  const [catInput, setCatInput] = useState('');
  const addCategoria = (c) => { const v=c.trim(); if(!v) return; if(!form.categorias.includes(v)) setForm({...form, categorias:[...form.categorias, v]}); setCatInput(''); };
  const removeCategoria = (c) => setForm({...form, categorias: form.categorias.filter(x=>x!==c)});
  return (
    <form onSubmit={e=>{e.preventDefault(); if(!form.razonSocial.trim()||!form.ruc.trim()) return; onSave(form);}}>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Razón social" required><input className={inputCls} value={form.razonSocial} onChange={e=>setForm({...form, razonSocial:e.target.value})}/></Field>
        <Field label="RUC" required><input className={inputCls+' font-mono'} value={form.ruc} onChange={e=>setForm({...form, ruc:e.target.value})} maxLength={11}/></Field>
      </div>
      <Field label="Categorías">
        <div className="flex flex-wrap gap-1.5 mb-2">{form.categorias.map(c=><Badge key={c} className={colorForCategoria(c)}>{c}<button type="button" onClick={()=>removeCategoria(c)} className="ml-1 opacity-60 hover:opacity-100">✕</button></Badge>)}</div>
        <div className="flex gap-2">
          <input className={inputCls} list="categorias-sugeridas" value={catInput} onChange={e=>setCatInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault(); addCategoria(catInput);}}} placeholder="Escribe y presiona Enter"/>
          <button type="button" onClick={()=>addCategoria(catInput)} className="px-3 rounded-lg border border-[#2E3547] text-sm text-[#B4B9C6] hover:bg-[#1A1F2A]">Añadir</button>
        </div>
        <datalist id="categorias-sugeridas">{CATEGORIAS_SUGERIDAS.map(c=><option key={c} value={c}/>)}</datalist>
      </Field>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Región" required><select className={inputCls} value={form.region} onChange={e=>setForm({...form, region:e.target.value})}>{REGIONES.map(r=><option key={r} value={r}>{r}</option>)}</select></Field>
        <Field label="Distrito"><input className={inputCls} value={form.distrito} onChange={e=>setForm({...form, distrito:e.target.value})}/></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Representante legal"><input className={inputCls} value={form.representanteLegal} onChange={e=>setForm({...form, representanteLegal:e.target.value})}/></Field>
        <Field label="Persona de contacto"><input className={inputCls} value={form.contacto} onChange={e=>setForm({...form, contacto:e.target.value})}/></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Teléfono (WhatsApp)" required><input className={inputCls} value={form.telefono} onChange={e=>setForm({...form, telefono:e.target.value})}/></Field>
        <Field label="Correo"><input type="email" className={inputCls} value={form.email} onChange={e=>setForm({...form, email:e.target.value})}/></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Banco"><input className={inputCls} value={form.banco} onChange={e=>setForm({...form, banco:e.target.value})}/></Field>
        <Field label="Nº de cuenta"><input className={inputCls+' font-mono'} value={form.cuenta} onChange={e=>setForm({...form, cuenta:e.target.value})}/></Field>
      </div>
      <Field label="Notas"><textarea className={inputCls} rows={2} value={form.notas} onChange={e=>setForm({...form, notas:e.target.value})}/></Field>
      <label className="flex items-center gap-2 mb-4 mt-1 cursor-pointer select-none"><input type="checkbox" checked={form.homologado} onChange={e=>setForm({...form, homologado:e.target.checked})} className="w-4 h-4"/><span className="text-sm text-[#DADDE5]">Proveedor homologado</span></label>

/* ---------------- Excel export (usa tu plantilla real, preserva 100% del formato) ---------------- */
function xmlEscape(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }

function replaceNumericCell(xml, addr, value){
  const re = new RegExp(`(<c r="${addr}"[^>]*t="n"><v>)[^<]*(</v>)`);
  return xml.replace(re, `$1${value}$2`);
}
function replaceFormulaCellValue(xml, addr, value){
  const re = new RegExp(`(<c r="${addr}"[^>]*><f[^>]*>[^<]*</f><v>)[^<]*(</v>)`);
  return xml.replace(re, `$1${value}$2`);
}
function swapCellStyle(xml, addr, newStyle){
  const re = new RegExp(`(<c r="${addr}" s=)"(\\d+)"`);
  return xml.replace(re, `$1"${newStyle}"`);
}
function blankCell(xml, addr){
  const re = new RegExp(`<c r="${addr}"([^>]*)>.*?</c>`, 's');
  return xml.replace(re, (m, attrs) => {
    const styleAttr = (attrs.match(/\ss="\d+"/)||[''])[0];
    return `<c r="${addr}"${styleAttr}/>`;
  });
}
/* ==========================================================================
   Motor de filas dinámicas para la OC (plantilla F-003 v2 / FORMATO_GENERAL_OCS).
   La plantilla tiene, en sus números de fila ORIGINALES:
     1-16   bloque fijo de encabezado (empresa/proveedor/obra, fórmula subtotal en 16)
     17     fila descartada (título de grupo, no se usa mientras la agrupación por
            partida quede pendiente para el módulo de Servicios)
     18     fila MOLDE de ítem (estilo a clonar por cada línea de la OC)
     19-34  filas descartadas (datos de ejemplo de la plantilla original)
     35-64  bloque fijo A (blanco, IGV@40, Total@43, Son@48, Entrega@50,
            Forma de pago@54-58, Nota/correos@60-62, encabezado Consideraciones@64)
     65     fila MOLDE de consideración (una línea de "Consideraciones Proveedor")
     66-146 bloque fijo B (Términos y Condiciones, firmas@142-143)
   Todo lo de abajo se corre automáticamente según cuántos ítems/consideraciones
   tenga la OC — no hay límite fijo de filas.
   ========================================================================== */
const OC_V2_ITEM_ZONE_START = 17;
const OC_V2_ITEM_ZONE_END = 34;
const OC_V2_ZONE_A_START = 35;
const OC_V2_ZONE_A_END = 64;
const OC_V2_ZONE_B_START = 66;
const OC_V2_ZONE_B_END = 146;
const OC_V2_SUBTOTAL_ROW = 16;
const OC_V2_IGV_ROW = 40;
const OC_V2_TOTAL_ROW = 43;
const OC_V2_ROWBREAK_ORIG = 82;
/* Mapa de estilos: índice del formato en Soles -> índice del mismo formato ya en Dólares (agregado a la plantilla) */
const OC_V2_USD_STYLE_MAP = { 90: 150, 91: 151, 98: 152, 65: 153 };
const OC_V2_MERGES_STATIC = ['C2:F2','C3:F4','G2:H4','C9:E9','D7:E7','F7:H7','C12:E12'];
const OC_V2_MERGES_ZONE_A = ['C56:F56','C57:F57','C58:F58'];
const OC_V2_MERGES_ZONE_B = ['F144:G144','F142:G142','F143:G143','C66:G66','C67:G67',
  'B115:H115','B118:H118','B119:H119','C134:G134','B89:H89','B93:H93','B103:H103',
  'B87:H87','B111:H111','B114:H114','B69:H69','B79:H79','B83:H83','B86:H86','B85:H85','B70:H70'];

function ocv2ExtractRow(sheetXml, rowNum){
  const m = sheetXml.match(new RegExp(`<row r="${rowNum}"[^>]*>.*?</row>`, 's'));
  return m ? m[0] : null;
}
function ocv2ShiftRowNumbers(rowXml, newRowNum){
  let out = rowXml.replace(/^<row r="\d+"/, `<row r="${newRowNum}"`);
  out = out.replace(/ r="([A-Z]{1,3})\d+"/g, (m, col) => ` r="${col}${newRowNum}"`);
  return out;
}
function ocv2ShiftZone(sheetXml, fromRow, toRow, delta){
  let out = '';
  for (let r=fromRow; r<=toRow; r++){
    const raw = ocv2ExtractRow(sheetXml, r);
    if(!raw) continue;
    out += delta===0 ? raw : ocv2ShiftRowNumbers(raw, r+delta);
  }
  return out;
}
function ocv2BuildItemRow(rowNum, item, usd){
  const styleF = usd ? OC_V2_USD_STYLE_MAP[90] : 90;
  const styleG = usd ? OC_V2_USD_STYLE_MAP[91] : 91;
  const itemCode = xmlEscape(item.item!=null ? String(item.item) : '');
  const detalle = xmlEscape(item.detalle || '');
  const und = xmlEscape(item.und || '');
  const metrado = Number(item.metrado)||0;
  const pu = Number(item.pu)||0;
  return `<row r="${rowNum}" spans="1:9" ht="12" x14ac:dyDescent="0.2">` +
    `<c r="A${rowNum}" s="8"/>` +
    `<c r="B${rowNum}" s="121" t="inlineStr"><is><t xml:space="preserve">${itemCode}</t></is></c>` +
    `<c r="C${rowNum}" s="92" t="inlineStr"><is><t xml:space="preserve">${detalle}</t></is></c>` +
    `<c r="D${rowNum}" s="93" t="inlineStr"><is><t xml:space="preserve">${und}</t></is></c>` +
    `<c r="E${rowNum}" s="93"><v>${metrado}</v></c>` +
    `<c r="F${rowNum}" s="${styleF}"><v>${pu}</v></c>` +
    `<c r="G${rowNum}" s="${styleG}"><f>F${rowNum}*E${rowNum}</f><v>${metrado*pu}</v></c>` +
    `<c r="H${rowNum}" s="59"/>` +
    `<c r="I${rowNum}" s="9"/>` +
    `</row>`;
}
function ocv2BuildConsRow(rowNum, text){
  const safe = xmlEscape(text || '');
  return `<row r="${rowNum}" spans="1:9" x14ac:dyDescent="0.2">` +
    `<c r="A${rowNum}" s="8"/><c r="B${rowNum}" s="20"/>` +
    `<c r="C${rowNum}" s="80" t="inlineStr"><is><t xml:space="preserve">${safe}</t></is></c>` +
    `<c r="D${rowNum}" s="84"/><c r="E${rowNum}" s="21"/><c r="F${rowNum}" s="22"/>` +
    `<c r="G${rowNum}" s="23"/><c r="H${rowNum}" s="24"/><c r="I${rowNum}" s="9"/>` +
    `</row>`;
}
/* Reconstruye sheetData + mergeCells + hyperlinks + rowBreaks + dimension según
   la cantidad real de ítems y de líneas de consideraciones. El reemplazo de
   campos de texto (§PROV_RAZON§, etc.) se hace aparte, en sharedStrings. */
function ocv2BuildSheet(sheetXml, items, considLines, usd){
  const N = Math.max(1, items.length);
  const M = considLines.length;
  const itemShift = N - (OC_V2_ITEM_ZONE_END - OC_V2_ITEM_ZONE_START + 1);
  const consShift = M - 1;
  const totalShiftB = itemShift + consShift;

  let body = '';
  body += ocv2ShiftZone(sheetXml, 1, OC_V2_ITEM_ZONE_START-1, 0);
  for (let i=0;i<N;i++){
    const it = items[i] || { item:'', detalle:'', und:'', metrado:0, pu:0 };
    body += ocv2BuildItemRow(OC_V2_ITEM_ZONE_START+i, it, usd);
  }
  body += ocv2ShiftZone(sheetXml, OC_V2_ZONE_A_START, OC_V2_ZONE_A_END, itemShift);
  const consStart = OC_V2_ZONE_A_END + itemShift + 1;
  for (let i=0;i<M;i++){
    body += ocv2BuildConsRow(consStart+i, considLines[i]);
  }
  body += ocv2ShiftZone(sheetXml, OC_V2_ZONE_B_START, OC_V2_ZONE_B_END, totalShiftB);

  const newIgvRow = OC_V2_IGV_ROW + itemShift;
  const newTotalRow = OC_V2_TOTAL_ROW + itemShift;
  body = body.replace(new RegExp(`(<c r="H${newIgvRow}"[^>]*><f>)H16\\*G\\d+(</f>)`), `$1H16*G${newIgvRow}$2`);
  body = body.replace(new RegExp(`(<c r="H${newTotalRow}"[^>]*><f>)SUM\\(H16:H\\d+\\)(</f>)`), `$1SUM(H16:H${newIgvRow})$2`);

  if (usd){
    body = swapCellStyle(body, `H${newIgvRow}`, OC_V2_USD_STYLE_MAP[65]);
    body = swapCellStyle(body, `H${newTotalRow}`, OC_V2_USD_STYLE_MAP[65]);
  }

  let sheet = sheetXml.replace(/<sheetData>.*?<\/sheetData>/s, `<sheetData>${body}</sheetData>`);
  if (usd) sheet = swapCellStyle(sheet, `H${OC_V2_SUBTOTAL_ROW}`, OC_V2_USD_STYLE_MAP[98]);

  const lastItemRow = OC_V2_ITEM_ZONE_START + N - 1;
  const subtotal = items.reduce((s,it)=>s+(Number(it.metrado)||0)*(Number(it.pu)||0),0);
  const igv = subtotal*0.18, total = subtotal+igv;
  sheet = sheet.replace(/(<c r="H16"[^>]*><f>)SUM\(G16:G\d+\)(<\/f>)(?:<v>[^<]*<\/v>)?/, `$1SUM(G16:G${lastItemRow})$2<v>${subtotal}</v>`);
  sheet = sheet.replace(new RegExp(`(<c r="H${newIgvRow}"[^>]*><f>)H16\\*G${newIgvRow}(</f>)(?:<v>[^<]*</v>)?`), `$1H16*G${newIgvRow}$2<v>${igv}</v>`);
  sheet = sheet.replace(new RegExp(`(<c r="H${newTotalRow}"[^>]*><f>)SUM\\(H16:H${newIgvRow}\\)(</f>)(?:<v>[^<]*</v>)?`), `$1SUM(H16:H${newIgvRow})$2<v>${total}</v>`);

  const shiftRef = (ref, delta) => delta===0 ? ref : ref.replace(/([A-Z]{1,3})(\d+)/g, (m,col,row)=>`${col}${Number(row)+delta}`);
  const merges = []
    .concat(OC_V2_MERGES_STATIC)
    .concat(OC_V2_MERGES_ZONE_A.map(r=>shiftRef(r, itemShift)))
    .concat(OC_V2_MERGES_ZONE_B.map(r=>shiftRef(r, totalShiftB)));
  sheet = sheet.replace(/<mergeCells count="\d+">.*?<\/mergeCells>/s, `<mergeCells count="${merges.length}">${merges.map(r=>`<mergeCell ref="${r}"/>`).join('')}</mergeCells>`);

  sheet = sheet.replace(/<hyperlink ref="C(\d+)"([^>]*)\/>/g, (m, rowStr, rest) => `<hyperlink ref="C${Number(rowStr)+itemShift}"${rest}/>`);
  sheet = sheet.replace(/<brk id="\d+"/, `<brk id="${OC_V2_ROWBREAK_ORIG+totalShiftB}"`);
  sheet = sheet.replace(/<dimension ref="A1:K\d+"\/>/, `<dimension ref="A1:K${OC_V2_ZONE_B_END+totalShiftB}"/>`);
  return sheet;
}

async function exportOcToExcel(oc, proveedor, proyecto, config){
  try {
    const items = (oc.items||[]).length ? oc.items : [{item:'',detalle:'',und:'',metrado:0,pu:0}];
    const usd = oc.moneda === 'DOLARES';
    const subtotal = items.reduce((s,it)=>s+(Number(it.metrado)||0)*(Number(it.pu)||0),0);
    const igv = subtotal*0.18, total = subtotal+igv;

    const zip = await JSZip.loadAsync(OC_TEMPLATE_V2_B64, { base64: true });
    let shared = await zip.file('xl/sharedStrings.xml').async('string');
    let sheet = await zip.file('xl/worksheets/sheet1.xml').async('string');

    const emails = (config.facturaEmails||'').split(',').map(s=>s.trim()).filter(Boolean);
    const replacements = {
      '§EMPRESA_RAZON§': config.razonSocial || '',
      '§EMPRESA_RUC§': config.ruc || '',
      '§EMPRESA_DIR§': config.direccion || '',
      '§EMPRESA_CORTO§': config.nombreCorto || '',
      '§OBRA_NOMBRE§': proyecto?proyecto.nombre:'',
      '§PROV_CUENTA§': proveedor?proveedor.cuenta:'',
      '§OBRA_SOLICITANTE§': proyecto?proyecto.solicitante:'',
      '§PROV_BANCO§': proveedor?proveedor.banco:'',
      '§MONEDA§': oc.moneda || 'SOLES',
      '§PROV_RAZON§': proveedor?proveedor.razonSocial:'',
      '§CENTRO_COSTO§': proyecto?proyecto.centroCosto:'',
      '§PROV_REPLEGAL§': proveedor?proveedor.representanteLegal:'',
      '§PROV_RUC§': proveedor?proveedor.ruc:'',
      '§CODIGO§': oc.codigo || '',
      '§PROV_CONTACTO§': proveedor?proveedor.contacto:'',
      '§PROV_TELF§': proveedor?proveedor.telefono:'',
      '§PARTIDA§': oc.partida || '',
      '§MONTO_LETRAS§': numeroALetras(total, oc.moneda==='DOLARES'?'DÓLARES':'SOLES'),
      '§ENTREGA§': formatDateShort(oc.plazoRequerido),
      '§FORMA_PAGO§': oc.formaPago || 'AL CONTADO',
      '§EMAIL_1§': emails[0] || '',
      '§EMAIL_2§': emails[1] || '',
    };
    Object.entries(replacements).forEach(([token, value]) => {
      const safe = xmlEscape(value);
      shared = shared.split(`<t xml:space="preserve">${token}</t>`).join(`<t xml:space="preserve">${safe}</t>`);
      shared = shared.split(`<t>${token}</t>`).join(`<t>${safe}</t>`);
    });

    // TIPO de OC: la opción elegida se resalta en negrita (estilo 57) en vez de un prefijo de texto
    const tipoRows = { Material: 9, Alquiler: 10, Servicio: 11, Otros: 12 };
    Object.entries(tipoRows).forEach(([t, row]) => {
      sheet = swapCellStyle(sheet, `F${row}`, oc.tipoOC===t ? 57 : 37);
    });

    // FECHA sí se mantiene como celda numérica de fecha real (no token de texto).
    // La celda no trae t="n" explícito (es el tipo numérico por defecto), así que
    // no se puede usar replaceNumericCell (exige t="n" literal); se reemplaza directo.
    sheet = sheet.replace(/(<c r="H11"[^>]*><v>)[^<]*(<\/v>)/, `$1${dateToExcelSerial(oc.fecha)}$2`);

    const considLines = DEFAULT_CONSIDERACIONES[oc.tipoOC] || [];
    sheet = ocv2BuildSheet(sheet, items, considLines, usd);

    zip.file('xl/sharedStrings.xml', shared);
    zip.file('xl/worksheets/sheet1.xml', sheet);

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const nombreProveedor = (proveedor?.razonSocial || '').trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, ' ').slice(0, 60);
    const nombreArchivo = nombreProveedor ? `${oc.codigo || 'OC'} - ${nombreProveedor}.xlsx` : `${oc.codigo || 'OC'}.xlsx`;
    a.href = url; a.download = nombreArchivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(err) {
    console.error(err);
    alert('No se pudo generar el Excel a partir de la plantilla. Detalle: ' + err.message);
  }
}

/* ---------------- Exportar Rendición de Fondo / Gasto a Excel (formato real) ---------------- */
function dateToExcelSerial(iso){
  if(!iso) return 0;
  const [y,m,d] = iso.split('-').map(Number);
  const utcDate = Date.UTC(y, m-1, d);
  const epoch = Date.UTC(1899, 11, 30);
  return Math.round((utcDate - epoch) / 86400000);
}

// El IGV desglosado solo tiene sustento si hay comprobante fiscal (boleta/factura) detrás.
// Si el gasto quedó como "Consumido" (sin comprobante formal, ej. Yape/efectivo), no existe
// documento tributario que respalde ese IGV, así que el monto se trata íntegro, sin descomponer.
function gastoTieneComprobanteFiscal(g){ return g.estado !== 'CONSUMIDO'; } // sin estado registrado (datos antiguos) = se asume PAGADO
function gastoMontoSinIgv(g){
  const monto = Number(g.montoTotal)||0;
  return gastoTieneComprobanteFiscal(g) ? monto/1.18 : monto;
}
function gastoIgv(g){
  return gastoTieneComprobanteFiscal(g) ? gastoMontoSinIgv(g)*0.18 : 0;
}

async function exportFondoToExcel(fondo, proyecto, config){
  try {
    const MAX_ITEMS = 12;
    const gastosOriginal = fondo.gastos || [];
    if(gastosOriginal.length > MAX_ITEMS){
      if(!confirm(`Este fondo tiene ${gastosOriginal.length} gastos, pero el formato de rendición solo tiene espacio para ${MAX_ITEMS}. Se exportarán solo los primeros ${MAX_ITEMS} (ordenados por fecha). ¿Continuar?`)) return;
    }
    const gastos = [...gastosOriginal].sort((a,b)=>new Date(a.fecha)-new Date(b.fecha)).slice(0, MAX_ITEMS);

    const zip = await JSZip.loadAsync(FONDO_TEMPLATE_B64, { base64: true });
    let shared = await zip.file('xl/sharedStrings.xml').async('string');
    const sheetPath = Object.keys(zip.files).find(n => /^xl\/worksheets\/sheet\d*\.xml$/.test(n)) || 'xl/worksheets/sheet1.xml';
    let sheet = await zip.file(sheetPath).async('string');

    const esFondo = fondo.tipo==='Adelanto';
    const tituloTipo = esFondo ? 'RENDICIÓN DE FONDO' : 'RENDICIÓN DE GASTOS';
    const titulo = `${tituloTipo} N°${fondo.numero || '01'}\r\n${(fondo.concepto||'').toUpperCase()}`;

    const replacements = {
      '§TITULO§': titulo,
      '§OBRA_NOMBRE§': proyecto ? proyecto.nombre : '',
      '§CENTRO_COSTO§': proyecto ? proyecto.centroCosto : '',
      '§SOLICITANTE§': fondo.solicitante || '',
      '§FECHA§': formatDateShort(fondo.fecha),
    };
    for(let i=1;i<=MAX_ITEMS;i++){
      const g = gastos[i-1];
      replacements[`§I${i}_DETALLE§`] = g ? g.concepto + (g.proveedorNombre?` — ${g.proveedorNombre}`:'') + (g.ruc?` (RUC ${g.ruc})`:'') : '';
      replacements[`§I${i}_DOCUMENTO§`] = g ? (g.documento||'') : '';
    }

    Object.entries(replacements).forEach(([token, value]) => {
      const safe = xmlEscape(value);
      shared = shared.split(`<t xml:space="preserve">${token}</t>`).join(`<t xml:space="preserve">${safe}</t>`);
      shared = shared.split(`<t>${token}</t>`).join(`<t>${safe}</t>`);
    });

    for(let i=1;i<=MAX_ITEMS;i++){
      const row = 9+i;
      const g = gastos[i-1];
      if(g){
        const fechaSerial = dateToExcelSerial(g.fecha);
        // MONTO de la plantilla es SIN IGV; el gasto capturado (recibo) es el total CON IGV -> se retira el 18%
        // salvo que sea un gasto "Consumido" sin comprobante formal, donde no hay IGV que desglosar
        const montoSinIgv = gastoMontoSinIgv(g);
        const igvFila = gastoIgv(g);
        sheet = replaceNumericCell(sheet, `E${row}`, fechaSerial);
        sheet = replaceNumericCell(sheet, `G${row}`, montoSinIgv.toFixed(6));
        sheet = replaceFormulaCellValue(sheet, `H${row}`, igvFila.toFixed(6));
      } else {
        sheet = blankCell(sheet, `E${row}`);
        sheet = blankCell(sheet, `G${row}`);
        sheet = blankCell(sheet, `H${row}`);
      }
    }

    // usando TODOS los gastos del fondo (no solo los 12 exportados en el detalle) para que los totales sean exactos
    const fondoEntregado = esFondo ? (Number(fondo.montoEntregado)||0) : 0;
    const subtotalSinIgv = gastosOriginal.reduce((s,g)=>s+gastoMontoSinIgv(g), 0);
    const igvTotal = gastosOriginal.reduce((s,g)=>s+gastoIgv(g), 0);
    const totalInclIgv = subtotalSinIgv + igvTotal;
    const reembolsar = fondoEntregado - totalInclIgv;

    const TOTAL_ROW = 22, TOTAL_IGV_ROW = 23, REEMBOLSAR_ROW = 24;
    sheet = replaceNumericCell(sheet, `E${TOTAL_ROW}`, fondoEntregado);
    sheet = replaceFormulaCellValue(sheet, `G${TOTAL_ROW}`, subtotalSinIgv.toFixed(6));
    sheet = replaceFormulaCellValue(sheet, `H${TOTAL_ROW}`, igvTotal.toFixed(6));
    sheet = replaceFormulaCellValue(sheet, `H${TOTAL_IGV_ROW}`, totalInclIgv.toFixed(6));
    sheet = replaceFormulaCellValue(sheet, `E${REEMBOLSAR_ROW}`, reembolsar.toFixed(6));
    sheet = replaceFormulaCellValue(sheet, `G${REEMBOLSAR_ROW}`, '0');

    zip.file('xl/sharedStrings.xml', shared);
    zip.file(sheetPath, sheet);

    const nombreObra = (proyecto?.nombre || '').trim().replace(/[\\/:*?"<>|]/g, '').slice(0, 40);
    const nombreArchivo = `${(proyecto?.centroCosto)||'RF'} - ${tituloTipo} N${fondo.numero||'01'} - ${nombreObra}.xlsx`;

    const blob = await zip.generateAsync({ type: 'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombreArchivo;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch(err){
    console.error(err);
    alert('No se pudo generar el Excel de rendición. Detalle: ' + err.message);
  }
}

/* ---------------- Formulario de OC ---------------- */
function OCForm({initial, proveedores, proyectos, ordenes, onSave, onCancel, tipoFijo}){
  const [form, setForm] = useState(initial || {id:generateId(), fecha:new Date().toISOString().slice(0,10), proveedorId:'', proyectoId: proyectos[0]?proyectos[0].id:'', tipoOC: tipoFijo||'Material', estado:'No pagado', partida:'', plazoRequerido:'', fechaEntregaReal:'', formaPago:'AL CONTADO', moneda:'SOLES', observaciones:'', items:[{id:generateId(), item:'1.01', detalle:'', und:'und', metrado:1, pu:0}]});
  const proyecto = proyectos.find(p=>p.id===form.proyectoId);
  const tipoInfo = TIPOS_OC.find(t=>t.nombre===form.tipoOC);
  const codigo = useMemo(()=>{
    if(!proyecto||!tipoInfo) return '';
    // si es una OC ya existente y no cambiaste ni la obra ni el tipo, se conserva su código original
    // (antes se recalculaba en cada guardado, aunque solo hubieras editado el precio o la moneda, y eso
    // le podía asignar un código distinto sin avisar)
    if(initial && initial.codigo && initial.proyectoId===form.proyectoId && initial.tipoOC===form.tipoOC) return initial.codigo;
    // se busca el correlativo más alto YA USADO para esa obra+tipo (no solo cuántas OC hay guardadas,
    // ya que si alguna se borró o no coincide exactamente, contar registros da un número más chico del real)
    const numeros = ordenes
      .filter(o=>o.proyectoId===proyecto.id && o.tipoOC===form.tipoOC && o.id!==form.id)
      .map(o=>{ const m = String(o.codigo||'').match(/-(\d+)$/); return m ? parseInt(m[1],10) : null; })
      .filter(n=>n!=null && !isNaN(n));
    const correlativo = (numeros.length ? Math.max(...numeros) : 0) + 1;
    return `${proyecto.centroCosto}-${tipoInfo.codigo}-${String(correlativo).padStart(3,'0')}`;
  }, [initial, proyecto, tipoInfo, ordenes, form.id, form.proyectoId, form.tipoOC]);
  const updateItem = (id, patch) => setForm({...form, items: form.items.map(it=>it.id===id?{...it,...patch}:it)});
  const addItem = () => {
    setForm({...form, items:[...form.items, {id:generateId(), item:`1.${String(form.items.length+1).padStart(2,'0')}`, detalle:'', und:'und', metrado:1, pu:0}]});
  };
  const removeItem = (id) => setForm({...form, items: form.items.filter(it=>it.id!==id)});
  const subtotal = form.items.reduce((s,it)=>s+(Number(it.metrado)||0)*(Number(it.pu)||0),0);
  const igv = subtotal*0.18, total = subtotal+igv;
  const cambiarTipoOC = (nombre) => setForm({...form, tipoOC:nombre});
  const historialMateriales = useMemo(()=>buildHistorialMateriales(ordenes.filter(o=>o.id!==form.id), proveedores), [ordenes, proveedores, form.id]);
  const avisosPrecios = form.items
    .map(it => {
      const m = historialMateriales[normalizarMaterial(it.detalle)];
      if(!m) return null;
      const puActual = Math.abs(Number(it.pu)||0);
      const puUltimo = Math.abs(m.ultimo.pu);
      const diffPct = puUltimo>0 ? ((puActual-puUltimo)/puUltimo*100) : 0;
      return { detalle: it.detalle, m, puActual, diffPct };
    })
    .filter(Boolean);
  const [errorGuardado, setErrorGuardado] = useState('');
  const [codigoManualActivo, setCodigoManualActivo] = useState(false);
  const [codigoManual, setCodigoManual] = useState(initial?.codigo || '');
  return (
    <form onSubmit={e=>{
      e.preventDefault();
      if(!form.proveedorId){ setErrorGuardado('Selecciona un proveedor antes de guardar.'); return; }
      if(!form.proyectoId){ setErrorGuardado('Selecciona una obra antes de guardar.'); return; }
      setErrorGuardado('');
      onSave({...form, codigo: codigoManualActivo ? (codigoManual.trim()||codigo) : codigo, montoTotal:total, montoSubtotal:subtotal, montoIgv:igv});
    }}>
      <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2 mb-3">
        <div className="flex items-center justify-between mb-1">
          <span className="text-xs text-[#8B92A5] uppercase tracking-wide">Código de OC</span>
          <button type="button" onClick={()=>{ if(!codigoManualActivo) setCodigoManual(codigo); setCodigoManualActivo(!codigoManualActivo); }} className="text-[11px] text-[#5C6376] hover:text-[#E1602A] underline">{codigoManualActivo?'Volver a automático':'✏️ Forzar / cambiar correlativo'}</button>
        </div>
        {codigoManualActivo ? (
          <input className={inputCls+' font-mono'} value={codigoManual} onChange={e=>setCodigoManual(e.target.value)} placeholder="Ej. 211-001-005"/>
        ) : (
          <span className="font-mono font-semibold text-sm text-[#E1602A]">{codigo || '— selecciona obra y tipo —'}</span>
        )}
      </div>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Obra" required><select className={inputCls} value={form.proyectoId} onChange={e=>setForm({...form, proyectoId:e.target.value})}><option value="">Selecciona…</option>{proyectos.map(p=><option key={p.id} value={p.id}>{p.nombre} ({p.centroCosto})</option>)}</select></Field>
        <Field label="Tipo de OC" required><select className={inputCls} value={form.tipoOC} onChange={e=>cambiarTipoOC(e.target.value)} disabled={!!tipoFijo}>{TIPOS_OC.map(t=><option key={t.nombre} value={t.nombre}>{t.nombre} ({t.codigo})</option>)}</select></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Proveedor" required><select className={inputCls} value={form.proveedorId} onChange={e=>setForm({...form, proveedorId:e.target.value})}><option value="">Selecciona un proveedor…</option>{proveedores.map(p=><option key={p.id} value={p.id}>{p.razonSocial}</option>)}</select></Field>
        <Field label="Partida"><input className={inputCls} value={form.partida} onChange={e=>setForm({...form, partida:e.target.value})} placeholder="Ej. Escalera, Cimentación…"/></Field>
      </div>
      <div className="grid grid-cols-3 gap-x-3">
        <Field label="Fecha"><input type="date" className={inputCls} value={form.fecha} onChange={e=>setForm({...form, fecha:e.target.value})}/></Field>
        <Field label="Plazo requerido / entrega"><input type="date" className={inputCls} value={form.plazoRequerido} onChange={e=>setForm({...form, plazoRequerido:e.target.value})}/></Field>
        <Field label="Moneda"><select className={inputCls} value={form.moneda} onChange={e=>setForm({...form, moneda:e.target.value})}><option value="SOLES">Soles (S/)</option><option value="DOLARES">Dólares (US$)</option></select></Field>
      </div>
      {form.estado==='Pagado' && <Field label="Fecha de pago"><input type="date" className={inputCls} value={form.fechaEntregaReal} onChange={e=>setForm({...form, fechaEntregaReal:e.target.value})}/></Field>}
      <span className="block text-xs font-medium text-[#8B92A5] mb-1.5 mt-3 uppercase tracking-wide">Ítems</span>
      <div className="border border-[#232838] rounded-lg overflow-hidden mb-2">
        <table className="w-full text-sm">
          <thead className="bg-[#1A1F2A] text-[#8B92A5] text-xs uppercase"><tr><th className="text-left px-2 py-1.5 w-14">Ítem</th><th className="text-left px-2 py-1.5">Detalle</th><th className="text-left px-2 py-1.5 w-20">Und.</th><th className="text-left px-2 py-1.5 w-16">Metrado</th><th className="text-left px-2 py-1.5 w-24">P.U. sin IGV</th><th className="w-8"></th></tr></thead>
          <tbody>{form.items.map(it=>(
            <tr key={it.id} className="border-t border-[#1E2330]">
              <td className="px-2 py-1"><input className="w-full text-sm px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded font-mono" value={it.item} onChange={e=>updateItem(it.id,{item:e.target.value})}/></td>
              <td className="px-2 py-1"><input className="w-full text-sm px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={it.detalle} onChange={e=>updateItem(it.id,{detalle:e.target.value})}/></td>
              <td className="px-2 py-1"><select className="w-full text-sm px-1 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={it.und} onChange={e=>updateItem(it.id,{und:e.target.value})}>{UNIDADES.map(u=><option key={u}>{u}</option>)}</select></td>
              <td className="px-2 py-1"><input type="number" step="any" className="w-full text-sm px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={it.metrado} onChange={e=>updateItem(it.id,{metrado:e.target.value})}/></td>
              <td className="px-2 py-1"><input type="number" step="any" className="w-full text-sm px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={it.pu} onChange={e=>updateItem(it.id,{pu:e.target.value})}/></td>
              <td className="px-2 py-1 text-center"><button type="button" onClick={()=>removeItem(it.id)} className="text-[#5C6376] hover:text-red-400">✕</button></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      <button type="button" onClick={addItem} className="text-xs font-medium text-[#B4B9C6] hover:text-white mb-3">+ Añadir ítem</button>

      {avisosPrecios.length>0 && (
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg p-3 mb-3 space-y-1.5">
          <p className="text-[11px] font-semibold text-[#8B92A5] uppercase tracking-wide">💡 Historial de precios</p>
          {avisosPrecios.map((a,i)=>(
            <p key={i} className="text-xs text-[#B4B9C6]">
              <span className="text-[#DADDE5]">{a.detalle}</span>: último precio {formatMoneyCur(a.m.ultimo.pu, a.m.ultimo.moneda)} — {a.m.ultimo.proveedorNombre} ({formatDate(a.m.ultimo.fecha)}, {a.m.vecesComprado} compra{a.m.vecesComprado===1?'':'s'} registrada{a.m.vecesComprado===1?'':'s'})
              {a.puActual>0 && Math.abs(a.diffPct)>=1 && (
                <span className={a.diffPct>0 ? 'text-red-400 font-medium' : 'text-emerald-400 font-medium'}> · {a.diffPct>0?'▲':'▼'} {Math.abs(a.diffPct).toFixed(0)}% {a.diffPct>0?'más caro':'más barato'} que la última vez</span>
              )}
            </p>
          ))}
        </div>
      )}
      <div className="text-right mb-3 font-mono text-sm text-[#B4B9C6] space-y-0.5">
        <p>Subtotal: {formatMoneyCur(subtotal, form.moneda)}</p><p>IGV (18%): {formatMoneyCur(igv, form.moneda)}</p>
        <p className="font-semibold text-base text-[#E1602A]">Total: {formatMoneyCur(total, form.moneda)}</p>
      </div>
      <Field label="Forma de pago"><input className={inputCls} value={form.formaPago} onChange={e=>setForm({...form, formaPago:e.target.value})}/></Field>
      <Field label="Observaciones internas"><textarea className={inputCls} rows={2} value={form.observaciones} onChange={e=>setForm({...form, observaciones:e.target.value})}/></Field>
      {errorGuardado && <p className="text-sm text-red-400 mb-2">⚠️ {errorGuardado}</p>}
      <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-[#1E2430]">Cancelar</button>
        <button type="submit" className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">Guardar orden</button>
      </div>
    </form>
  );
}

/* ---------------- Importar OC desde Excel real (lee el mismo formato F-003) ---------------- */
function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const d = new Date(utcDays*86400*1000);
  return d.toISOString().slice(0,10);
}
function parseDateCell(raw){
  if(raw==null || raw==='') return '';
  const s = String(raw).trim();
  if(/^\d+(\.\d+)?$/.test(s)) return excelSerialToDate(Number(s));
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(m){ let [,d,mo,y]=m; if(y.length===2) y='20'+y; return `${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`; }
  return '';
}
function colLetterOf(addr){ return addr.match(/[A-Z]+/)[0]; }
function rowNumOf(addr){ return parseInt(addr.match(/\d+/)[0],10); }
function colToIndex(col){ let n=0; for(const c of col) n=n*26+(c.charCodeAt(0)-64); return n; }
function decodeXmlText(s){ return String(s||'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&'); }

async function resolverHojaPorNombre(zip, nombreOPatron){
  const wbXmlFile = zip.file('xl/workbook.xml');
  const relsFile = zip.file('xl/_rels/workbook.xml.rels');
  if(!wbXmlFile || !relsFile) return null;
  const wbXml = await wbXmlFile.async('string');
  const relsXml = await relsFile.async('string');
  const esRegex = nombreOPatron instanceof RegExp;
  const candidatos = [...wbXml.matchAll(/<sheet[^>]*name="([^"]*)"[^>]*r:id="([^"]*)"[^>]*\/>/g)]
    .filter(m => {
      const nombre = decodeXmlText(m[1]).trim();
      return esRegex ? nombreOPatron.test(nombre) : nombre.toUpperCase() === nombreOPatron.trim().toUpperCase();
    });
  if(candidatos.length===0) return null;
  // si hay varias hojas coincidentes (ej. "SOLICITUD MATERIALES" y "SOLICITUD MATERIALES (2)", típico de
  // conflictos de sincronización de SharePoint), se prefiere la de mayor número entre paréntesis — suele
  // ser la copia más reciente tras resolver el conflicto
  candidatos.sort((a,b) => {
    const na = parseInt((decodeXmlText(a[1]).match(/\((\d+)\)\s*$/)||[])[1] || '0', 10);
    const nb = parseInt((decodeXmlText(b[1]).match(/\((\d+)\)\s*$/)||[])[1] || '0', 10);
    return nb - na;
  });
  const sheetMatch = candidatos[0];
  const rId = sheetMatch[2];
  const relMatch = relsXml.match(new RegExp(`<Relationship Id="${rId}"[^>]*Target="([^"]*)"`));
  if(!relMatch) return null;
  let target = relMatch[1];
  if(!target.startsWith('worksheets/')) target = 'worksheets/' + target.replace(/^.*\//,'');
  return zip.file('xl/' + target);
}

async function parseXlsxCells(arrayBuffer, nombreHoja){
  const zip = await JSZip.loadAsync(arrayBuffer);
  let sheetFile = null;
  if(nombreHoja) sheetFile = await resolverHojaPorNombre(zip, nombreHoja);
  if(!sheetFile) sheetFile = zip.file('xl/worksheets/sheet1.xml');
  if(!sheetFile){
    const candidates = Object.keys(zip.files).filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n));
    if(candidates.length) sheetFile = zip.file(candidates[0]);
  }
  if(!sheetFile) throw new Error('No se encontró una hoja de cálculo válida dentro del archivo.');
  const sheetXml = await sheetFile.async('string');

  let sharedStrings = [];
  const sharedFile = zip.file('xl/sharedStrings.xml');
  if(sharedFile){
    const sharedXml = await sharedFile.async('string');
    const siMatches = sharedXml.match(/<si>.*?<\/si>/gs) || [];
    sharedStrings = siMatches.map(si => decodeXmlText([...si.matchAll(/<t[^>]*>(.*?)<\/t>/gs)].map(m=>m[1]).join('')));
  }

  // soporta tanto <v> (shared strings / números / fórmulas, típico de Excel y SharePoint) como
  // <is><t>...</t></is> (inline strings, típico de Google Sheets, LibreOffice y otros exportadores) —
  // una cotización de un proveedor puede venir de cualquiera de las dos
  const cellRe = /<c r="([A-Z]+\d+)"([^>]*)>(?:(?:<f[^>]*\/>|<f[^>]*>.*?<\/f>)?(?:<v>(.*?)<\/v>|<is>(.*?)<\/is>))?<\/c>|<c r="([A-Z]+\d+)"([^>]*)\/>/gs;
  const cells = {};
  let m;
  while((m = cellRe.exec(sheetXml))){
    const addr = m[1]||m[5];
    const attrs = m[2]||m[6]||'';
    const rawV = m[3];
    const rawIs = m[4];
    if(rawIs!==undefined){
      const value = decodeXmlText([...rawIs.matchAll(/<t[^>]*>(.*?)<\/t>/gs)].map(t=>t[1]).join(''));
      if(value!=='') cells[addr] = value;
      continue;
    }
    if(rawV===undefined || rawV==='') continue;
    let value;
    if(/t="s"/.test(attrs)) value = sharedStrings[parseInt(rawV,10)] ?? '';
    else if(/t="str"/.test(attrs)) value = decodeXmlText(rawV);
    else value = rawV;
    cells[addr] = value;
  }
  return cells;
}
function buildRowIndex(cells){
  const rows = {};
  Object.entries(cells).forEach(([addr,val])=>{
    const row = rowNumOf(addr); const col = colToIndex(colLetterOf(addr));
    if(!rows[row]) rows[row]=[];
    rows[row].push({col, addr, val});
  });
  Object.values(rows).forEach(r=>r.sort((a,b)=>a.col-b.col));
  return rows;
}
const KNOWN_LABELS = new Set([
  'OBRA:','SOLICITANTE:','RAZÓN SOCIAL:','RAZON SOCIAL:','REPRESENTANTE LEGAL:','CONTACTO:','PARTIDA:',
  'RUC:','RUC/DNI','TELF:','BANCO','MONEDA:','CENTRO DE COSTO:','CÓDIGO:','CODIGO:','FECHA:',
  'MATERIAL (01)','ALQUILER (02)','SERVICIO (03)','OTROS (04)','N° DE CUENTA A DEPOSITAR:',
  'ITEM','DETALLE','UND','METRADO','PU','SUB TOTAL','PARCIAL','ENTREGA','FORMA DE PAGO:','NOTA:',
  'ENVIAR FACTURA A:','CONSIDERACIONES','GERENCIA DE ADMINISTRACIÓN Y FINANZAS','GERENCIA GENERAL',
  'C.C.','FECHA REQUERIDO:','SEMANA','SEM OBRA:','TIPO','ID\nPRODUCTO','DESCRIPCIÓN - DETALLE',
  'UNIDAD\nDE MEDIDA','FAMILIA','CANT','V°B°','COMENTARIOS','FECHA DE ENTREGA','CONSUMIDO',
]);
function findLabelValue(rows, labelRegex, maxCols=6){
  for(const rowNum of Object.keys(rows).map(Number).sort((a,b)=>a-b)){
    const cellsInRow = rows[rowNum];
    for(let i=0;i<cellsInRow.length;i++){
      const c = cellsInRow[i];
      if(typeof c.val==='string' && labelRegex.test(c.val.trim())){
        for(let j=i+1;j<cellsInRow.length;j++){
          if(cellsInRow[j].col - c.col > maxCols) break;
          const v = cellsInRow[j].val;
          if(v===undefined || String(v).trim()==='') continue;
          if(typeof v==='string' && KNOWN_LABELS.has(v.trim().toUpperCase())) break; // topamos con el siguiente campo: este quedó vacío
          return v;
        }
      }
    }
  }
  return '';
}
function formatearCodigoItem(raw){
  const s = String(raw).trim();
  const n = Number(s);
  if(!isNaN(n) && /^-?\d+\.?\d*$/.test(s)){
    // corrige errores de precisión de punto flotante (ej. 2.0099999999999998 -> 2.01)
    const redondeado = Math.round(n*100)/100;
    return Number.isInteger(redondeado) ? String(redondeado) : redondeado.toFixed(2).replace(/0$/,'').replace(/\.$/,'');
  }
  return s;
}
function extractItems(rows){
  let headerRow=null, cols={};
  for(const rowNum of Object.keys(rows).map(Number).sort((a,b)=>a-b)){
    const texts = rows[rowNum].map(c=>({...c, t: typeof c.val==='string'?c.val.trim().toUpperCase():''}));
    const itemCell = texts.find(c=>c.t==='ITEM'), detalleCell = texts.find(c=>c.t==='DETALLE');
    if(itemCell && detalleCell){
      headerRow = rowNum; cols.item=itemCell.col; cols.detalle=detalleCell.col;
      const u=texts.find(c=>c.t==='UND'); if(u) cols.und=u.col;
      const me=texts.find(c=>c.t==='METRADO'); if(me) cols.metrado=me.col;
      const pu=texts.find(c=>c.t==='PU'); if(pu) cols.pu=pu.col;
      break;
    }
  }
  if(!headerRow) return [];
  const items = []; let emptyStreak = 0;
  for(let r=headerRow+1; r<headerRow+80; r++){
    const byCol = {}; (rows[r]||[]).forEach(c=>{byCol[c.col]=c.val;});
    const detalle = byCol[cols.detalle], metrado = byCol[cols.metrado], pu = byCol[cols.pu];
    const detalleOk = detalle!=null && String(detalle).trim()!=='';
    const qtyOk = (metrado && Number(metrado)!==0) || (pu && Number(pu)!==0);
    if(!detalleOk || !qtyOk){
      // solo cuenta para el corte si la fila está totalmente vacía (sin texto ni cantidad) —
      // una fila con texto pero sin cantidad (nota, subtítulo, cronograma) no cuenta como "fin de la tabla"
      if(items.length>0 && !detalleOk){ emptyStreak++; if(emptyStreak>=8) break; }
      continue;
    }
    emptyStreak = 0;
    items.push({
      id: generateId(),
      item: byCol[cols.item]!=null ? formatearCodigoItem(byCol[cols.item]) : String(items.length+1),
      detalle: detalle!=null ? String(detalle) : '',
      und: byCol[cols.und]!=null ? String(byCol[cols.und]) : 'und',
      metrado: Number(metrado)||0,
      pu: Number(pu)||0,
    });
  }
  return items;
}
function limpiarRuc(raw){
  const s = String(raw||'').trim();
  // valores como "-", "--", "N/A", vacío, o cualquier cosa que no tenga al menos 8 dígitos, no son un RUC real
  const soloDigitos = s.replace(/\D/g,'');
  if(soloDigitos.length < 8) return '';
  return s;
}
async function importOcFromFile(file){
  const buf = await file.arrayBuffer();
  const cells = await parseXlsxCells(buf);
  const rows = buildRowIndex(cells);

  const obraNombre = String(findLabelValue(rows, /^OBRA:?$/i)).trim();
  const centroCosto = String(findLabelValue(rows, /^CENTRO DE COSTO:?$/i)).trim();
  const codigo = String(findLabelValue(rows, /^C[OÓ]DIGO:?$/i)).trim();
  const fecha = parseDateCell(findLabelValue(rows, /^FECHA:?$/i)) || new Date().toISOString().slice(0,10);
  const moneda = /D[OÓ]LAR/i.test(String(findLabelValue(rows,/^MONEDA:?$/i))) ? 'DOLARES' : 'SOLES';
  const partida = String(findLabelValue(rows, /^PARTIDA:?$/i)).trim();
  const plazoRequerido = parseDateCell(findLabelValue(rows, /^ENTREGA:?$/i));
  const formaPago = String(findLabelValue(rows, /^Forma de pago:?$/i)).trim() || 'AL CONTADO';

  const proveedorRazon = String(findLabelValue(rows, /^RAZ[OÓ]N SOCIAL:?$/i)).trim();
  const proveedorRuc = limpiarRuc(findLabelValue(rows, /^RUC\/DNI$/i));
  const representanteLegal = String(findLabelValue(rows, /^REPRESENTANTE LEGAL:?$/i)).trim();
  const contacto = String(findLabelValue(rows, /^CONTACTO:?$/i)).trim();
  const telefono = String(findLabelValue(rows, /^TELF:?$/i)).trim();
  const banco = String(findLabelValue(rows, /^BANCO$/i)).trim();
  const cuenta = String(findLabelValue(rows, /^N[°ºO] DE CUENTA/i)).trim();

  const items = extractItems(rows);
  const subtotal = items.reduce((s,it)=>s+(it.metrado*it.pu),0);
  const igv = subtotal*0.18, total = subtotal+igv;

  let tipoOC = 'Material';
  const codeParts = codigo.split('-');
  if(codeParts[1]){ const found = TIPOS_OC.find(t=>t.codigo===codeParts[1]); if(found) tipoOC = found.nombre; }

  return {
    _sourceFile: file.name,
    obraNombre, centroCosto, codigo: codigo||null, fecha, plazoRequerido, moneda, partida, formaPago,
    proveedor: { razonSocial: proveedorRazon, ruc: proveedorRuc, representanteLegal, contacto, telefono, banco, cuenta },
    items, subtotal, igv, total, tipoOC,
    _warnings: [
      !obraNombre && 'No se detectó el nombre de la obra',
      !proveedorRazon && 'No se detectó la razón social del proveedor',
      items.length===0 && 'No se detectaron ítems',
      !centroCosto && 'No se detectó el centro de costo',
    ].filter(Boolean),
  };
}

/* ---------------- Importador de Solicitudes de Materiales (SharePoint) ---------------- */
function extractItemsSolicitud(rows){
  let headerRow = null, cols = {};
  for(const rowNum of Object.keys(rows).map(Number).sort((a,b)=>a-b)){
    const byLabel = {};
    rows[rowNum].forEach(c => { if(typeof c.val==='string') byLabel[c.val.trim().toUpperCase()] = c.col; });
    if(byLabel['ITEM'] && (byLabel['DESCRIPCIÓN - DETALLE'] || byLabel['DESCRIPCION - DETALLE'])){
      headerRow = rowNum;
      cols = {
        item: byLabel['ITEM'], idProducto: byLabel['ID\nPRODUCTO'],
        detalle: byLabel['DESCRIPCIÓN - DETALLE'] || byLabel['DESCRIPCION - DETALLE'],
        unidad: byLabel['UNIDAD\nDE MEDIDA'], familia: byLabel['FAMILIA'], cant: byLabel['CANT'],
        partida: byLabel['PARTIDA'], vobo: byLabel['V°B°'], comentarios: byLabel['COMENTARIOS'],
        fechaEntrega: byLabel['FECHA DE ENTREGA'], consumido: byLabel['CONSUMIDO'],
      };
      break;
    }
  }
  if(!headerRow || !cols.detalle || !cols.cant) return [];
  const items = []; let emptyStreak = 0;
  for(let r=headerRow+1; r<headerRow+120; r++){
    const byCol = {}; (rows[r]||[]).forEach(c=>{byCol[c.col]=c.val;});
    const detalle = byCol[cols.detalle], cant = byCol[cols.cant];
    const detalleOk = detalle!=null && String(detalle).trim()!=='';
    let cantNum = cant!=null ? Number(cant) : NaN;
    if(isNaN(cantNum) && cant!=null){
      // a veces la cantidad viene mezclada con texto (ej. "falta 1") — se rescata el primer número que aparezca
      const m = String(cant).match(/\d+(?:[.,]\d+)?/);
      if(m) cantNum = normalizarMontoPE(m[0]);
    }
    const cantOk = !isNaN(cantNum) && cantNum>0;
    if(!detalleOk || !cantOk){
      if(items.length>0 && !detalleOk){ emptyStreak++; if(emptyStreak>=8) break; }
      continue;
    }
    emptyStreak = 0;
    items.push({
      id: generateId(),
      itemCodigo: cols.item && byCol[cols.item]!=null ? String(byCol[cols.item]) : String(items.length+1),
      idProducto: cols.idProducto && byCol[cols.idProducto]!=null ? String(byCol[cols.idProducto]) : '',
      detalle: String(detalle).trim(),
      unidad: cols.unidad && byCol[cols.unidad]!=null ? String(byCol[cols.unidad]).trim() : 'und',
      familia: cols.familia && byCol[cols.familia]!=null ? String(byCol[cols.familia]).trim() : '',
      cantidad: cantNum,
      voboOriginal: cols.vobo && byCol[cols.vobo]!=null ? String(byCol[cols.vobo]).trim() : '',
      comentarioOriginal: (cols.comentarios && byCol[cols.comentarios]!=null ? String(byCol[cols.comentarios]).trim() : '') + (String(cant).match(/[a-zA-Z]/) ? ` [cantidad original en el Excel: "${cant}"]` : ''),
      fechaEntrega: cols.fechaEntrega ? parseDateCell(byCol[cols.fechaEntrega]) : '',
      estado: 'No revisado',
      comentario: '',
    });
  }
  return items;
}

async function importSolicitudFromFile(file){
  const buf = await file.arrayBuffer();
  const cells = await parseXlsxCells(buf, /^SOLICITUD\s+(DE\s+)?MATERIALES(\s*\(\d+\))?$/i);
  const rows = buildRowIndex(cells);

  let numero = '';
  for(const rowNum of Object.keys(rows).map(Number).sort((a,b)=>a-b).slice(0,5)){
    for(const c of rows[rowNum]){
      if(typeof c.val==='string' && /SOLICITUD\s+DE\s+MATERIALES/i.test(c.val)){
        const m = c.val.match(/N°?\s*(\d+)/i);
        if(m) numero = m[1];
      }
    }
  }
  const obraNombre = String(findLabelValue(rows, /^OBRA:?$/i)).trim();
  const centroCosto = String(findLabelValue(rows, /^C\.C\.$/i)).trim();
  const solicitante = String(findLabelValue(rows, /^SOLICITANTE:?$/i)).trim();
  const fechaRequerido = parseDateCell(findLabelValue(rows, /^FECHA REQUERIDO:?$/i));
  const tipo = String(findLabelValue(rows, /^TIPO$/i)).trim() || 'Ordinario';
  const items = extractItemsSolicitud(rows);

  return {
    _sourceFile: file.name,
    numero, obraNombre, centroCosto, solicitante, fechaRequerido, tipo, items,
    _warnings: [
      !obraNombre && 'No se detectó el nombre de la obra',
      !centroCosto && 'No se detectó el centro de costo',
      items.length===0 && 'No se detectaron ítems',
    ].filter(Boolean),
  };
}

    const files = Array.from(e.target.files||[]);
    if(files.length===0) return;
    setLoading(true);
    const parsed = [];

      try {
        const r = await importOcFromFile(file);

    setChecked(prev => ({...prev, ...initChecked}));

    const seleccionados = results.filter((r,i) => checked[i] && !r._error);

}

function DonutChart({segments, size=150, thickness=16, centerLabel, centerSub}){
  const total = segments.reduce((s,seg)=>s+seg.value,0);
  const radius = (size - thickness)/2;
  const circumference = 2*Math.PI*radius;
  let offset = 0;
  return (
    <div className="flex items-center gap-5">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} className="shrink-0 -rotate-90">
        <circle cx={size/2} cy={size/2} r={radius} fill="none" stroke="#1A1F2A" strokeWidth={thickness}/>
        {total>0 && segments.map((seg,i)=>{
          const frac = seg.value/total;
          const dash = frac*circumference;
          const el = (
            <circle key={i} cx={size/2} cy={size/2} r={radius} fill="none" stroke={seg.color} strokeWidth={thickness}
              strokeDasharray={`${dash} ${circumference-dash}`} strokeDashoffset={-offset} strokeLinecap="butt"
              style={{filter:`drop-shadow(0 0 4px ${seg.color}55)`}}/>
          );
          offset += dash;
          return el;
        })}

      <div className="flex-1 min-w-0">
        {centerLabel!=null && <p className="text-2xl font-bold font-display text-[#F3F5F8] -mt-1">{centerLabel}</p>}

function DashboardView({proveedores, ordenes, proyectos}){
  const now = new Date();
  const [filtroEstado, setFiltroEstado] = useState('todos');

    const homologados = proveedores.filter(p=>p.homologado).length;
    const sinPagar = ordenes.filter(o=>o.estado==='No pagado');
    const pendienteDePago = sumByCurrency(sinPagar);
    const delMesPagado = ordenes.filter(o=>{const d=new Date(o.fecha); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear() && o.estado==='Pagado';});
    const pagadoMes = sumByCurrency(delMesPagado);
    return {total:proveedores.length, homologados, sinPagarCount:sinPagar.length, pendienteDePago, pagadoMes};
  }, [proveedores, ordenes]);
  const porMes = useMemo(()=>{
    const map={}, months=[];
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); const key=d.toLocaleDateString('es-PE',{month:'short',year:'2-digit'}); months.push(key); map[key]={mes:key,cantidad:0}; }
    ordenes.forEach(o=>{ const key=new Date(o.fecha).toLocaleDateString('es-PE',{month:'short',year:'2-digit'}); if(map[key]) map[key].cantidad++; });
    return months.map(m=>map[m]);
  }, [ordenes]);
  const hayDolares = ordenes.some(o=>o.moneda==='DOLARES');
  const gastoPorMes = useMemo(()=>{
    const map={}, months=[];
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); const key=d.toLocaleDateString('es-PE',{month:'short'}).replace('.',''); months.push(key); map[key]={solesPagado:0,solesNoPagado:0,dolaresPagado:0,dolaresNoPagado:0}; }
    ordenes.forEach(o=>{
      if(o.estado==='Desestimado') return; // no representa dinero real, no se grafica
      const key=new Date(o.fecha).toLocaleDateString('es-PE',{month:'short'}).replace('.','');
      if(!map[key]) return;
      const esDolares = o.moneda==='DOLARES';
      const esPagado = o.estado==='Pagado';
      const campo = (esDolares?'dolares':'soles') + (esPagado?'Pagado':'NoPagado');
      map[key][campo] += (o.montoTotal||0);
    });
    return months.map(m=>({label:m, ...map[m]}));
  }, [ordenes]);

  // ordenes que alimentan los gráficos agregados, según el filtro interactivo elegido arriba
  const ordenesFiltradas = useMemo(()=> filtroEstado==='todos' ? ordenes : ordenes.filter(o=>o.estado===filtroEstado), [ordenes, filtroEstado]);

  const topProveedoresPorMoneda = useMemo(()=>{
    const build = (moneda) => {
      const sums={};
      ordenesFiltradas.filter(o=>(o.moneda||'SOLES')===moneda).forEach(o=>{ if(o.proveedorId) sums[o.proveedorId]=(sums[o.proveedorId]||0)+(o.montoTotal||0); });
      return Object.entries(sums).map(([id,monto])=>({nombre:(proveedores.find(p=>p.id===id)||{}).razonSocial||'—', monto})).sort((a,b)=>b.monto-a.monto).slice(0,5);
    };
    return { soles: build('SOLES'), dolares: build('DOLARES') };
  }, [ordenesFiltradas, proveedores]);
  const porObra = useMemo(()=>{
    const map={};
    ordenes.forEach(o=>{
      if(!o.proyectoId) return;
      if(!map[o.proyectoId]) map[o.proyectoId]={soles:0,dolares:0,solesPendiente:0,dolaresPendiente:0};
      const esDolares = o.moneda==='DOLARES';
      const campo = esDolares ? 'dolares' : 'soles';
      if(o.estado==='Pagado') map[o.proyectoId][campo] += (o.montoTotal||0);
      else if(o.estado==='No pagado') map[o.proyectoId][campo+'Pendiente'] += (o.montoTotal||0);
      // Desestimado no cuenta ni como pagado ni como pendiente: no representa dinero real
    });
    return Object.entries(map).map(([id,v])=>({name:(proyectos.find(p=>p.id===id)||{}).nombre||'—', ...v})).sort((a,b)=>(b.soles+b.dolares*3.7)-(a.soles+a.dolares*3.7)).slice(0,8);
  }, [ordenes, proyectos]);
  const hasOrdenes = ordenes.length>0;
  const maxMes = Math.max(1, ...porMes.map(m=>m.cantidad));
  const maxProvSoles = Math.max(1, ...topProveedoresPorMoneda.soles.map(p=>p.monto));
  const maxProvDolares = Math.max(1, ...topProveedoresPorMoneda.dolares.map(p=>p.monto));

  const FILTROS = [
    {id:'todos', label:'Todos'},
    {id:'Pagado', label:'✅ Pagado'},
    {id:'No pagado', label:'⚠️ No pagado'},
    {id:'Desestimado', label:'🚫 Desestimado'},
  ];

  return (
    <div>
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <KpiCard icon="🏢" label="Proveedores" value={kpis.total} accent="#14293D"/>
        <KpiCard icon="✅" label="Homologados" value={kpis.homologados} accent="#2F8F5B"/>
        <KpiCard icon="⚠️" label={`Pendiente de pago (${kpis.sinPagarCount} OC)`} value={<MoneyDual soles={kpis.pendienteDePago.soles} dolares={kpis.pendienteDePago.dolares}/>} accent="#F87171"/>
        <KpiCard icon="💵" label="Pagado este mes" value={<MoneyDual soles={kpis.pagadoMes.soles} dolares={kpis.pagadoMes.dolares}/>} accent="#34D399"/>
      </div>
      {!hasOrdenes ? (
        <div className="bg-[#141821] border border-dashed border-[#2E3547] rounded-xl p-10 text-center text-[#5C6376] text-sm">📭 Aún no hay órdenes de compra. Los gráficos aparecerán aquí en cuanto generes la primera.</div>
      ) : (
        <>
        <div className="flex items-center gap-2 mb-4">
          <span className="text-xs text-[#5C6376]">Filtrar "Top proveedores" por:</span>
          {FILTROS.map(f=>(
            <button key={f.id} onClick={()=>setFiltroEstado(f.id)} className={`px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ${filtroEstado===f.id ? 'bg-[#E1602A] border-[#E1602A] text-white' : 'border-[#2E3547] text-[#8B92A5] hover:bg-white/5'}`}>{f.label}</button>
          ))}
        </div>
        <div className="grid md:grid-cols-2 gap-4">
          <div className="bg-[#141821] rounded-xl border border-[#232838] p-4">
            <p className="text-sm font-semibold text-[#DADDE5] mb-3">Órdenes generadas por mes</p>
            {porMes.map(m=>(<BarRow key={m.mes} label={m.mes} value={m.cantidad} max={maxMes} color="#3B7EA6"/>))}
          </div>
          <div className="bg-[#141821] rounded-xl border border-[#232838] p-4">
            <p className="text-sm font-semibold text-[#DADDE5] mb-3">Gastado por mes {hayDolares && <span className="text-xs font-normal text-[#5C6376]">(soles)</span>}</p>
            <VerticalBarChart data={gastoPorMes.map(m=>({label:m.label, pagado:m.solesPagado, noPagado:m.solesNoPagado}))}/>
            {hayDolares && <>
              <p className="text-sm font-semibold text-[#DADDE5] mb-3 mt-5">Gastado por mes (dólares)</p>
              <VerticalBarChart data={gastoPorMes.map(m=>({label:m.label, pagado:m.dolaresPagado, noPagado:m.dolaresNoPagado}))} trackHeight={110}/>
            </>}
          </div>
          <div className="bg-[#141821] rounded-xl border border-[#232838] p-4">
            <p className="text-sm font-semibold text-[#DADDE5] mb-3">Top proveedores por monto {filtroEstado!=='todos' && <span className="text-xs font-normal text-[#5C6376]">({filtroEstado.toLowerCase()})</span>} {hayDolares && <span className="text-xs font-normal text-[#5C6376]">(S/ y US$ por separado)</span>}</p>
            {topProveedoresPorMoneda.soles.length===0 && topProveedoresPorMoneda.dolares.length===0 ? <p className="text-sm text-[#5C6376] py-10 text-center">Sin datos con este filtro.</p> : (
              <>
                {topProveedoresPorMoneda.soles.length>0 && <>
                  {hayDolares && <p className="text-[11px] font-semibold text-[#5C6376] uppercase mb-1">En soles</p>}
                  {topProveedoresPorMoneda.soles.map((p,i)=><BarRow key={'s'+i} label={p.nombre} value={Math.round(p.monto)} max={maxProvSoles} color={CHART_COLORS[i%CHART_COLORS.length]}/>)}
                </>}
                {topProveedoresPorMoneda.dolares.length>0 && <>
                  <p className="text-[11px] font-semibold text-[#5C6376] uppercase mb-1 mt-3">En dólares</p>
                  {topProveedoresPorMoneda.dolares.map((p,i)=><BarRow key={'d'+i} label={p.nombre} value={Math.round(p.monto)} max={maxProvDolares} color={CHART_COLORS[i%CHART_COLORS.length]}/>)}
                </>}
              </>
            )}
          </div>
          <div className="bg-[#141821] rounded-xl border border-[#232838] p-4">
            <p className="text-sm font-semibold text-[#DADDE5] mb-3">Gasto real por obra <span className="text-xs font-normal text-[#5C6376]">(solo pagado{hayDolares?', S/ y US$ por separado':''})</span></p>
            {porObra.length===0 ? <p className="text-sm text-[#5C6376] py-10 text-center">Sin datos aún.</p> : (
              <div className="space-y-2.5">
                {porObra.map((o,i)=>{
                  const tienePendiente = o.solesPendiente>0 || o.dolaresPendiente>0;
                  return (
                    <div key={i} className="flex items-center justify-between text-sm pb-2 border-b border-[#1A1F2A] last:border-0 last:pb-0">
                      <span className="text-[#B4B9C6] truncate max-w-[45%]">{o.name}</span>
                      <div className="text-right">
                        <MoneyDual soles={o.soles} dolares={o.dolares} className="font-mono text-xs text-emerald-300"/>
                        {tienePendiente && <div className="font-mono text-[10px] text-red-400 mt-0.5">+ <MoneyDual soles={o.solesPendiente} dolares={o.dolaresPendiente}/> pendiente</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
        </>
      )}
    </div>
  );
}

const ESTADOS_ITEM_SOLICITUD = ['No revisado','Pendiente de cotización','Pendiente de pago','Pendiente de despacho','Comprado','Entregado','Rechazado'];
const ESTADO_ITEM_STYLE = {
  'No revisado':'bg-slate-500/15 text-slate-400 border-slate-500/40',
  'Pendiente de cotización':'bg-amber-500/15 text-amber-300 border-amber-500/40',
  'Pendiente de pago':'bg-orange-500/15 text-orange-300 border-orange-500/40',
  'Pendiente de despacho':'bg-blue-500/15 text-blue-300 border-blue-500/40',
  'Comprado':'bg-cyan-500/15 text-cyan-300 border-cyan-500/40',
  'Entregado':'bg-emerald-500/15 text-emerald-300 border-emerald-500/40',
  'Rechazado':'bg-red-500/15 text-red-300 border-red-500/40',
};
// palabras clave -> categoria sugerida, para cuando el Excel no trae "Familia" o para emparejar con las categorías de proveedores
const REGLAS_CATEGORIA_MATERIAL = [
  { patron:/MADERA|LIST[OÓ]N|FEN[OÓ]LICO|TRIPLAY|TABLA/i, categoria:'Madera' },
  { patron:/CEMENTO|CONCRETO|MORTERO/i, categoria:'Cemento' },
  { patron:/FIERRO|ACERO|VARILLA|ALAMBRE/i, categoria:'Fierro y Acero' },
  { patron:/EPP|CASCO|GUANTE|LENTE|CHALECO|ARN[EÉ]S|MASCARILLA|RESPIRADOR/i, categoria:'Seguridad Industrial (EPP)' },
  { patron:/EL[EÉ]CTRIC|CABLE|TOMACORRIENTE|INTERRUPTOR|LUMINARIA/i, categoria:'Eléctrico' },
  { patron:/TUBER[IÍ]A|PVC|PLOMER[IÍ]A|SANITARIO|GRIFER[IÍ]A/i, categoria:'Plomería' },
  { patron:/PINTURA|BARNIZ|ESMALTE|SOLVENTE/i, categoria:'Pintura' },
  { patron:/DISCO|ABRASIVO|LIJA/i, categoria:'Discos y Abrasivos' },
  { patron:/HERRAMIENTA|TALADRO|MARTILLO|LLAVE|DESTORNILLADOR/i, categoria:'Herramientas' },
  { patron:/FERRETER/i, categoria:'Ferretería' },
];
function detectarCategoriaMaterial(item){
  if(item.familia && item.familia.trim()) return item.familia.trim();
  const regla = REGLAS_CATEGORIA_MATERIAL.find(r=>r.patron.test(item.detalle));
  return regla ? regla.categoria : 'Sin categoría';
}

function ImportSolicitudesModal({solicitudes, proyectos, onClose, onConfirm}){
  const [results, setResults] = useState([]);
  const [checked, setChecked] = useState({});
  const [loading, setLoading] = useState(false);
  const fileRef = React.useRef(null);

  const handleFiles = async (e) => {
    const files = Array.from(e.target.files||[]);
    if(files.length===0) return;
    setLoading(true);
    const parsed = [];
    for(const file of files){
      try {
        const r = await importSolicitudFromFile(file);
        const proyecto = proyectos.find(p=>p.centroCosto===r.centroCosto);
        r._proyecto = proyecto || null;
        r._duplicado = !!(r.numero && r.centroCosto && solicitudes.some(s=>s.numero===r.numero && s.centroCosto===r.centroCosto));
        parsed.push(r);
      } catch(err){
        parsed.push({ _sourceFile: file.name, _error: err.message });
      }
    }
    setResults(prev => [...prev, ...parsed]);
    const initChecked = {};
    parsed.forEach((r,i) => { initChecked[results.length+i] = !r._error && !r._duplicado; });
    setChecked(prev => ({...prev, ...initChecked}));
    setLoading(false);
    e.target.value = '';
  };

  const confirmar = () => onConfirm(results.filter((r,i) => checked[i] && !r._error));
  const totalOk = results.filter(r=>!r._error).length;

  return (
    <Modal title="Importar Solicitudes de Materiales desde Excel" onClose={onClose} wide>
      <p className="text-xs text-[#8B92A5] mb-3">Sube uno o varios archivos .xlsx/.xlsm de solicitudes (formato "SOLICITUD DE MATERIALES"). Se lee únicamente la hoja "SOLICITUD MATERIALES" — las demás hojas (Base de datos, Lookahead, Cronograma, etc.) se ignoran.</p>
      <input ref={fileRef} type="file" accept=".xlsx,.xlsm" multiple onChange={handleFiles} className="hidden"/>
      <button type="button" onClick={()=>fileRef.current.click()} disabled={loading} className="w-full border-2 border-dashed border-[#2E3547] rounded-lg py-6 text-sm text-[#8B92A5] hover:border-[#E1602A] hover:text-[#E1602A] transition-colors mb-3 disabled:opacity-50">
        {loading ? 'Leyendo…' : '📤 Seleccionar archivos Excel (.xlsx/.xlsm)'}
      </button>

      {results.length>0 && (
        <div className="border border-[#232838] rounded-lg overflow-hidden max-h-96 overflow-y-auto divide-y divide-[#1E2330] mb-3">
          {results.map((r,i)=>(
            <label key={i} className={`flex items-start gap-2 p-2.5 cursor-pointer ${r._error?'bg-red-500/5':r._duplicado?'bg-amber-500/5':''}`}>
              <input type="checkbox" className="mt-1 w-4 h-4" checked={!!checked[i]} disabled={!!r._error} onChange={e=>setChecked({...checked,[i]:e.target.checked})}/>
              <div className="min-w-0 flex-1">
                <p className="text-[10px] font-mono text-[#5C6376] truncate">{r._sourceFile}</p>
                {r._error ? <p className="text-xs text-red-400">⚠️ {r._error}</p> : (
                  <>
                    <p className="text-sm text-[#DADDE5]">N°{r.numero||'—'} — {r._proyecto ? r._proyecto.nombre : (r.obraNombre||'sin obra')} {!r._proyecto && <span className="text-amber-400">(obra no encontrada por C.C. {r.centroCosto||'?'})</span>}</p>
                    <p className="text-xs text-[#8B92A5]">{r.items.length} ítem(s) · {r.solicitante||'—'} · {formatDate(r.fechaRequerido)} · {r.tipo}</p>
                    {r._duplicado && <p className="text-xs text-amber-400">⚠️ Ya existe una solicitud N°{r.numero} para esta obra — desmárcala si no quieres duplicarla.</p>}
                    {r.items.length===0 && <p className="text-xs text-amber-400">⚠️ No se detectaron ítems.</p>}
                  </>
                )}
              </div>
            </label>
          ))}
        </div>
      )}

      <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
        <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-[#1E2430]">Cancelar</button>
        <button type="button" disabled={totalOk===0} onClick={confirmar} className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-40">Confirmar importación ({Object.values(checked).filter(Boolean).length})</button>
      </div>
    </Modal>
  );
}

  );

  const actualizarItem = (itemActualizado) => {
    onSave({...solicitud, items: solicitud.items.map(it=>it.id===itemActualizado.id?itemActualizado:it)});
  };
  const eliminarItem = (id) => {
    if(!confirm('¿Quitar este ítem de la solicitud (ej. porque se desestimó)?')) return;
    onSave({...solicitud, items: solicitud.items.filter(it=>it.id!==id)});

          <div className="flex justify-end gap-2"><button onClick={()=>setEditandoCabecera(false)} className="px-3 py-1.5 text-xs rounded-lg text-[#B4B9C6] hover:bg-white/5">Cancelar</button><button onClick={guardarCabecera} className="px-3 py-1.5 text-xs rounded-lg text-white font-medium bg-[#E1602A]">Guardar</button></div>

        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2"><p className="uppercase text-[10px]">Solicitante</p><p className="text-sm text-[#DADDE5]">{solicitud.solicitante||'—'}</p></div>
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2"><p className="uppercase text-[10px]">Fecha requerido</p><p className="text-sm text-[#DADDE5]">{formatDate(solicitud.fechaRequerido)}</p></div>
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2"><p className="uppercase text-[10px]">Tipo</p><p className="text-sm text-[#DADDE5]">{solicitud.tipo}</p></div>

      {!editandoCabecera && (

              {ESTADOS_ITEM_SOLICITUD.map(s=><option key={s} value={s}>{s}</option>)}
