/* ---------------- Automatizador de OCs: sube una cotización de cualquier proveedor (materiales o
   servicios), en el formato que sea, y genera la OC en tu formato F-003 en un par de clics ---------------- */
function AutomatizadorOCView({ordenes, setOrdenes, proveedores, setProveedores, proyectos, setProyectos, config}){
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [leyendo, setLeyendo] = useState(false);
  const [progreso, setProgreso] = useState(0);
  const [cotizacionPendiente, setCotizacionPendiente] = useState(null); // {items, pistaIncluyeIgv, nombreArchivo}
  const [arrastrando, setArrastrando] = useState(false);
  const [ultimaOC, setUltimaOC] = useState(null); // {oc, prov, proy} — resumen tras guardar, para descarga rápida
  const fileRef = React.useRef(null);

  const procesarArchivo = async (file) => {
    if(!file) return;
    setLeyendo(true); setProgreso(0); setUltimaOC(null);
    try {
      const { items, pistaIncluyeIgv } = await leerCotizacionArchivo(file, setProgreso);
      if(items.length===0){
        alert('No se detectó ningún ítem con precio en el documento. Se abrirá una OC en blanco para que ingreses los ítems manualmente.');
      }
      setCotizacionPendiente({ items, pistaIncluyeIgv, nombreArchivo: file.name });
    } catch(err){
      alert('No se pudo leer el documento: ' + err.message);
    }
    setLeyendo(false);
  };

  const handleFile = (e) => { procesarArchivo(e.target.files[0]); e.target.value=''; };
  const handleDrop = (e) => {
    e.preventDefault(); setArrastrando(false);
    if(leyendo) return;
    procesarArchivo(e.dataTransfer.files && e.dataTransfer.files[0]);
  };

  const confirmarIgv = (yaIncluyeIgv) => {
    const { items, nombreArchivo } = cotizacionPendiente;
    const itemsAjustados = items.map(it => ({ ...it, pu: yaIncluyeIgv ? Math.round((it.pu/1.18)*100)/100 : it.pu }));
    setEditing({
      fecha:new Date().toISOString().slice(0,10), proveedorId:'', proyectoId:'', tipoOC:'Material', estado:'No pagado',
      partida:'', plazoRequerido:'', fechaEntregaReal:'', formaPago:'AL CONTADO', moneda:'SOLES',
      observaciones:`Generado con el Automatizador de OCs desde: ${nombreArchivo} — revisa los ítems, la lectura automática puede fallar.${yaIncluyeIgv?' (precios ajustados: el documento traía el IGV incluido)':''}`,
      items: itemsAjustados.length ? itemsAjustados : [{id:generateId(), item:'1', detalle:'', und:'und', metrado:1, pu:0}],
    });
    setCotizacionPendiente(null);
    setShowForm(true);
  };

  const save = (form) => {
    setOrdenes(prev=> prev.some(o=>o.id===form.id)? prev.map(o=>o.id===form.id?form:o) : [...prev, form]);
    setShowForm(false); setEditing(null);
    setUltimaOC({ oc: form, prov: proveedores.find(p=>p.id===form.proveedorId), proy: proyectos.find(p=>p.id===form.proyectoId) });
  };

  return (
    <div>
      {proyectos.length===0 && <div className="mb-4 bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm rounded-lg px-3 py-2">⚠️ Primero registra una obra en "Obras" para poder generar órdenes de compra.</div>}
      <div
        onDragOver={e=>{e.preventDefault(); if(!leyendo) setArrastrando(true);}}
        onDragLeave={()=>setArrastrando(false)}
        onDrop={handleDrop}
        className={`border-2 border-dashed rounded-xl p-10 text-center transition-colors ${arrastrando?'border-[#E1602A] bg-[#E1602A]/5':'border-[#2E3547]'}`}
      >
        <input ref={fileRef} type="file" accept="application/pdf,image/*,.xlsx,.xls" onChange={handleFile} className="hidden"/>
        <p className="text-3xl mb-2">⚡</p>
        <p className="text-sm text-[#DADDE5] font-medium mb-1">Arrastra aquí la cotización del proveedor</p>
        <p className="text-xs text-[#5C6376] mb-4">PDF, foto o Excel — de materiales o de servicios, con el formato que te la mande el proveedor.</p>
        {!READONLY && <button type="button" onClick={()=>fileRef.current.click()} disabled={leyendo || proyectos.length===0} className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-50">{leyendo?`Leyendo… ${progreso}%`:'Seleccionar archivo'}</button>}
      </div>

      {ultimaOC && (
        <div className="mt-4 bg-emerald-500/10 border border-emerald-500/30 rounded-lg px-4 py-3 flex items-center justify-between gap-3 flex-wrap">
          <div>
            <p className="text-sm text-emerald-300 font-medium">✅ OC {ultimaOC.oc.codigo} generada — {ultimaOC.prov?ultimaOC.prov.razonSocial:'—'} · {formatMoneyCur(ultimaOC.oc.montoTotal, ultimaOC.oc.moneda)}</p>
            <p className="text-xs text-[#8B92A5]">Obra: {ultimaOC.proy?ultimaOC.proy.nombre:'—'} · Tipo: {ultimaOC.oc.tipoOC}</p>
          </div>
          <button onClick={()=>exportOcToExcel(ultimaOC.oc, ultimaOC.prov, ultimaOC.proy, config)} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] whitespace-nowrap">📥 Descargar Excel</button>
        </div>
      )}

      <div className="mt-6 bg-[#141821] rounded-xl border border-[#232838] p-4">
        <p className="text-xs font-semibold text-[#8B92A5] uppercase tracking-wide mb-2">Cómo funciona</p>
        <ol className="text-sm text-[#B4B9C6] space-y-1.5 list-decimal list-inside">
          <li>Sube la cotización tal cual te la mandó el proveedor (PDF, foto o Excel), sea de materiales o de servicios.</li>
          <li>CANTERA detecta automáticamente los ítems con precio.</li>
          <li>Confirmas si esos precios ya incluyen IGV o no.</li>
          <li>Eliges obra, proveedor y tipo de OC, revisas los ítems y guardas — queda lista en tu formato F-003 de siempre, con su código correlativo.</li>
        </ol>
        <p className="text-xs text-[#5C6376] mt-3">La lectura automática es heurística: siempre revisa los ítems detectados antes de guardar, sobre todo en cotizaciones con formatos poco comunes.</p>
      </div>

      {showForm && <Modal title="Nueva orden de compra" onClose={()=>{setShowForm(false); setEditing(null);}} wide><OCForm initial={editing} proveedores={proveedores} proyectos={proyectos} ordenes={ordenes} onSave={save} onCancel={()=>{setShowForm(false); setEditing(null);}}/></Modal>}
      {cotizacionPendiente && <ConfirmarIgvCotizacionModal cantidadItems={cotizacionPendiente.items.length} pistaIncluyeIgv={cotizacionPendiente.pistaIncluyeIgv} onConfirmar={confirmarIgv} onCancelar={()=>setCotizacionPendiente(null)}/>}
    </div>
  );
}

function OrdenesView({ordenes, setOrdenes, proveedores, setProveedores, proyectos, setProyectos, config, initialObraFilter, tipoFiltro}){
  const [showForm, setShowForm] = useState(false); const [editing, setEditing] = useState(null);
  const filtrosGuardados = loadLS('cantera_filtros_ordenes', {});
  const [estadoFilter, setEstadoFilter] = useState(filtrosGuardados.estadoFilter || '');
  const [obraFilter, setObraFilter] = useState(initialObraFilter || filtrosGuardados.obraFilter || '');
  const [waOc, setWaOc] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [leyendoCotizacion, setLeyendoCotizacion] = useState(false);
  const [progresoCotizacion, setProgresoCotizacion] = useState(0);
  const [cotizacionPendiente, setCotizacionPendiente] = useState(null); // {items, pistaIncluyeIgv, nombreArchivo}
  const cotizacionFileRef = React.useRef(null);
  const handleCotizacion = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setLeyendoCotizacion(true); setProgresoCotizacion(0);
    try {
      const { items, pistaIncluyeIgv } = await leerCotizacionArchivo(file, setProgresoCotizacion);
      if(items.length===0) alert('No se detectó ningún ítem con precio en el documento. Se abrirá una OC en blanco para que ingreses los ítems manualmente.');
      setCotizacionPendiente({ items, pistaIncluyeIgv, nombreArchivo: file.name });
    } catch(err){
      alert('No se pudo leer el documento: ' + err.message);
    }
    setLeyendoCotizacion(false);
    e.target.value = '';
  };
  const confirmarIgvCotizacion = (yaIncluyeIgv) => {
    const { items, nombreArchivo } = cotizacionPendiente;
    const itemsAjustados = items.map(it => ({ ...it, pu: yaIncluyeIgv ? Math.round((it.pu/1.18)*100)/100 : it.pu }));
    setEditing({
      fecha:new Date().toISOString().slice(0,10), proveedorId:'', proyectoId:'', tipoOC: tipoFiltro||'Material', estado:'No pagado',
      partida:'', plazoRequerido:'', fechaEntregaReal:'', formaPago:'AL CONTADO', moneda:'SOLES',
      observaciones:`Generado desde cotización: ${nombreArchivo} — revisa los ítems, la lectura automática puede fallar.${yaIncluyeIgv?' (precios ajustados: el documento traía el IGV incluido)':''}`,
      items: itemsAjustados.length ? itemsAjustados : [{id:generateId(), item:'1', detalle:'', und:'und', metrado:1, pu:0}],
    });
    setCotizacionPendiente(null);
    setShowForm(true);
  };
  const [ordenarPor, setOrdenarPor] = useState(filtrosGuardados.ordenarPor || 'fecha');
  const [ordenDireccion, setOrdenDireccion] = useState(filtrosGuardados.ordenDireccion || 'desc');
  useEffect(() => {
    saveLS('cantera_filtros_ordenes', { estadoFilter, obraFilter, ordenarPor, ordenDireccion });
  }, [estadoFilter, obraFilter, ordenarPor, ordenDireccion]);
  const ORDENAR_OPCIONES = { fecha: 'Fecha', codigo: 'Código', monto: 'Monto', plazo: 'Plazo requerido' };
  const comparadores = {
    fecha: (a,b) => new Date(a.fecha) - new Date(b.fecha),
    codigo: (a,b) => String(a.codigo||'').localeCompare(String(b.codigo||''), 'es', {numeric:true}),
    monto: (a,b) => (a.montoTotal||0) - (b.montoTotal||0),
    plazo: (a,b) => new Date(a.plazoRequerido||0) - new Date(b.plazoRequerido||0),
  };
  const filtered = ordenes
    .filter(o=>(!tipoFiltro||o.tipoOC===tipoFiltro)&&(!estadoFilter||o.estado===estadoFilter)&&(!obraFilter||o.proyectoId===obraFilter))
    .sort((a,b) => comparadores[ordenarPor](a,b) * (ordenDireccion==='asc'?1:-1));
  const save = (form) => { setOrdenes(prev=> prev.some(o=>o.id===form.id)? prev.map(o=>o.id===form.id?form:o) : [...prev, form]); setShowForm(false); setEditing(null); };
  const remove = (id) => { if(confirm('¿Eliminar esta orden de compra?')) setOrdenes(prev=>prev.filter(o=>o.id!==id)); };
  const proveedorDe = (id) => proveedores.find(p=>p.id===id);
  const proyectoDe = (id) => proyectos.find(p=>p.id===id);

  const confirmarImportacion = (seleccionados, {estado}) => {
    let proveedoresActuales = [...proveedores];
    let proyectosActuales = [...proyectos];
    const nuevasOrdenes = [];

    seleccionados.forEach(r => {
      // buscar o crear proveedor por RUC (o por razón social exacta si el Excel no trae un RUC real)
      let proveedor = r.proveedor.ruc
        ? proveedoresActuales.find(p=>p.ruc===r.proveedor.ruc)
        : (r.proveedor.razonSocial ? proveedoresActuales.find(p=>!limpiarRuc(p.ruc) && p.razonSocial.trim().toUpperCase()===r.proveedor.razonSocial.trim().toUpperCase()) : null);
      if(!proveedor && r.proveedor.razonSocial){
        proveedor = {
          id: generateId(), razonSocial: r.proveedor.razonSocial, ruc: r.proveedor.ruc||'',
          categorias: [], region: REGIONES[14], distrito: '',
          representanteLegal: r.proveedor.representanteLegal||'', contacto: r.proveedor.contacto||'',
          telefono: r.proveedor.telefono||'', email: '', banco: r.proveedor.banco||'', cuenta: r.proveedor.cuenta||'',
          homologado: false, notas: 'Importado automáticamente desde Excel — completa categoría y región.'
        };
        proveedoresActuales = [...proveedoresActuales, proveedor];
      }
      // buscar o crear obra por centro de costo
      let proyecto = r.centroCosto ? proyectosActuales.find(p=>p.centroCosto===r.centroCosto) : null;
      if(!proyecto && r.centroCosto){
        proyecto = { id: generateId(), nombre: r.obraNombre || `Obra ${r.centroCosto}`, centroCosto: r.centroCosto, solicitante: '', region: REGIONES[14] };
        proyectosActuales = [...proyectosActuales, proyecto];
      }
      const tipoInfo = TIPOS_OC.find(t=>t.nombre===r.tipoOC) || TIPOS_OC[0];
      const codigo = r.codigo || (proyecto ? `${proyecto.centroCosto}-${tipoInfo.codigo}-IMP${String(nuevasOrdenes.length+1).padStart(3,'0')}` : `IMP-${Date.now()}`);
      nuevasOrdenes.push({
        id: generateId(), codigo, fecha: r.fecha, proveedorId: proveedor?proveedor.id:'', proyectoId: proyecto?proyecto.id:'',
        tipoOC: r.tipoOC, estado, partida: r.partida, plazoRequerido: r.plazoRequerido, fechaEntregaReal: '',
        formaPago: r.formaPago, moneda: r.moneda, observaciones: `Importado desde ${r._sourceFile}`,
        items: r.items, montoSubtotal: r.subtotal, montoIgv: r.igv, montoTotal: r.total,
      });
    });

    setProveedores(proveedoresActuales);
    setProyectos(proyectosActuales);
    setOrdenes(prev => [...prev, ...nuevasOrdenes]);
    setShowImport(false);
  };

  return (
    <div>
      {proyectos.length===0 && <div className="mb-4 bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm rounded-lg px-3 py-2">⚠️ Primero registra una obra en "Obras" para poder generar órdenes de compra.</div>}
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select className={inputCls+' w-auto'} value={estadoFilter} onChange={e=>setEstadoFilter(e.target.value)}><option value="">Todos los estados</option>{ESTADOS_OC.map(s=><option key={s}>{s}</option>)}</select>
        <select className={inputCls+' w-auto'} value={obraFilter} onChange={e=>setObraFilter(e.target.value)}><option value="">Todas las obras</option>{proyectos.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select>
        <div className="flex items-center gap-1">
          <span className="text-xs text-[#5C6376]">Ordenar por</span>
          <select className={inputCls+' w-auto'} value={ordenarPor} onChange={e=>setOrdenarPor(e.target.value)}>
            {Object.entries(ORDENAR_OPCIONES).map(([k,label])=><option key={k} value={k}>{label}</option>)}
          </select>
          <button
            type="button"
            onClick={()=>setOrdenDireccion(d=>d==='asc'?'desc':'asc')}
            title={ordenDireccion==='asc' ? 'Ascendente' : 'Descendente'}
            className="px-2.5 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5 flex items-center gap-1"
          >
            {ordenDireccion==='asc' ? '↑ Asc.' : '↓ Desc.'}
          </button>
        </div>
        <div className="flex-1"/>
        <input ref={cotizacionFileRef} type="file" accept="application/pdf,image/*,.xlsx,.xls" onChange={handleCotizacion} className="hidden"/>
        {!READONLY && <button onClick={()=>cotizacionFileRef.current.click()} disabled={leyendoCotizacion} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5 disabled:opacity-50">{leyendoCotizacion?`Leyendo… ${progresoCotizacion}%`:'📄 Generar OC desde cotización'}</button>}
        {!READONLY && <button onClick={()=>setShowImport(true)} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">📤 Importar desde Excel</button>}
        {!READONLY && <button onClick={()=>{setEditing(null); setShowForm(true);}} disabled={proyectos.length===0} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-40">+ {tipoFiltro==='Servicio' ? 'Nuevo servicio' : 'Nueva orden'}</button>}
      </div>
      <div className="bg-[#141821] rounded-xl border border-[#232838] overflow-hidden overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-[#1A1F2A] text-[#8B92A5] text-xs uppercase tracking-wide"><tr><th className="text-left px-4 py-2.5">Código</th><th className="text-left px-4 py-2.5">Obra</th><th className="text-left px-4 py-2.5">Proveedor</th><th className="text-left px-4 py-2.5">Plazo</th><th className="text-right px-4 py-2.5">Monto</th><th className="text-left px-4 py-2.5">Estado</th><th className="px-4 py-2.5"></th></tr></thead>
          <tbody className="divide-y divide-[#1E2330]">
            {filtered.map(o=>{ const prov=proveedorDe(o.proveedorId); const proy=proyectoDe(o.proyectoId); return (
              <tr key={o.id} className="hover:bg-[#1A1F2A]/60">
                <td className="px-4 py-2.5 font-mono text-[#DADDE5]">{o.codigo}</td>
                <td className="px-4 py-2.5 text-[#B4B9C6]">{proy?proy.nombre:'—'}</td>
                <td className="px-4 py-2.5 text-[#DADDE5]">{prov?prov.razonSocial:'—'}</td>
                <td className="px-4 py-2.5 text-[#B4B9C6]">{formatDate(o.plazoRequerido)}</td>
                <td className="px-4 py-2.5 text-right font-mono text-[#DADDE5]">{formatMoneyCur(o.montoTotal, o.moneda)}</td>
                <td className="px-4 py-2.5"><select value={o.estado} onChange={e=>setOrdenes(prev=>prev.map(x=>x.id===o.id?{...x, estado:e.target.value}:x))} className={`text-xs font-medium rounded-md border px-1.5 py-1 ${ESTADO_STYLE[o.estado]||ESTADO_STYLE['No pagado']}`}>{ESTADOS_OC.map(s=><option key={s}>{s}</option>)}</select></td>
                <td className="px-4 py-2.5"><div className="flex items-center gap-2 justify-end">{prov && <button onClick={()=>setWaOc(o)} className="text-[#5C6376] hover:text-emerald-400">💬</button>}<button onClick={()=>exportOcToExcel(o, proveedorDe(o.proveedorId), proyectoDe(o.proyectoId), config)} title="Imprimir" className="text-[#5C6376] hover:text-[#DADDE5]">🖨️</button><button onClick={()=>exportOcToExcel(o, proveedorDe(o.proveedorId), proyectoDe(o.proyectoId), config)} title="Descargar Excel" className="text-[#5C6376] hover:text-[#DADDE5]">📥</button><button onClick={()=>{setEditing(o); setShowForm(true);}} className="text-[#5C6376] hover:text-[#DADDE5]">✏️</button><button onClick={()=>remove(o.id)} className="text-[#5C6376] hover:text-red-400">🗑️</button></div></td>
              </tr>
            );})}
            {filtered.length===0 && <tr><td colSpan={8} className="text-center text-[#5C6376] py-10 text-sm">{tipoFiltro==='Servicio' ? 'No hay servicios registrados todavía.' : 'No hay órdenes de compra registradas todavía.'}</td></tr>}
          </tbody>
        </table>
      </div>
      {showForm && <Modal title={editing&&editing.id?`Editar ${editing.codigo}`:(tipoFiltro==='Servicio'?'Nuevo servicio':'Nueva orden de compra')} onClose={()=>{setShowForm(false); setEditing(null);}} wide><OCForm initial={editing} proveedores={proveedores} proyectos={proyectos} ordenes={ordenes} onSave={save} onCancel={()=>{setShowForm(false); setEditing(null);}} tipoFijo={tipoFiltro}/></Modal>}
      {waOc && <WhatsAppModal proveedores={[proveedorDe(waOc.proveedorId)]} defaultMessage={`Estimado(a) ${(proveedorDe(waOc.proveedorId)||{}).contacto||''},\n\nAdjunto orden de compra ${waOc.codigo} (${(proyectoDe(waOc.proyectoId)||{}).nombre||'obra'}), por un monto de ${formatMoneyCur(waOc.montoTotal, waOc.moneda)}. Plazo requerido: ${formatDate(waOc.plazoRequerido)}.\n\nQuedamos atentos a su confirmación.\nÁrea de Logística`} onClose={()=>setWaOc(null)}/>}
      {showImport && <ImportModal ordenes={ordenes} proveedores={proveedores} proyectos={proyectos} onClose={()=>setShowImport(false)} onConfirm={confirmarImportacion}/>}
      {cotizacionPendiente && <ConfirmarIgvCotizacionModal cantidadItems={cotizacionPendiente.items.length} pistaIncluyeIgv={cotizacionPendiente.pistaIncluyeIgv} onConfirmar={confirmarIgvCotizacion} onCancelar={()=>setCotizacionPendiente(null)}/>}
    </div>
  );
}

/* ---------------- Acceso con cuenta en la nube (Supabase Auth) ---------------- */
function CloudAuthScreen(){
  const [mode, setMode] = useState('signin'); // 'signin' | 'signup' | 'reset'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setLoading(true);
    try {
      if(mode==='signin'){
        const { error } = await supabaseClient.auth.signInWithPassword({ email: email.trim(), password });
        if(error) throw error;
      } else if(mode==='signup'){
        const { error } = await supabaseClient.auth.signUp({ email: email.trim(), password });
        if(error) throw error;
        setInfo('Cuenta creada. Si Supabase te pide confirmar el correo, revisa tu bandeja de entrada (y spam) antes de entrar.');
        setMode('signin');
      } else if(mode==='reset'){
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email.trim());
        if(error) throw error;
        setInfo('Te enviamos un correo con instrucciones para restablecer tu clave.');
        setMode('signin');
      }
    } catch(err){
      setError(err.message || 'Ocurrió un error inesperado.');
    }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:'#0A0D14', backgroundImage:'radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px)', backgroundSize:'14px 14px'}}>
      <form onSubmit={submit} className="bg-[#141821] border border-[#232838] rounded-xl shadow-2xl p-6 w-full max-w-sm">
        <p className="text-lg font-bold font-display text-[#F3F5F8] mb-1">CANTERA</p>
        <p className="text-sm text-[#8B92A5] mb-4">
          {mode==='signin' && 'Ingresa con tu correo para continuar.'}
          {mode==='signup' && 'Crea tu cuenta para empezar a usar CANTERA en la nube.'}
          {mode==='reset' && 'Te mandamos un enlace a tu correo para restablecer la clave.'}
        </p>
        <Field label="Correo" required><input type="email" className={inputCls} value={email} onChange={e=>setEmail(e.target.value)} autoFocus/></Field>
        {mode!=='reset' && <Field label="Clave" required><input type="password" className={inputCls} value={password} onChange={e=>setPassword(e.target.value)}/></Field>}
        {error && <p className="text-xs text-red-400 mb-2">{error}</p>}
        {info && <p className="text-xs text-emerald-400 mb-2">{info}</p>}
        <button type="submit" disabled={loading} className="w-full px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] mb-3 disabled:opacity-50">
          {loading ? 'Un momento…' : mode==='signin' ? 'Entrar' : mode==='signup' ? 'Crear cuenta' : 'Enviar enlace'}
        </button>
        <div className="flex justify-between text-xs text-[#5C6376]">
          {mode==='signin' ? (
            <>
              <button type="button" onClick={()=>{setMode('signup'); setError(''); setInfo('');}} className="underline">Crear cuenta</button>
              <button type="button" onClick={()=>{setMode('reset'); setError(''); setInfo('');}} className="underline">¿Olvidaste tu clave?</button>
            </>
          ) : (
            <button type="button" onClick={()=>{setMode('signin'); setError(''); setInfo('');}} className="underline mx-auto">← Volver a iniciar sesión</button>
          )}
        </div>
      </form>
    </div>
  );
}

function CambiarClaveModal({userEmail, onClose}){
  const [password, setPassword] = useState('');
  const [password2, setPassword2] = useState('');
  const [error, setError] = useState('');
  const [ok, setOk] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setError(''); setOk(false);
    if(password.length < 6){ setError('Usa al menos 6 caracteres.'); return; }
    if(password !== password2){ setError('Las claves no coinciden.'); return; }
    const { error } = await supabaseClient.auth.updateUser({ password });
    if(error){ setError(error.message); return; }
    setOk(true); setPassword(''); setPassword2('');
  };
  return (
    <Modal title="Cambiar clave de acceso" onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Correo de tu cuenta"><input className={inputCls} value={userEmail} disabled/></Field>
        <Field label="Nueva clave" required><input type="password" className={inputCls} value={password} onChange={e=>setPassword(e.target.value)}/></Field>
        <Field label="Repetir nueva clave" required><input type="password" className={inputCls} value={password2} onChange={e=>setPassword2(e.target.value)}/></Field>
        {error && <p className="text-xs text-red-400 mb-2">{error}</p>}
        {ok && <p className="text-xs text-emerald-400 mb-2">Clave actualizada correctamente.</p>}
        <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
          <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-white/5">Cerrar</button>
          <button type="submit" className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">Guardar</button>
        </div>
      </form>
    </Modal>
  );
}

function AuthGate(){
  // undefined = todavía cargando la sesión, null = sin sesión (mostrar login), objeto = con sesión
  const [session, setSession] = useState(READONLY ? null : undefined);
  useEffect(() => {
    if(READONLY) return; // el visualizador no requiere sesión, ya trae sus datos congelados
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => listener.subscription.unsubscribe();
  }, []);
  const handleLogout = () => { supabaseClient.auth.signOut(); };
  if(!READONLY && session === undefined){
    return <div className="min-h-screen flex items-center justify-center text-[#5C6376]" style={{background:'#0A0D14'}}>Cargando…</div>;
  }
  if(!READONLY && !session){
    return <CloudAuthScreen/>;
  }
  return <App userEmail={session ? session.user.email : ''} onLogout={handleLogout}/>;
}

function App({userEmail, onLogout}){
  const [view, setView] = useState('dashboard');
  const [proveedores, setProveedoresState] = useState([]);
  const [ordenes, setOrdenesState] = useState([]);
  const [proyectos, setProyectosState] = useState([]);
  const [equipos, setEquiposState] = useState([]);
  const [fondos, setFondosState] = useState([]);
  const [solicitudes, setSolicitudesState] = useState([]);
  const [config, setConfigState] = useState(DEFAULT_CONFIG);
  const [cargandoDatos, setCargandoDatos] = useState(true);
  const [errorGuardadoIDB, setErrorGuardadoIDB] = useState(null);
  const [showConfig, setShowConfig] = useState(false);
  const [showSecurity, setShowSecurity] = useState(false);
  const [showGenerarVisualizador, setShowGenerarVisualizador] = useState(false);
  const [obraFilterPreset, setObraFilterPreset] = useState('');
  const importInputRef = React.useRef(null);

  useEffect(() => {
    (async () => {
      if(READONLY && SNAPSHOT_DATA){
        setProveedoresState(SNAPSHOT_DATA.proveedores||[]);
        setOrdenesState(SNAPSHOT_DATA.ordenes||[]);
        setProyectosState(SNAPSHOT_DATA.proyectos||[]);
        setEquiposState(SNAPSHOT_DATA.equipos||[]);
        setFondosState(SNAPSHOT_DATA.fondos||[]);
        setConfigState(SNAPSHOT_DATA.config||DEFAULT_CONFIG);
        setSolicitudesState(SNAPSHOT_DATA.solicitudes||[]);
        setCargandoDatos(false);
        return;
      }
      const [prov, ordRaw, proy, equi, fon, conf, soli] = await Promise.all([
        idbGet('cantera_proveedores', SEED_PROVEEDORES),
        idbGet('cantera_ordenes', []),
        idbGet('cantera_proyectos', SEED_PROYECTOS),
        idbGet('cantera_equipos', []),
        idbGet('cantera_fondos', []),
        idbGet('cantera_config', DEFAULT_CONFIG),
        idbGet('cantera_solicitudes', []),
      ]);
      // migracion de estados antiguos de OC (Pendiente/Enviada/... -> Pagado/No pagado)
      const ordEstadoFix = ordRaw.map(o => ESTADOS_OC.includes(o.estado) ? o : { ...o, estado: o.estado==='Recibida' ? 'Pagado' : 'No pagado' });
      // salvaguarda: si dos ordenes llegaran a compartir el mismo id (por ejemplo de una importacion antigua),
      // editar una sobrescribiria a la otra sin avisar — se corrige asignando un id nuevo a los duplicados
      const idsVistos = new Set();
      let huboIdsDuplicados = false;
      const ord = ordEstadoFix.map(o => {
        if(idsVistos.has(o.id)){ huboIdsDuplicados = true; return {...o, id: generateId()}; }
        idsVistos.add(o.id);
        return o;
      });
      if(huboIdsDuplicados || JSON.stringify(ord)!==JSON.stringify(ordRaw)) idbSet('cantera_ordenes', ord);
      setProveedoresState(prov); setOrdenesState(ord); setProyectosState(proy);
      setEquiposState(equi); setFondosState(fon); setConfigState(conf); setSolicitudesState(soli);
      setCargandoDatos(false);
    })();
  }, []);

  const irAOrdenesDeObra = (proyectoId) => { setObraFilterPreset(proyectoId); setView('ordenes'); };

  const confirmarGuardado = (clave, ok) => {
    if(ok) { if(errorGuardadoIDB) setErrorGuardadoIDB(null); }
    else setErrorGuardadoIDB(`No se pudo guardar el último cambio en "${clave}". Es posible que se pierda al recargar la página — revisa el espacio de almacenamiento disponible en tu dispositivo, o usa "Exportar respaldo" ahora mismo para no perder nada.`);
  };
  const avisoSoloLectura = () => alert('🔒 Este es un visualizador de solo lectura — no se pueden guardar cambios aquí.');
  const setProveedores = (updater) => { if(READONLY) return avisoSoloLectura(); setProveedoresState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_proveedores', next).then(ok=>confirmarGuardado('proveedores', ok)); return next; }); };
  const setOrdenes = (updater) => { if(READONLY) return avisoSoloLectura(); setOrdenesState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_ordenes', next).then(ok=>confirmarGuardado('órdenes de compra', ok)); return next; }); };
  const setProyectos = (updater) => { if(READONLY) return avisoSoloLectura(); setProyectosState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_proyectos', next).then(ok=>confirmarGuardado('obras', ok)); return next; }); };
  const setEquipos = (updater) => { if(READONLY) return avisoSoloLectura(); setEquiposState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_equipos', next).then(ok=>confirmarGuardado('equipos', ok)); return next; }); };
  const setFondos = (updater) => { if(READONLY) return avisoSoloLectura(); setFondosState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_fondos', next).then(ok=>confirmarGuardado('fondos', ok)); return next; }); };
  const setSolicitudes = (updater) => { if(READONLY) return avisoSoloLectura(); setSolicitudesState(prev=>{ const next = typeof updater==='function'?updater(prev):updater; idbSet('cantera_solicitudes', next).then(ok=>confirmarGuardado('solicitudes de materiales', ok)); return next; }); };
  const saveConfig = (next) => { if(READONLY) return avisoSoloLectura(); setConfigState(next); idbSet('cantera_config', next).then(ok=>confirmarGuardado('datos de la empresa', ok)); setShowConfig(false); };

  if(cargandoDatos){
    return <div className="min-h-screen flex items-center justify-center text-[#5C6376]" style={{background:'#0A0D14'}}>Cargando tus datos…</div>;
  }

  const exportarRespaldo = () => {
    const payload = { version: 4, exportado: new Date().toISOString(), proveedores, ordenes, proyectos, equipos, fondos, solicitudes, config };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `cantera-respaldo-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  const generarVisualizador = () => {
    try {
      const snapshot = { proveedores, ordenes, proyectos, equipos, fondos, solicitudes, config };
      // se escapa cualquier "</script" que pudiera venir dentro de un texto para no cortar el archivo a la mitad
      const snapshotJson = JSON.stringify(snapshot).replace(/<\/script/gi, '<\\/script');
      // el navegador ya "tradujo" el código de la página (Babel) y dejó una copia extra ya traducida
      // insertada en el documento — si no se quita, al abrir el visualizador esa copia se ejecuta de
      // nuevo (duplicada) y choca consigo misma. Se clona el documento y se deja solo lo original:
      // los <script src="..."> (librerías) y el único <script type="text/babel"> (código fuente real).
      const clone = document.documentElement.cloneNode(true);
      clone.querySelectorAll('script').forEach(s => {
        const tieneSrc = s.hasAttribute('src');
        const esBabelFuente = s.getAttribute('type') === 'text/babel';
        if(!tieneSrc && !esBabelFuente) s.remove();
      });
      let html = '<!DOCTYPE html>\n' + clone.outerHTML;
      if(!html.includes('const READONLY = false;') || !html.includes('const SNAPSHOT_DATA = null;')){
        alert('No se pudo preparar el visualizador (no se encontraron los marcadores esperados en el archivo). Avísale a soporte.');
        return;
      }
      html = html.replace('const READONLY = false;', 'const READONLY = true;');
      html = html.replace('const SNAPSHOT_DATA = null;', `const SNAPSHOT_DATA = ${snapshotJson};`);
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `CANTERA-visualizador-${new Date().toISOString().slice(0,10)}.html`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setShowGenerarVisualizador(false);
    } catch(err){
      alert('No se pudo generar el visualizador: ' + err.message);
    }
  };
  const importarRespaldo = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if(!data.proveedores || !data.ordenes || !data.proyectos) throw new Error('formato inválido');
        if(!confirm(`Este respaldo tiene ${data.proveedores.length} proveedores, ${data.proyectos.length} obras, ${data.ordenes.length} órdenes, ${(data.equipos||[]).length} equipos y ${(data.fondos||[]).length} fondos.\n\n¿Reemplazar TODOS los datos actuales de este dispositivo con los del respaldo?`)) return;
        setProveedores(data.proveedores);
        setProyectos(data.proyectos);
        setOrdenes(data.ordenes);
        setEquipos(data.equipos||[]);
        setFondos(data.fondos||[]);
        setSolicitudes(data.solicitudes||[]);
        if(data.config) saveConfig(data.config);
        alert('Respaldo importado correctamente.');
      } catch(err){
        alert('No se pudo leer el archivo — asegúrate de que sea un respaldo generado por CANTERA.');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  const NAV = [
    {id:'dashboard', label:'Dashboard', icon:'📊'},
    {id:'proyectos', label:'Obras', icon:'🏗️'},
    {id:'proveedores', label:'Proveedores', icon:'👥'},
    {id:'ordenes', label:'Órdenes de compra', icon:'📄'},
    {id:'automatizador', label:'Automatizador de OCs', icon:'⚡'},
    {id:'precios', label:'Historial de Precios', icon:'💲'},
    {id:'equipos', label:'Equipos', icon:'🔧'},
    {id:'fondos', label:'Fondos y Rendiciones', icon:'💵'},
    {id:'solicitudes', label:'Solicitudes de Material', icon:'📋'},
  ];

  return (
    <div className="min-h-screen flex text-[#EDEFF3]" style={{background:'#0A0D14'}}>
      <aside className="w-56 shrink-0 text-white flex flex-col border-r border-[#1C212E]" style={{background:'#0D1119', backgroundImage:'radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px)', backgroundSize:'14px 14px'}}>
        <div className="px-5 py-5 border-b border-white/10"><p className="text-lg font-bold tracking-tight font-display">CANTERA</p><p className="text-[11px] text-white/50 uppercase tracking-wider">Maestro de Proveedores</p></div>
        <nav className="flex-1 py-3">{NAV.map(n=>(<button key={n.id} onClick={()=>setView(n.id)} className={`w-full flex items-center gap-2.5 px-5 py-2.5 text-sm transition-colors ${view===n.id?'bg-white/10 text-white font-medium border-r-2 border-[#E1602A]':'text-white/60 hover:text-white hover:bg-white/5'}`}><span>{n.icon}</span>{n.label}</button>))}</nav>
        {!READONLY && <button onClick={()=>setShowConfig(true)} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5 border-t border-white/10">⚙️ Datos de la empresa</button>}
        {!READONLY && <button onClick={()=>setShowSecurity(true)} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5">🔒 Cambiar clave</button>}
        {!READONLY && <button onClick={exportarRespaldo} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5 border-t border-white/10">📥 Exportar respaldo</button>}
        {!READONLY && <button onClick={()=>importInputRef.current.click()} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5">📤 Importar respaldo</button>}
        {!READONLY && <input ref={importInputRef} type="file" accept=".json" onChange={importarRespaldo} className="hidden"/>}
        {!READONLY && <button onClick={()=>setShowGenerarVisualizador(true)} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5 border-t border-white/10">🔒 Generar visualizador</button>}
        {!READONLY && <button onClick={onLogout} className="flex items-center gap-2.5 px-5 py-3 text-sm text-white/60 hover:text-white hover:bg-white/5 border-t border-white/10">🚪 Cerrar sesión</button>}
        <div className="px-5 py-4 border-t border-white/10 text-[11px] text-white/40 leading-relaxed">{READONLY ? <>🔒 Visualizador de solo lectura<br/>Datos congelados al generarse</> : <>☁️ {userEmail}<br/>Sincronizado en la nube</>}</div>
      </aside>
      <main className="flex-1 p-6 max-w-[1400px]">
        {READONLY && <div className="mb-4 bg-purple-500/10 border border-purple-500/30 text-purple-300 text-sm rounded-lg px-3 py-2">🔒 <b>Modo solo lectura.</b> Estás viendo una foto de los datos al momento en que se generó este archivo — no se puede agregar, editar, eliminar ni descargar nada desde aquí.</div>}
        <div className="mb-5">
          <h1 className="text-xl font-bold text-[#EDEFF3] font-display">{view==='dashboard'&&'Dashboard'}{view==='proyectos'&&'Obras'}{view==='proveedores'&&'Proveedores'}{view==='ordenes'&&'Órdenes de compra'}{view==='automatizador'&&'Automatizador de OCs'}{view==='precios'&&'Historial de Precios'}{view==='equipos'&&'Equipos'}{view==='fondos'&&'Fondos y Rendiciones'}{view==='solicitudes'&&'Solicitudes de Material'}</h1>
          <p className="text-sm text-[#8B92A5]">{view==='dashboard'&&'Resumen general de compras y proveedores.'}{view==='proyectos'&&'Cada obra tiene su propio centro de costo y numeración de OC.'}{view==='proveedores'&&'Base de datos nacional de proveedores homologados y en evaluación.'}{view==='ordenes'&&'Genera, da seguimiento y exporta tus órdenes de compra.'}{view==='automatizador'&&'Sube la cotización de cualquier proveedor — de materiales o de servicios — y genera la OC en tu formato en segundos.'}{view==='precios'&&'Cuánto has pagado por cada material a lo largo del tiempo, y quién te lo vendió.'}{view==='equipos'&&'Inventario de equipos eléctricos y su ubicación GPS en obras u oficina.'}{view==='fondos'&&'Adelantos y reembolsos por obra — lee tus comprobantes con la cámara y rinde cuentas más rápido.'}{view==='solicitudes'&&'Importa tus solicitudes de SharePoint, da seguimiento a cada ítem y consolida lo que se repite entre obras.'}</p>
        </div>
        {!READONLY && errorGuardadoIDB && <div className="mb-4 bg-red-500/10 border border-red-500/40 text-red-300 text-sm rounded-lg px-3 py-2 flex items-center justify-between gap-3"><span>🚨 {errorGuardadoIDB}</span><button onClick={exportarRespaldo} className="text-xs font-medium underline whitespace-nowrap">Exportar respaldo ahora</button></div>}
        {!READONLY && !config.razonSocial && <div className="mb-4 bg-blue-500/10 border border-blue-500/30 text-blue-300 text-sm rounded-lg px-3 py-2 flex items-center justify-between"><span>🏦 Completa los datos de tu empresa para que aparezcan en cada OC.</span><button onClick={()=>setShowConfig(true)} className="text-xs font-medium underline">Completar ahora</button></div>}
        {view==='dashboard' && <DashboardView proveedores={proveedores} ordenes={ordenes} proyectos={proyectos}/>}
        {view==='proyectos' && <ProyectosView proyectos={proyectos} setProyectos={setProyectos} ordenes={ordenes} setOrdenes={setOrdenes} proveedores={proveedores} onIrAOrdenes={irAOrdenesDeObra}/>}
        {view==='proveedores' && <ProveedoresView proveedores={proveedores} setProveedores={setProveedores} ordenes={ordenes} setOrdenes={setOrdenes}/>}
        {view==='ordenes' && <OrdenesView key={obraFilterPreset} ordenes={ordenes} setOrdenes={setOrdenes} proveedores={proveedores} setProveedores={setProveedores} proyectos={proyectos} setProyectos={setProyectos} config={config} initialObraFilter={obraFilterPreset}/>}
        {view==='automatizador' && <AutomatizadorOCView ordenes={ordenes} setOrdenes={setOrdenes} proveedores={proveedores} setProveedores={setProveedores} proyectos={proyectos} setProyectos={setProyectos} config={config}/>}
        {view==='precios' && <HistorialPreciosView ordenes={ordenes} proveedores={proveedores}/>}
        {view==='equipos' && <EquiposView equipos={equipos} setEquipos={setEquipos} proyectos={proyectos} config={config}/>}
        {view==='fondos' && <FondosView fondos={fondos} setFondos={setFondos} proyectos={proyectos} config={config}/>}
        {view==='solicitudes' && <SolicitudesView solicitudes={solicitudes} setSolicitudes={setSolicitudes} proyectos={proyectos} proveedores={proveedores} ordenes={ordenes}/>}
      </main>
      {showConfig && <ConfigModal config={config} onSave={saveConfig} onClose={()=>setShowConfig(false)}/>}
      {showSecurity && <CambiarClaveModal userEmail={userEmail} onClose={()=>setShowSecurity(false)}/>}
      {showGenerarVisualizador && (
        <Modal title="Generar visualizador de solo lectura" onClose={()=>setShowGenerarVisualizador(false)}>
          <p className="text-sm text-[#B4B9C6] mb-3">Esto va a descargar un archivo HTML nuevo, separado de este — con todos tus datos actuales <b>congelados como una foto</b> (no se sigue actualizando después) y sin ningún botón de agregar, editar, eliminar, importar ni descargar. Ábrelo cualquiera con quien lo compartas, sin necesidad de usuario ni clave.</p>
          <p className="text-xs text-amber-400 mb-3">⚠️ El archivo va a incluir la información que tengas cargada ahora mismo (proveedores, OC, fondos, solicitudes, etc.) — revisa que no tenga nada que no quieras compartir antes de mandarlo.</p>
          <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
            <button onClick={()=>setShowGenerarVisualizador(false)} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-[#1E2430]">Cancelar</button>
            <button onClick={generarVisualizador} className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">🔒 Generar y descargar</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AuthGate/>);
</script>
</body>
</html>
