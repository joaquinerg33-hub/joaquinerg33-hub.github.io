            <button onClick={()=>onSave({...solicitud, items: solicitud.items.map(it=>({...it, estado:estadoMasivo}))})} className="px-2 py-1 text-xs rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">✓ Aplicar a todos</button>
          </div>
          <button onClick={()=>{setForm({numero:solicitud.numero||'', solicitante:solicitud.solicitante||'', tipo:solicitud.tipo||'', fechaRequerido:solicitud.fechaRequerido||''}); setEditandoCabecera(true);}} className="text-xs text-[#5C6376] hover:text-[#E1602A] underline">✏️ Editar número / solicitante / tipo / fecha</button>
        </div>
      )}
      <div className="border border-[#232838] rounded-lg overflow-auto max-h-96">
        <table className="w-full text-sm" style={{minWidth:'900px', tableLayout:'fixed'}}>
          <colgroup>
            <col style={{width:'40px'}}/><col style={{width:'30%'}}/><col style={{width:'14%'}}/><col style={{width:'80px'}}/><col style={{width:'170px'}}/><col style={{width:'22%'}}/><col style={{width:'30px'}}/>
          </colgroup>
          <thead className="bg-[#1A1F2A] text-[#8B92A5] text-xs uppercase sticky top-0">
            <tr><th className="text-left px-3 py-2">Ítem</th><th className="text-left px-2 py-2">Detalle</th><th className="text-left px-2 py-2">Categoría</th><th className="text-right px-2 py-2">Cant.</th><th className="text-left px-3 py-2">Estado</th><th className="text-left px-2 py-2">Comentario</th><th></th></tr>
          </thead>
          <tbody className="divide-y divide-[#1E2330]">
            {solicitud.items.map(it => <ItemSolicitudRow key={it.id} item={it} onUpdate={actualizarItem} onEliminar={()=>eliminarItem(it.id)}/>)}
          </tbody>
        </table>
      </div>
      <button onClick={agregarItem} className="mt-2 text-sm text-[#8B92A5] hover:text-[#E1602A]">+ Añadir ítem</button>
      <div className="flex justify-end pt-4"><button onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-white/5">Cerrar</button></div>
    </Modal>
  );
}

function ResumenConsolidadoSolicitudes({solicitudes, proveedores, proyectos, ordenes}){
  const historialMateriales = useMemo(()=>buildHistorialMateriales(ordenes, proveedores), [ordenes, proveedores]);
  const [soloPendientes, setSoloPendientes] = useState(false);

  const consolidado = useMemo(() => {
    const map = {};
    solicitudes.forEach(s => {
      const proyecto = proyectos.find(p=>p.id===s.proyectoId);
      const items = soloPendientes ? s.items.filter(it=>!['Entregado','Rechazado'].includes(it.estado)) : s.items;
      items.forEach(it => {
        const key = normalizarMaterial(it.detalle);
        if(!key) return;
        if(!map[key]) map[key] = { key, nombre: it.detalle.trim(), categoria: detectarCategoriaMaterial(it), cantidadTotal: 0, ocurrencias: [] };
        map[key].cantidadTotal += it.cantidad;
        map[key].ocurrencias.push({ solicitudNumero: s.numero, obra: proyecto?proyecto.nombre:s.obraNombre, region: proyecto?proyecto.region:null, cantidad: it.cantidad, unidad: it.unidad||'und', estado: it.estado });
      });
    });
    // la unidad del total se toma por consenso (la más repetida entre las ocurrencias), no de la primera que aparezca
    Object.values(map).forEach(m => {
      const conteo = {};
      m.ocurrencias.forEach(o => { conteo[o.unidad] = (conteo[o.unidad]||0)+1; });
      m.unidad = Object.entries(conteo).sort((a,b)=>b[1]-a[1])[0][0];
      m.unidadesInconsistentes = Object.keys(conteo).length > 1;
    });
    Object.values(map).forEach(m => { m.solicitudesUnicas = new Set(m.ocurrencias.map(o=>o.solicitudNumero)).size; });
    return Object.values(map).filter(m=>m.ocurrencias.length>=1).sort((a,b)=>b.solicitudesUnicas-a.solicitudesUnicas || b.cantidadTotal-a.cantidadTotal);
  }, [solicitudes, proyectos, soloPendientes]);

  const sugerirProveedores = (materialKey, categoria, regionesObras) => {
    // 1° prioridad: proveedores a los que YA se les compró este material antes (historial real de OC)
    const historial = historialMateriales[materialKey];
    if(historial && historial.entradas.length>0){
      const porProveedor = {};
      historial.entradas.forEach(e => {
        if(!porProveedor[e.proveedorNombre]) porProveedor[e.proveedorNombre] = { nombre: e.proveedorNombre, veces: 0, ultimaFecha: e.fecha };
        porProveedor[e.proveedorNombre].veces++;
      });
      const proveedoresConHistorial = Object.values(porProveedor).sort((a,b)=>b.veces-a.veces);
      const conRegion = proveedoresConHistorial.map(ph => {
        const p = proveedores.find(pr=>pr.razonSocial===ph.nombre);
        return { ...ph, region: p?p.region:null, mismaRegion: p && regionesObras.includes(p.region) };
      });
      return { tipo:'historial', lista: conRegion.slice(0,4) };
    }
    // sin historial: se sugiere por categoría, priorizando misma región
    const candidatos = proveedores.filter(p => (p.categorias||[]).some(c => c.toLowerCase().includes(categoria.toLowerCase()) || categoria.toLowerCase().includes(c.toLowerCase())));
    const ordenados = candidatos.sort((a,b) => {
      const aRegion = regionesObras.includes(a.region) ? 0 : 1;
      const bRegion = regionesObras.includes(b.region) ? 0 : 1;
      return aRegion - bRegion;
    }).slice(0,3);
    return { tipo:'categoria', lista: ordenados };
  };

  const [abierto, setAbierto] = useState(false);
  const [busqueda, setBusqueda] = useState('');
  const consolidadoFiltrado = useMemo(() => {
    if(!busqueda.trim()) return consolidado;
    const q = busqueda.trim().toLowerCase();
    return consolidado.filter(m => m.nombre.toLowerCase().includes(q) || m.categoria.toLowerCase().includes(q));
  }, [consolidado, busqueda]);
  const [expandido, setExpandido] = useState(null);

  return (
    <div className="bg-[#141821] rounded-xl border border-[#232838] overflow-hidden mb-4">
      <button onClick={()=>setAbierto(!abierto)} className="w-full px-4 py-3 flex items-center justify-between text-left hover:bg-white/5">
        <div>
          <h3 className="font-display font-semibold text-[#EDEFF3]">📦 {soloPendientes?'Resumen de pendientes':'Resumen consolidado de materiales'}</h3>
          <p className="text-xs text-[#8B92A5]">{consolidado.length} material(es) distintos {soloPendientes?'con algo pendiente':'pedidos'} en {solicitudes.length} solicitud(es) — clic para {abierto?'ocultar':'ver'}.</p>
        </div>
        <span className="text-[#8B92A5]">{abierto?'▲':'▼'}</span>
      </button>
      {abierto && (
      <>
      <div className="px-4 py-2 border-t border-[#232838] flex items-center gap-3">
        <input autoFocus className={inputCls} placeholder="🔎 Buscar material o categoría…" value={busqueda} onChange={e=>setBusqueda(e.target.value)}/>
        <label className="flex items-center gap-1.5 text-sm text-[#B4B9C6] cursor-pointer select-none whitespace-nowrap" onClick={e=>e.stopPropagation()}>
          <input type="checkbox" checked={soloPendientes} onChange={e=>setSoloPendientes(e.target.checked)} className="w-4 h-4"/>
          Solo pendientes
        </label>
      </div>
      <div className="divide-y divide-[#1E2330] max-h-[32rem] overflow-y-auto border-t border-[#232838]">
        {consolidadoFiltrado.map((m,i) => {
          const regiones = [...new Set(m.ocurrencias.map(o=>o.region).filter(Boolean))];
          const sugerencia = sugerirProveedores(m.key, m.categoria, regiones);
          return (
            <div key={i} className="px-4 py-3">
              <button onClick={()=>setExpandido(expandido===i?null:i)} className="w-full flex items-center justify-between text-left">
                <div>
                  <p className="text-sm font-medium text-[#DADDE5]">{expandido===i?'▾':'▸'} {m.nombre}</p>
                  <p className="text-xs text-[#8B92A5]">{m.categoria} · {m.solicitudesUnicas} solicitud{m.solicitudesUnicas===1?'':'es'} distinta{m.solicitudesUnicas===1?'':'s'}{m.ocurrencias.length>m.solicitudesUnicas && ` (${m.ocurrencias.length} líneas en total)`} · Total: {m.cantidadTotal} {m.unidad}{m.unidadesInconsistentes && <span className="text-amber-400"> (⚠️ unidades distintas entre solicitudes, revisa el detalle)</span>}</p>
                </div>
              </button>
              {expandido===i && (
                <div className="mt-2 pl-4 border-l-2 border-[#232838]">
                  <p className="text-xs text-[#5C6376] mb-1">Aparece en:</p>
                  {m.ocurrencias.map((o,j)=>(
                    <p key={j} className="text-xs text-[#8B92A5]">· N°{o.solicitudNumero} — {o.obra}: {o.cantidad} {o.unidad} <Badge className={ESTADO_ITEM_STYLE[o.estado]}>{o.estado}</Badge></p>
                  ))}
                  <p className="text-xs text-[#5C6376] mt-2 mb-1">{sugerencia.tipo==='historial' ? 'Proveedores a los que ya le compraste esto:' : `Proveedores sugeridos por categoría (${m.categoria}):`}</p>
                  {sugerencia.lista.length===0 && <p className="text-xs text-[#5C6376]">No hay proveedores con esta categoría en tu base de datos.</p>}
                  {sugerencia.tipo==='historial' ? sugerencia.lista.map((p,k)=>(
                    <p key={k} className="text-xs text-[#DADDE5]">· {p.nombre} <span className="text-[#5C6376]">— {p.veces} compra(s) previa(s), última {formatDate(p.ultimaFecha)}{p.region && ` · ${p.region}`}{p.mismaRegion && <span className="text-emerald-400"> (misma región)</span>}</span></p>
                  )) : sugerencia.lista.map(p=>(
                    <p key={p.id} className="text-xs text-[#DADDE5]">· {p.razonSocial} <span className="text-[#5C6376]">— {p.region}{regiones.includes(p.region) && <span className="text-emerald-400"> (misma región)</span>}</span></p>
                  ))}
                </div>
              )}
            </div>
          );
        })}
        {consolidadoFiltrado.length===0 && <div className="px-4 py-8 text-center text-[#5C6376] text-sm">{busqueda?'Ningún material coincide con tu búsqueda.':'Aún no hay solicitudes importadas.'}</div>}
      </div>
      </>
      )}
    </div>
  );
}

function SolicitudesView({solicitudes, setSolicitudes, proyectos, proveedores, ordenes}){
  const [obraFilter, setObraFilter] = useState('');
  const [showImport, setShowImport] = useState(false);
  const [detalle, setDetalle] = useState(null);
  const [ordenarPor, setOrdenarPor] = useState('numero');
  const [ordenDireccion, setOrdenDireccion] = useState('desc');
  const proyectoDe = (id) => proyectos.find(p=>p.id===id);

  const COMPARADORES_SOLICITUD = {
    numero: (a,b) => String(a.numero||'').localeCompare(String(b.numero||''), 'es', {numeric:true}),
    fecha: (a,b) => new Date(a.fechaRequerido||0) - new Date(b.fechaRequerido||0),
    pendientes: (a,b) => (a.items.filter(it=>!['Entregado','Rechazado'].includes(it.estado)).length) - (b.items.filter(it=>!['Entregado','Rechazado'].includes(it.estado)).length),
  };
  const filtered = solicitudes
    .filter(s => !obraFilter || s.proyectoId===obraFilter)
    .sort((a,b) => (ordenDireccion==='asc'?1:-1) * COMPARADORES_SOLICITUD[ordenarPor](a,b));

  const confirmarImportacion = (seleccionados) => {
    const nuevas = seleccionados.map(r => {
      const proyecto = proyectos.find(p=>p.centroCosto===r.centroCosto);
      return {
        id: generateId(), numero: r.numero, centroCosto: r.centroCosto, proyectoId: proyecto?proyecto.id:'',
        obraNombre: r.obraNombre, solicitante: r.solicitante, fechaRequerido: r.fechaRequerido, tipo: r.tipo,
        items: r.items,
      };
    });
    setSolicitudes(prev => [...prev, ...nuevas]);
    setShowImport(false);
  };
  const eliminar = (id) => { if(confirm('¿Eliminar esta solicitud?')) setSolicitudes(prev=>prev.filter(s=>s.id!==id)); };
  const guardarSolicitud = (s) => { setSolicitudes(prev=>prev.map(x=>x.id===s.id?s:x)); setDetalle(s); };

  return (
    <div>
      <ResumenConsolidadoSolicitudes solicitudes={filtered} proveedores={proveedores} proyectos={proyectos} ordenes={ordenes}/>

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select className={inputCls+' w-auto'} value={obraFilter} onChange={e=>setObraFilter(e.target.value)}><option value="">Todas las obras</option>{proyectos.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select>
        <span className="text-sm text-[#5C6376]">Ordenar por</span>
        <select className={inputCls+' w-auto'} value={ordenarPor} onChange={e=>setOrdenarPor(e.target.value)}>
          <option value="numero">Número</option>
          <option value="fecha">Fecha requerido</option>
          <option value="pendientes">Ítems pendientes</option>
        </select>
        <button onClick={()=>setOrdenDireccion(d=>d==='asc'?'desc':'asc')} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">{ordenDireccion==='asc'?'↑ Asc.':'↓ Desc.'}</button>
        <div className="flex-1"/>
        {!READONLY && <button onClick={()=>setShowImport(true)} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">📤 Importar solicitudes</button>}
      </div>

      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
        {filtered.map(s => {
          const pendientes = s.items.filter(it=>!['Entregado','Rechazado'].includes(it.estado)).length;
          return (
            <div key={s.id} onClick={()=>setDetalle(s)} className="bg-[#141821] rounded-xl border border-[#232838] p-4 cursor-pointer hover:border-[#E1602A] transition-colors">
              <div className="flex items-start justify-between mb-2">
                <Badge className={s.tipo==='Extraordinaria'||s.tipo==='Extraordinario'?'bg-purple-500/15 text-purple-300 border-purple-500/30':'bg-blue-500/15 text-blue-300 border-blue-500/30'}>{s.tipo}</Badge>
                <button onClick={e=>{e.stopPropagation(); eliminar(s.id);}} className="text-[#5C6376] hover:text-red-400 text-xs">🗑️</button>
              </div>
              <p className="font-semibold text-[#DADDE5]">N°{s.numero} — {(proyectoDe(s.proyectoId)||{}).nombre || s.obraNombre || '—'}</p>
              <p className="text-xs text-[#5C6376] mb-2">{s.solicitante} · {formatDate(s.fechaRequerido)} · {s.items.length} ítem(s)</p>
              <div className="pt-2 border-t border-[#1E2330] flex justify-between items-center">
                <span className="text-xs text-[#8B92A5]">Estado</span>
                <span className={`text-xs font-medium ${pendientes>0?'text-amber-400':'text-emerald-400'}`}>{pendientes>0?`${pendientes} pendiente(s)`:'Todo resuelto ✓'}</span>
              </div>
            </div>
          );
        })}
        {filtered.length===0 && <div className="col-span-full bg-[#141821] border border-dashed border-[#2E3547] rounded-xl p-10 text-center text-[#5C6376] text-sm">Aún no importas solicitudes de materiales.</div>}
      </div>

      {showImport && <ImportSolicitudesModal solicitudes={solicitudes} proyectos={proyectos} onClose={()=>setShowImport(false)} onConfirm={confirmarImportacion}/>}
      {detalle && <SolicitudDetalleModal solicitud={solicitudes.find(s=>s.id===detalle.id)||detalle} proyecto={proyectoDe(detalle.proyectoId)} onClose={()=>setDetalle(null)} onSave={guardarSolicitud}/>}
    </div>
  );
}

function ProveedoresView({proveedores, setProveedores, ordenes, setOrdenes}){
  const [search, setSearch] = useState(''); const [catFilter, setCatFilter] = useState(''); const [regionFilter, setRegionFilter] = useState('');
  const [homologadoOnly, setHomologadoOnly] = useState(false); const [editing, setEditing] = useState(null); const [showForm, setShowForm] = useState(false); const [waTarget, setWaTarget] = useState(null);
  const [showFusion, setShowFusion] = useState(false);
  const categoriasExistentes = useMemo(()=>{ const s=new Set(); proveedores.forEach(p=>(p.categorias||[]).forEach(c=>s.add(c))); return Array.from(s).sort(); }, [proveedores]);
  const filtered = useMemo(()=>proveedores.filter(p=>{
    if(search && !`${p.razonSocial} ${p.ruc} ${p.contacto}`.toLowerCase().includes(search.toLowerCase())) return false;
    if(catFilter && !(p.categorias||[]).includes(catFilter)) return false;
    if(regionFilter && p.region!==regionFilter) return false;
    if(homologadoOnly && !p.homologado) return false;
    return true;
  }), [proveedores, search, catFilter, regionFilter, homologadoOnly]);
  const tieneEjemplos = proveedores.some(p=>p.ejemplo);
  const save = (form) => { setProveedores(prev=> prev.some(p=>p.id===form.id)? prev.map(p=>p.id===form.id?form:p) : [...prev, form]); setShowForm(false); setEditing(null); };
  const remove = (id) => { if(confirm('¿Eliminar este proveedor?')) setProveedores(prev=>prev.filter(p=>p.id!==id)); };
  const removeEjemplos = () => { if(confirm('¿Eliminar todos los proveedores de ejemplo?')) setProveedores(prev=>prev.filter(p=>!p.ejemplo)); };
  const fusionar = (mantenerId, eliminarId) => {
    const mantener = proveedores.find(p=>p.id===mantenerId);
    if(!confirm(`Se moverán todas las OC de "${(proveedores.find(p=>p.id===eliminarId)||{}).razonSocial}" a "${mantener.razonSocial}", y se eliminará el duplicado. ¿Continuar?`)) return;
    setOrdenes(prev => prev.map(o => o.proveedorId===eliminarId ? {...o, proveedorId: mantenerId} : o));
    setProveedores(prev => prev.filter(p=>p.id!==eliminarId));
    setShowFusion(false);
  };
  const montoPorProveedor = useMemo(()=>{ const s={}; ordenes.forEach(o=>{ if(!o.proveedorId) return; if(!s[o.proveedorId]) s[o.proveedorId]={soles:0,dolares:0}; if(o.moneda==='DOLARES') s[o.proveedorId].dolares+=(o.montoTotal||0); else s[o.proveedorId].soles+=(o.montoTotal||0); }); return s; }, [ordenes]);
  return (
    <div>
      {tieneEjemplos && <div className="mb-4 bg-amber-500/10 border border-amber-500/30 text-amber-300 text-sm rounded-lg px-3 py-2 flex items-center justify-between"><span>⚠️ Estás viendo datos de ejemplo.</span><button onClick={removeEjemplos} className="text-xs font-medium underline">Eliminar ejemplos</button></div>}
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <div className="relative flex-1 min-w-[200px]"><input className={inputCls+' pl-3'} placeholder="Buscar por razón social, RUC o contacto…" value={search} onChange={e=>setSearch(e.target.value)}/></div>
        <select className={inputCls+' w-auto'} value={catFilter} onChange={e=>setCatFilter(e.target.value)}><option value="">Todas las categorías</option>{categoriasExistentes.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select className={inputCls+' w-auto'} value={regionFilter} onChange={e=>setRegionFilter(e.target.value)}><option value="">Todas las regiones</option>{REGIONES.map(r=><option key={r} value={r}>{r}</option>)}</select>
        <label className="flex items-center gap-1.5 text-sm text-[#B4B9C6] cursor-pointer select-none px-1"><input type="checkbox" checked={homologadoOnly} onChange={e=>setHomologadoOnly(e.target.checked)} className="w-4 h-4"/>Solo homologados</label>
        <button onClick={()=>setWaTarget('all-filtered')} disabled={filtered.length===0} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-[#1A1F2A] disabled:opacity-40">💬 Cotizar a filtrados ({filtered.length})</button>
        {!READONLY && <button onClick={()=>setShowFusion(true)} disabled={proveedores.length<2} className="px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5 disabled:opacity-40">🔗 Fusionar duplicados</button>}
        {!READONLY && <button onClick={()=>{setEditing(null); setShowForm(true);}} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">+ Nuevo proveedor</button>}
      </div>
      <div className="bg-[#141821] rounded-xl border border-[#232838] overflow-hidden overflow-x-auto">
        <table className="w-full text-sm">
          <thead className="bg-[#1A1F2A] text-[#8B92A5] text-xs uppercase tracking-wide"><tr><th className="text-left px-4 py-2.5">Proveedor</th><th className="text-left px-4 py-2.5">Categorías</th><th className="text-left px-4 py-2.5">Ubicación</th><th className="text-left px-4 py-2.5">Contacto</th><th className="text-right px-4 py-2.5">Comprado</th><th className="text-center px-4 py-2.5">Homolog.</th><th className="px-4 py-2.5"></th></tr></thead>
          <tbody className="divide-y divide-[#1E2330]">
            {filtered.map(p=>(
              <tr key={p.id} className="hover:bg-[#1A1F2A]/60">
                <td className="px-4 py-2.5"><p className="font-medium text-[#EDEFF3]">{p.razonSocial}</p><p className="text-xs text-[#5C6376] font-mono">RUC {p.ruc}</p></td>
                <td className="px-4 py-2.5"><div className="flex flex-wrap gap-1">{(p.categorias||[]).map(c=><Badge key={c} className={colorForCategoria(c)}>{c}</Badge>)}</div></td>
                <td className="px-4 py-2.5 text-[#B4B9C6]">📍 {p.distrito?`${p.distrito}, `:''}{p.region}</td>
                <td className="px-4 py-2.5 text-[#B4B9C6]"><p>{p.contacto||'—'}</p><p className="text-xs text-[#5C6376]">{p.telefono}</p></td>
                <td className="px-4 py-2.5 text-right"><MoneyDual soles={(montoPorProveedor[p.id]||{}).soles||0} dolares={(montoPorProveedor[p.id]||{}).dolares||0} className="font-mono text-[#DADDE5]"/></td>
                <td className="px-4 py-2.5 text-center">{p.homologado?'✅':'—'}</td>
                <td className="px-4 py-2.5"><div className="flex items-center gap-2 justify-end"><button onClick={()=>setWaTarget(p)} title="WhatsApp" className="text-[#5C6376] hover:text-emerald-400">💬</button><button onClick={()=>{setEditing(p); setShowForm(true);}} className="text-[#5C6376] hover:text-[#DADDE5]">✏️</button><button onClick={()=>remove(p.id)} className="text-[#5C6376] hover:text-red-400">🗑️</button></div></td>
              </tr>
            ))}

let leafletIconsFixed = false;
function ensureLeafletIcons(){
  if(leafletIconsFixed || typeof L==='undefined') return;
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-2x.png',
    iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',

  });
  leafletIconsFixed = true;
}

function MapaEquipos({puntos, height=420}){
  const mapRef = React.useRef(null);
  const mapInstance = React.useRef(null);
  const layerRef = React.useRef(null);

  useEffect(() => {
    if(typeof L==='undefined') return;
    ensureLeafletIcons();
    if(!mapInstance.current){
      mapInstance.current = L.map(mapRef.current, { scrollWheelZoom: true }).setView([-9.19, -75.02], 5.3);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19,
      }).addTo(mapInstance.current);
      layerRef.current = L.layerGroup().addTo(mapInstance.current);
    }
    layerRef.current.clearLayers();
    puntos.forEach(p => {
      const color = p.tipo==='Obra' ? '#E1602A' : p.tipo==='Oficina' ? '#38BDF8' : '#A78BFA';
      const icon = L.divIcon({
        html: `<div style="background:${color};width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 0 8px ${color}"></div>`,
        className: '', iconSize: [16,16], iconAnchor: [8,8],
      });
      const marker = L.marker([p.lat, p.lng], { icon }).addTo(layerRef.current);
      const listaEquipos = p.equipos.map(eq => `• ${eq.nombre} <span style="color:#8B92A5">(${eq.codigo})</span>`).join('<br/>');
      marker.bindPopup(`<b>${p.nombre}</b><br/><span style="color:#8B92A5">${p.tipo}</span><br/><br/>${listaEquipos}`);
    });
    if(puntos.length > 0){
      const bounds = L.latLngBounds(puntos.map(p => [p.lat, p.lng]));
      mapInstance.current.fitBounds(bounds, { padding: [50,50], maxZoom: 14 });
    }
  }, [puntos]);

  return <div ref={mapRef} style={{ height, borderRadius: 12 }} className="border border-[#232838] overflow-hidden"/>;
}

/* ---------------- Fondos y Rendiciones (con lector OCR de comprobantes) ---------------- */
const TIPOS_FONDO = ['Adelanto','Reembolso'];
const CONCEPTOS_SUGERIDOS_GASTO = ['Gasolina','Materiales','Peaje','Alimentación','Movilidad','Estacionamiento','Otros'];

function normalizarMontoPE(str){
  let s = str.trim();
  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');
  if(lastComma > -1 && lastDot > -1){
    if(lastDot > lastComma) s = s.replace(/,/g, ''); // 1,234.56 -> punto decimal
    else s = s.replace(/\./g, '').replace(',', '.'); // 1.234,56 -> coma decimal
  } else if(lastComma > -1){
    const decimales = s.length - lastComma - 1;
    s = decimales===2 ? s.replace(',', '.') : s.replace(/,/g, '');
  }
  // si solo hay punto (caso normal en Perú, ej. "11.02"), se deja tal cual
  return parseFloat(s);
}

function parseComprobanteTexto(text){
  const upper = text.toUpperCase();
  const rucMatch = text.match(/\b(10|15|17|20)\d{9}\b/);
  const ruc = rucMatch ? rucMatch[0] : '';

  const fechaMatch = text.match(/\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/);
  let fecha = '';
  if(fechaMatch){
    let [,d,m,y] = fechaMatch;
    if(y.length===2) y = '20'+y;
    const dd=parseInt(d,10), mm=parseInt(m,10);
    if(dd>=1 && dd<=31 && mm>=1 && mm<=12) fecha = `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  }

  let monto = null;
  const lineas = text.split('\n');
  const excluir = (l) => /SUB\s*TOTAL/i.test(l) || /SON\s*:/i.test(l) || /OP\.?\s*(GRAVADA|EXONERADA|INAFECTA|GRATUITA)/i.test(l);
  // 1° prioridad: el monto final real (suele venir tras el IGV, más abajo en el ticket)
  const prioridades = [/IMPORTE\s*TOTAL/i, /TOTAL\s*A\s*PAGAR/i, /TOTAL\s*GENERAL/i, /TOTAL\s*VENTA/i];
  for(const patron of prioridades){
    for(const linea of lineas){
      if(patron.test(linea) && !excluir(linea)){
        const m = linea.match(/(\d{1,3}(?:[.,]\d{3})*[.,]\d{1,2})/);
        if(m){ monto = normalizarMontoPE(m[1]); break; }
      }
    }
    if(monto!==null) break;
  }
  // 2° prioridad: cualquier línea "TOTAL" genérica — se toma la ÚLTIMA (el total final suele ir al final del ticket)
  if(monto===null){
    let candidatos = [];
    lineas.forEach(linea => {
      if(/TOTAL/i.test(linea) && !excluir(linea)){
        const m = linea.match(/(\d{1,3}(?:[.,]\d{3})*[.,]\d{1,2})/);
        if(m) candidatos.push(normalizarMontoPE(m[1]));
      }
    });
    if(candidatos.length) monto = candidatos[candidatos.length-1];
  }
  if(monto===null){
    const nums = [...text.matchAll(/(\d{1,3}(?:[.,]\d{3})*[.,]\d{1,2})/g)].map(m=>normalizarMontoPE(m[1])).filter(n=>n>0 && n<50000);
    if(nums.length) monto = Math.max(...nums);
  }

  const proveedorNombre = lineas.map(l=>l.trim()).find(l=>l.length>4 && !/^\d+$/.test(l) && !/^R\.?U\.?C/i.test(l)) || '';

  // número de documento: formato serie-correlativo típico de boletas/facturas (ej. F001-123456, FOA9-00007792, B001-000123)
  let documento = '';
  const serieMatch = text.match(/\b([BFE][A-Z0-9]{2,3}-\d{4,10})\b/i);
  if(serieMatch) documento = serieMatch[1].toUpperCase();
  if(!documento){
    const ticketMatch = text.match(/TICKET\s*:?\s*([A-Z0-9\-]{4,15})/i);
    if(ticketMatch) documento = ticketMatch[1].toUpperCase();
  }

  const REGLAS_CONCEPTO = [
    { patron:/GRIFO|COMBUSTIBLE|GASOLINA|DIESEL|GLP|ESTACION DE SERVICIO|PETROPERU|PRIMAX|REPSOL/i, concepto:'Gasolina' },
    { patron:/PEAJE/i, concepto:'Peaje' },
    { patron:/RESTAURANT|MENU|POLLERIA|ALIMENTO/i, concepto:'Alimentación' },
    { patron:/FERRETERIA|CEMENTO|FIERRO|CLAVO|TORNILLO|MATERIAL/i, concepto:'Materiales' },
    { patron:/TAXI|MOTOTAXI|PASAJE/i, concepto:'Movilidad' },
    { patron:/ESTACIONAMIENTO|PARKING|PLAYA DE ESTACIONAMIENTO/i, concepto:'Estacionamiento' },
  ];
  const conceptoSugerido = (REGLAS_CONCEPTO.find(r=>r.patron.test(upper))||{}).concepto || '';

  return { fecha, monto, ruc, proveedorNombre, documento, conceptoSugerido, textoCompleto:text };
}

async function leerComprobante(file, onProgress){
  if(typeof Tesseract==='undefined') throw new Error('El lector OCR no cargó (revisa tu conexión a internet e intenta de nuevo).');
  const { data } = await Tesseract.recognize(file, 'spa', {
    logger: m => { if(m.status==='recognizing text' && onProgress) onProgress(Math.round((m.progress||0)*100)); }
  });
  return parseComprobanteTexto(data.text || '');
}

/* ---------------- Lectura de cotizaciones de proveedores (PDF o foto) para pre-llenar items de una OC ---------------- */
async function extraerTextoPDF(file, onProgress){
  if(typeof pdfjsLib==='undefined') throw new Error('El lector de PDF no cargó (revisa tu conexión a internet e intenta de nuevo).');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let textoCompleto = '';
  for(let i=1;i<=pdf.numPages;i++){
    if(onProgress) onProgress(Math.round((i-1)/pdf.numPages*100));
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // agrupar fragmentos por su posición vertical (misma fila visual) y ordenarlos por X,
    // para no perder los saltos de línea de tablas al concatenar todo el texto de la página
    const filas = {};
    content.items.forEach(it => {
      const y = Math.round(it.transform[5] / 4) * 4; // tolerancia de 4pt para variaciones pequeñas de fuente
      if(!filas[y]) filas[y] = [];
      filas[y].push({ x: it.transform[4], str: it.str });
    });
    const ysOrdenados = Object.keys(filas).map(Number).sort((a,b)=>b-a); // de arriba hacia abajo
    ysOrdenados.forEach(y => {
      textoCompleto += filas[y].sort((a,b)=>a.x-b.x).map(o=>o.str).join(' ') + '\n';
    });
  }
  return textoCompleto;
}


function detectarPistaIgv(texto){
  const t = texto.toUpperCase();
  if(/INCLUYE\s*IGV|IGV\s*INCLUIDO|PRECIO(S)?\s*FINAL(ES)?|CON\s*IGV/.test(t)) return true;
  if(/M[AÁ]S\s*IGV|\+\s*IGV|SIN\s*IGV|NO\s*INCLUYE\s*IGV|EXCLUYE\s*IGV/.test(t)) return false;
  return null; // no se encontró ninguna pista clara
}

async function leerCotizacion(file, onProgress){
  let texto = '';
  if(file.type === 'application/pdf'){
    texto = await extraerTextoPDF(file, onProgress);
    // si el PDF es un escaneo (imagen) puede salir con muy poco texto real -> no hay más remedio que avisar
    if(texto.replace(/\s/g,'').length < 20){
      throw new Error('El PDF parece ser una imagen escaneada sin texto real. Prueba subiéndolo como foto/imagen en vez de PDF.');
    }
  } else {
    if(typeof Tesseract==='undefined') throw new Error('El lector OCR no cargó (revisa tu conexión a internet e intenta de nuevo).');
    const { data } = await Tesseract.recognize(file, 'spa', {
      logger: m => { if(m.status==='recognizing text' && onProgress) onProgress(Math.round((m.progress||0)*100)); }
    });
    texto = data.text || '';
  }
  return { items: parseCotizacionItems(texto), pistaIncluyeIgv: detectarPistaIgv(texto) };
}

// Cotización en Excel (formato libre del proveedor, NO el F-003): a diferencia del PDF/foto, en un Excel
// las columnas ya vienen separadas — en vez de aplanar todo a texto y adivinar con regex (frágil), se
// detecta la fila de encabezado (Descripción / Cantidad / P.U. / Total, etc.) y se leen los ítems columna
// por columna, que es mucho más confiable. Si la hoja no tiene un encabezado reconocible (ej. es más bien
// una cotización pegada como texto libre en una celda), se cae al mismo parser de líneas que usa PDF/foto.
function stripAcentos(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function clasificarEncabezadoCelda(txt){
  const t = stripAcentos(txt).toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!t) return null;
  // usa coincidencia por PREFIJO (^...) porque los encabezados suelen venir abreviados (ej. "Cant.", "P.Unit")
  // — comparar con .includes() al revés fallaba porque el texto abreviado es más corto que la palabra completa
  if(/^(item|it|nro|n|codigo|cod)$/.test(t)) return 'item';
  if(/^(und|un|unidad|unid|um|medida)$/.test(t)) return 'unidad';
  if(t==='pu' || /^(preciounit|punit|preciou|unitario|punitario)/.test(t) || (t.includes('precio') && t.includes('unit'))) return 'pu';
  if(/^(total|subtotal|importe)/.test(t)) return 'total';
  if(/^(cant|cantidad|metrado|qty|cnt)/.test(t)) return 'cantidad';
  if(/^(descripcion|desc|detalle|producto|material|servicio|articulo|concepto)/.test(t)) return 'detalle';
  return null;
}
function parseNumeroCelda(raw){
  if(raw==null) return null;
  const s = String(raw).replace(/[^\d.,\-]/g,'').trim();
  if(!s) return null;
  const n = normalizarMontoPE(s);
  return isNaN(n) ? null : n;
}
function detectarEncabezadoExcel(rows, numerosFila){
  let mejor = null;
  for(const n of numerosFila){
    const mapa = {};
    rows[n].forEach(c => { const tipo = clasificarEncabezadoCelda(c.val); if(tipo && !mapa[tipo]) mapa[tipo] = c.col; });
    const score = Object.keys(mapa).length;
    if(mapa.detalle && (mapa.pu || mapa.total) && score>=2 && (!mejor || score>mejor.score)){
      mejor = { fila: n, mapa, score };
    }
  }
  return mejor;
}
function leerItemsExcelPorColumnas(rows, numerosFila, encabezado){
  const { fila: filaEncabezado, mapa } = encabezado;
  const items = [];
  for(const n of numerosFila){
    if(n<=filaEncabezado) continue;
    const celdas = {};
    rows[n].forEach(c => { celdas[c.col] = c.val; });
    const detalleRaw = mapa.detalle!=null ? celdas[mapa.detalle] : null;
    const detalle = String(detalleRaw||'').trim();
    if(!detalle) continue;
    if(/^(sub\s*)?total$|^i\.?\s*g\.?\s*v\.?$/i.test(detalle)) break; // llegamos a la fila de totales: no hay más ítems
    let cantidad = mapa.cantidad!=null ? parseNumeroCelda(celdas[mapa.cantidad]) : null;
    let pu = mapa.pu!=null ? parseNumeroCelda(celdas[mapa.pu]) : null;
    const total = mapa.total!=null ? parseNumeroCelda(celdas[mapa.total]) : null;
    if((pu==null || pu<=0) && total!=null && cantidad) pu = total/cantidad;
    if(cantidad==null || cantidad<=0) cantidad = 1;
    if(pu==null || pu<=0 || pu>500000) continue; // fila sin precio real (ej. subtítulo de sección) — se ignora, no se corta la lectura
    items.push({ id: generateId(), item: String(items.length+1), detalle, und: (mapa.unidad!=null && celdas[mapa.unidad]) ? String(celdas[mapa.unidad]).trim() : 'und', metrado: cantidad, pu: Math.round(pu*100)/100 });
  }
  return items;
}
async function leerCotizacionExcel(file){
  const buf = await file.arrayBuffer();
  const cells = await parseXlsxCells(buf);
  const rows = buildRowIndex(cells);
  const numerosFila = Object.keys(rows).map(Number).sort((a,b)=>a-b);
  const texto = numerosFila.map(n => rows[n].map(c=>String(c.val)).join(' ')).join('\n');
  if(texto.replace(/\s/g,'').length < 10){
    throw new Error('No se encontró texto legible en la hoja de cálculo.');
  }
  const encabezado = detectarEncabezadoExcel(rows, numerosFila);
  const items = encabezado ? leerItemsExcelPorColumnas(rows, numerosFila, encabezado) : parseCotizacionItems(texto);
  return { items, pistaIncluyeIgv: detectarPistaIgv(texto) };
}

function esArchivoExcel(file){
  return /\.(xlsx|xls)$/i.test(file.name) || /spreadsheet|ms-excel/i.test(file.type||'');
}

// Punto de entrada único para leer cualquier cotización de proveedor (PDF, foto o Excel) sin importar
// su origen — usado tanto por el botón dentro de Órdenes como por el Automatizador de OCs.
async function leerCotizacionArchivo(file, onProgress){
  if(esArchivoExcel(file)) return leerCotizacionExcel(file);
  return leerCotizacion(file, onProgress);
}


function intentarParsearFilaCotizacion(l, NUM){
  // detecta "Subtotal", "Sub-Total", "Sub Total", "Total", "IGV", "I.G.V.", etc. en cualquier parte de la línea
  if(/sub[\s\-]*total|\btotal\b|\bi\.?\s*g\.?\s*v\.?\b/i.test(l)) return null;

  // Patrón de fila de tabla: [item] Descripción  Cantidad  [S/] PU  [S/] Subtotal  (3 números: cant, pu, subtotal)
  const filaTabla = l.match(new RegExp(`^(?:(\\d+)\\s+)?(.+?)\\s+(${NUM})\\s+S\\/\\.?\\s*(${NUM})\\s+S\\/\\.?\\s*${NUM}\\s*$`, 'i'));
  if(filaTabla){
    const detalle = filaTabla[2].trim();
    const cantidad = normalizarMontoPE(filaTabla[3]);
    const pu = normalizarMontoPE(filaTabla[4]);
    if(detalle.length>=3 && pu>0 && pu<500000 && !/^descripci[oó]n$/i.test(detalle)){
      return { detalle, cantidad: cantidad||1, pu };
    }
  }

  // Patrón de fila de tabla SIN "S/": [código] Descripción [SI/NO] [unidad] Cantidad Precio Total (3 números planos seguidos)
  const CANT = '\\d{1,5}(?:[.,]\\d{1,3})?';
  const filaTablaPlana = l.match(new RegExp(`^(?:([A-Za-z0-9\\-]*\\d[A-Za-z0-9\\-]*)\\s+)?(.+?)\\s+(${CANT})\\s*(?:[A-Za-zÁÉÍÓÚñ]{1,6}\\.?)?\\s+(${NUM})\\s+(${NUM})\\s*$`));
  if(filaTablaPlana){
    let detalle = filaTablaPlana[2].trim().replace(/\s+(SI|NO)\s*(C\/U|UND\.?|UNID\.?|UN\.?|KG|GLN?|MT?|ML|PZA|JGO|CJA|BLS?)?\s*$/i, '').trim();
    const cantidad = normalizarMontoPE(filaTablaPlana[3]);
    const pu = normalizarMontoPE(filaTablaPlana[4]);
    const total = normalizarMontoPE(filaTablaPlana[5]);
    // valida que cantidad × precio ≈ total, para no confundir esto con una descripción que casualmente termine en 3 números
    const coincide = cantidad>0 && pu>0 && Math.abs(cantidad*pu - total) < Math.max(0.5, total*0.02);
    if(detalle.length>=3 && coincide && pu<500000 && !/^descripci[oó]n$/i.test(detalle)){
      return { detalle, cantidad, pu };
    }
  }

  // Genérico: busca un solo precio al final de la línea: "S/ 25.00", "25.00", "S/25,50", etc.
  const precioMatch = l.match(new RegExp(`(?:S\\/\\.?\\s*|\\$\\s*)?(${NUM})\\s*$`));
  if(!precioMatch) return null;
  const precio = normalizarMontoPE(precioMatch[1]);
  if(!precio || precio<=0 || precio>500000) return null;
  let resto = l.slice(0, precioMatch.index).trim().replace(/[-–—:|]+$/,'').trim();
  if(resto.length<3) return null;
  let cantidad = 1;
  let detalle = resto;
  const cantInicio = resto.match(/^(\d{1,4}(?:[.,]\d{1,2})?)\s+(?:und\.?|unid\.?|un\.?|x)?\s*(.+)$/i);
  const cantX = resto.match(/^(.+?)\s*x\s*(\d{1,4}(?:[.,]\d{1,2})?)\s*$/i);
  if(cantInicio && cantInicio[2] && cantInicio[2].length>=3){
    cantidad = normalizarMontoPE(cantInicio[1]) || 1;
    detalle = cantInicio[2].trim();
  } else if(cantX){
    cantidad = normalizarMontoPE(cantX[2]) || 1;
    detalle = cantX[1].trim();
  }
  if(detalle.length<3 || /^(sub\s*)?total$|^igv$|^precio$|^cantidad$|^item$|^descripci[oó]n$/i.test(detalle)) return null;
  return { detalle, cantidad, pu: precio };
}

function esFilaEncabezado(l){
  // fila de encabezado de tabla (ej. "Item Descripción Cantidad PU SUB TOTAL") - nunca debe unirse a otra línea
  const palabrasClave = (l.match(/\b(item|descripci[oó]n|cantidad|precio|p\.?u\.?|sub\s*total|total|unidad|und)\b/gi) || []).length;
  return palabrasClave >= 2 && !/\d{1,3}(?:[.,]\d{3})*[.,]\d{1,2}/.test(l); // varias palabras clave y ningún precio real
}

function parseCotizacionItems(text){
  const lineas = text.split('\n').map(l=>l.trim()).filter(Boolean);
  const items = [];
  const NUM = '\\d{1,3}(?:[.,]\\d{3})*[.,]\\d{1,3}';
  for(let i=0;i<lineas.length;i++){
    const l = lineas[i];
    if(esFilaEncabezado(l)) continue;
    let resultado = intentarParsearFilaCotizacion(l, NUM);
    if(!resultado && i+1<lineas.length && !esFilaEncabezado(lineas[i+1])){
      // si la línea sola no calzó con ningún patrón, puede que el PDF haya partido la fila en dos
      // (ej. la descripción quedó en una línea y la cantidad/precio en la siguiente) — se intenta unir
      resultado = intentarParsearFilaCotizacion(`${l} ${lineas[i+1]}`, NUM);
      if(resultado) i++; // consumir también la línea siguiente
    }
    if(resultado) items.push({ id: generateId(), item: String(items.length+1), detalle: resultado.detalle, und:'und', metrado: resultado.cantidad, pu: resultado.pu });
  }
  return items;
}

function comprimirImagen(file, maxWidth=1000, calidad=0.65){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * escala;
        canvas.height = img.height * escala;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function GastosBulkImport({onConfirmar, onCancelar}){
  const [procesando, setProcesando] = useState(false);
  const [progresoActual, setProgresoActual] = useState('');
  const [borradores, setBorradores] = useState([]); // {tempId, seleccionado, ...campos, error}
  const fileRef = React.useRef(null);

  const handleFotos = async (e) => {
    const files = Array.from(e.target.files||[]);
    if(files.length===0) return;
    setProcesando(true);
    const nuevos = [];
    for(let i=0;i<files.length;i++){
      const file = files[i];
      setProgresoActual(`Leyendo ${i+1} de ${files.length}: ${file.name}`);
      try {
        const [img, r] = await Promise.all([
          comprimirImagen(file).catch(()=>null),
          leerComprobante(file, ()=>{}),
        ]);
        nuevos.push({
          tempId: generateId(), seleccionado: true, _archivo: file.name,
          fecha: r.fecha || new Date().toISOString().slice(0,10),
          montoTotal: r.monto!=null ? r.monto : 0,
          ruc: r.ruc||'', proveedorNombre: r.proveedorNombre||'', documento: r.documento||'',
          concepto: r.conceptoSugerido||'', responsable:'', estado:'PAGADO', notas:'',
          comprobanteImagen: img,
        });
      } catch(err){
        nuevos.push({ tempId: generateId(), seleccionado: false, _archivo: file.name, _error: err.message, montoTotal:0, concepto:'' });
      }
    }
    setBorradores(prev => [...prev, ...nuevos]);
    setProcesando(false); setProgresoActual('');
    e.target.value = '';
  };

  const actualizar = (tempId, patch) => setBorradores(prev => prev.map(b => b.tempId===tempId ? {...b, ...patch} : b));
  const quitar = (tempId) => setBorradores(prev => prev.filter(b => b.tempId!==tempId));
  const seleccionadosCount = borradores.filter(b=>b.seleccionado && !b._error).length;

  return (
    <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg p-3 mb-3">
      <input ref={fileRef} type="file" accept="image/*" multiple onChange={handleFotos} className="hidden"/>
      <button type="button" onClick={()=>fileRef.current.click()} disabled={procesando} className="w-full border-2 border-dashed border-[#2E3547] rounded-lg py-4 text-sm text-[#8B92A5] hover:border-[#E1602A] hover:text-[#E1602A] transition-colors mb-3 disabled:opacity-60">
        {procesando ? `📷 ${progresoActual}` : '📷 Seleccionar varias fotos de comprobantes'}
      </button>

      {borradores.length>0 && (
        <>
          <div className="border border-[#232838] rounded-lg overflow-hidden max-h-96 overflow-y-auto divide-y divide-[#1E2330] mb-3">
            {borradores.map(b => (
              <div key={b.tempId} className={`p-2.5 flex items-start gap-2 ${b._error?'bg-red-500/5':''}`}>
                <input type="checkbox" className="mt-2 w-4 h-4" checked={!!b.seleccionado} disabled={!!b._error} onChange={e=>actualizar(b.tempId,{seleccionado:e.target.checked})}/>
                {b.comprobanteImagen && <img src={b.comprobanteImagen} className="w-12 h-12 object-cover rounded border border-[#2E3547] shrink-0"/>}
                <div className="min-w-0 flex-1">
                  <p className="text-[10px] font-mono text-[#5C6376] truncate mb-1">{b._archivo}</p>
                  {b._error ? (
                    <p className="text-xs text-red-400">⚠️ No se pudo leer: {b._error}</p>
                  ) : (
                    <div className="grid grid-cols-4 gap-1.5">
                      <input type="date" className="col-span-1 text-xs px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={b.fecha} onChange={e=>actualizar(b.tempId,{fecha:e.target.value})}/>
                      <input type="number" step="any" className="col-span-1 text-xs px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={b.montoTotal} onChange={e=>actualizar(b.tempId,{montoTotal:e.target.value})} placeholder="Monto"/>
                      <input className="col-span-2 text-xs px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={b.concepto} onChange={e=>actualizar(b.tempId,{concepto:e.target.value})} placeholder="Concepto"/>
                      <input className="col-span-2 text-xs px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={b.proveedorNombre} onChange={e=>actualizar(b.tempId,{proveedorNombre:e.target.value})} placeholder="Proveedor"/>
                      <input className="col-span-2 text-xs px-1.5 py-1 bg-[#0D1119] text-[#EDEFF3] border border-[#232838] rounded" value={b.responsable} onChange={e=>actualizar(b.tempId,{responsable:e.target.value})} placeholder="Responsable"/>
                    </div>
                  )}
                </div>
                <button type="button" onClick={()=>quitar(b.tempId)} className="text-[#5C6376] hover:text-red-400 shrink-0 mt-1">✕</button>
              </div>
            ))}
          </div>
          <p className="text-xs text-[#5C6376] mb-2">Revisa fecha, monto y concepto de cada uno (el lector puede fallar en fotos borrosas) — desmarca los que no quieras agregar.</p>
        </>
      )}

      <div className="flex justify-end gap-2">
        <button type="button" onClick={onCancelar} className="px-3 py-1.5 text-xs rounded-lg text-[#B4B9C6] hover:bg-white/5">Cancelar</button>
        <button type="button" disabled={seleccionadosCount===0} onClick={()=>onConfirmar(borradores.filter(b=>b.seleccionado && !b._error).map(({tempId, seleccionado, _archivo, _error, ...g})=>({id:generateId(), ...g, montoTotal:Number(g.montoTotal)||0})))} className="px-3 py-1.5 text-xs rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-40">Agregar {seleccionadosCount} gasto{seleccionadosCount===1?'':'s'}</button>
      </div>
    </div>
  );
}

function GastoQuickForm({initial, onSave, onCancel}){
  const [form, setForm] = useState(initial || { id:generateId(), fecha:new Date().toISOString().slice(0,10), concepto:'', montoTotal:0, ruc:'', proveedorNombre:'', documento:'', responsable:'', estado:'PAGADO', notas:'', comprobanteImagen:null });
  const [leyendo, setLeyendo] = useState(false);
  const [progreso, setProgreso] = useState(0);
  const [ocrError, setOcrError] = useState('');
  const fileRef = React.useRef(null);

  const handleFoto = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    setLeyendo(true); setProgreso(0); setOcrError('');
    try {
      const [imagenComprimida, r] = await Promise.all([
        comprimirImagen(file).catch(()=>null),
        leerComprobante(file, setProgreso),
      ]);
      setForm(f => ({
        ...f,
        fecha: r.fecha || f.fecha,
        montoTotal: r.monto!=null ? r.monto : f.montoTotal,
        ruc: r.ruc || f.ruc,
        proveedorNombre: r.proveedorNombre || f.proveedorNombre,
        documento: r.documento || f.documento,
        concepto: f.concepto || r.conceptoSugerido || '',
        comprobanteImagen: imagenComprimida || f.comprobanteImagen,
      }));
    } catch(err){
      setOcrError('No se pudo leer la imagen automáticamente. Completa los datos a mano. (' + err.message + ')');
      try { const img = await comprimirImagen(file); setForm(f=>({...f, comprobanteImagen: img})); } catch(e2){}
    }
    setLeyendo(false);
    e.target.value = '';
  };

  return (
    <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg p-3 mb-3">
      <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFoto} className="hidden"/>
      <button type="button" onClick={()=>fileRef.current.click()} disabled={leyendo} className="w-full border-2 border-dashed border-[#2E3547] rounded-lg py-4 text-sm text-[#8B92A5] hover:border-[#E1602A] hover:text-[#E1602A] transition-colors mb-3 disabled:opacity-60">
        {leyendo ? `📷 Leyendo comprobante… ${progreso}%` : '📷 Leer comprobante (foto o imagen)'}
      </button>
      {ocrError && <p className="text-xs text-amber-400 mb-2">{ocrError}</p>}
      {form.comprobanteImagen && (
        <div className="flex items-center gap-2 mb-3 bg-[#0D1119] border border-[#232838] rounded-lg p-2">
          <img src={form.comprobanteImagen} className="w-14 h-14 object-cover rounded border border-[#2E3547]"/>
          <p className="text-xs text-[#8B92A5] flex-1">Foto del comprobante guardada con este gasto.</p>
          <button type="button" onClick={()=>setForm({...form, comprobanteImagen:null})} className="text-xs text-red-400 hover:underline">Quitar</button>
        </div>
      )}

      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Fecha"><input type="date" className={inputCls} value={form.fecha} onChange={e=>setForm({...form, fecha:e.target.value})}/></Field>
        <Field label="Monto total, con IGV (S/)"><input type="number" step="any" min="0" className={inputCls} value={form.montoTotal} onChange={e=>setForm({...form, montoTotal:e.target.value})}/></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="RUC del proveedor"><input className={inputCls+' font-mono'} value={form.ruc} onChange={e=>setForm({...form, ruc:e.target.value})}/></Field>
        <Field label="Proveedor / lugar"><input className={inputCls} value={form.proveedorNombre} onChange={e=>setForm({...form, proveedorNombre:e.target.value})}/></Field>
      </div>
      <Field label="Concepto">
        <input className={inputCls} list="conceptos-gasto" value={form.concepto} onChange={e=>setForm({...form, concepto:e.target.value})} placeholder="Ej. Estacionamiento para reunión de obra, Gasolina para traslado a obra…"/>
        <p className="text-[11px] text-[#5C6376] mt-1">Incluye el motivo real del gasto, no solo la categoría (ej. "Cemento para cimentación" en vez de solo "Cemento").</p>
        <datalist id="conceptos-gasto">{CONCEPTOS_SUGERIDOS_GASTO.map(c=><option key={c} value={c}/>)}</datalist>
      </Field>
      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Documento (N° boleta/factura o medio de pago)"><input className={inputCls} value={form.documento} onChange={e=>setForm({...form, documento:e.target.value})} placeholder="Ej. F001-123 o YAPE"/></Field>
        <Field label="Responsable (quién lo gastó)"><input className={inputCls} value={form.responsable} onChange={e=>setForm({...form, responsable:e.target.value})} placeholder="Ej. Juan Pérez"/></Field>
      </div>
      <Field label="Estado"><select className={inputCls} value={form.estado} onChange={e=>setForm({...form, estado:e.target.value})}><option value="PAGADO">Pagado (con comprobante)</option><option value="CONSUMIDO">Consumido (sin comprobante formal, ej. Yape/efectivo)</option></select></Field>
      <Field label="Notas"><input className={inputCls} value={form.notas} onChange={e=>setForm({...form, notas:e.target.value})} placeholder="Opcional"/></Field>
      <div className="flex justify-end gap-2 pt-1">
        <button type="button" onClick={onCancel} className="px-3 py-1.5 text-xs rounded-lg text-[#B4B9C6] hover:bg-white/5">Cancelar</button>
        <button type="button" onClick={()=>{ if(!form.concepto.trim()||!Number(form.montoTotal)) return; onSave({...form, montoTotal:Number(form.montoTotal)||0}); }} className="px-3 py-1.5 text-xs rounded-lg text-white font-medium bg-[#E1602A]">Guardar gasto</button>
      </div>
    </div>
  );
}

function FondoForm({initial, proyectos, fondos, onSave, onCancel}){
  const [form, setForm] = useState(initial || { id:generateId(), proyectoId:proyectos[0]?proyectos[0].id:'', tipo:'Adelanto', montoEntregado:0, numero:'', categoria:'General', concepto:'Combustible', solicitante:'', fecha:new Date().toISOString().slice(0,10), moneda:'SOLES', notas:'', gastos:[] });

  // para "Combustible" el N° de rendición es un correlativo propio y automático (cuenta todos los fondos de combustible, de cualquier obra)
  const siguienteNumeroCombustible = useMemo(() => {
    const numeros = fondos.filter(f=>f.categoria==='Combustible' && f.id!==form.id).map(f=>parseInt(String(f.numero).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
    const maximo = numeros.length ? Math.max(...numeros) : 0;
    return String(maximo+1).padStart(3,'0');
  }, [fondos, form.id]);

  const cambiarCategoria = (cat) => {
    if(cat==='Combustible') setForm({...form, categoria:cat, numero: siguienteNumeroCombustible, concepto: form.concepto||'Combustible'});
    else setForm({...form, categoria:cat});
  };

  return (
    <form onSubmit={e=>{e.preventDefault(); if(!form.proyectoId || !form.numero.trim() || !form.concepto.trim()) return; onSave(form);}}>
      <Field label="Obra" required><select className={inputCls} value={form.proyectoId} onChange={e=>setForm({...form, proyectoId:e.target.value})}><option value="">Selecciona…</option>{proyectos.map(p=><option key={p.id} value={p.id}>{p.nombre} ({p.centroCosto})</option>)}</select></Field>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Tipo">
          <select className={inputCls} value={form.tipo} onChange={e=>setForm({...form, tipo:e.target.value})}>{TIPOS_FONDO.map(t=><option key={t}>{t}</option>)}</select>
        </Field>
        <Field label="Moneda"><select className={inputCls} value={form.moneda} onChange={e=>setForm({...form, moneda:e.target.value})}><option value="SOLES">Soles (S/)</option><option value="DOLARES">Dólares (US$)</option></select></Field>
      </div>
      {form.tipo==='Adelanto' ? (
        <Field label="Monto entregado" required><input type="number" step="any" min="0" className={inputCls} value={form.montoEntregado} onChange={e=>setForm({...form, montoEntregado:e.target.value})}/></Field>
      ) : (
        <p className="text-xs text-[#5C6376] mb-3">Es un reembolso: no recibiste dinero por adelantado. Registra los gastos con sus comprobantes y el sistema calculará cuánto se te debe reembolsar.</p>
      )}
      <span className="block text-xs font-medium text-[#8B92A5] mb-1.5 uppercase tracking-wide">Categoría</span>
      <div className="flex gap-2 mb-3">
        {['General','Combustible'].map(cat=>(
          <button key={cat} type="button" onClick={()=>cambiarCategoria(cat)} className={`px-3 py-1.5 text-xs font-medium rounded-lg border ${form.categoria===cat?'bg-[#E1602A] border-[#E1602A] text-white':'border-[#2E3547] text-[#8B92A5] hover:bg-white/5'}`}>{cat==='Combustible'?'⛽ Combustible':'General'}</button>
        ))}
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="N° de rendición" required>
          {form.categoria==='Combustible' ? (
            <input className={inputCls+' font-mono'} value={form.numero} onChange={e=>setForm({...form, numero:e.target.value})}/>
          ) : (
            <input className={inputCls+' font-mono'} value={form.numero} onChange={e=>setForm({...form, numero:e.target.value})} placeholder="Ej. 01"/>
          )}
          {form.categoria==='Combustible' && <p className="text-[11px] text-[#5C6376] mt-1">Se sugiere automáticamente (correlativo de combustible), pero puedes cambiarlo.</p>}
        </Field>
        <Field label="Fecha"><input type="date" className={inputCls} value={form.fecha} onChange={e=>setForm({...form, fecha:e.target.value})}/></Field>
      </div>
      <Field label="Concepto del fondo/gasto" required><input className={inputCls} value={form.concepto} onChange={e=>setForm({...form, concepto:e.target.value})} placeholder="Ej. Eliminación de desmonte, Compra de materiales, Alquiler de equipos…"/></Field>
      <Field label="Solicitante"><input className={inputCls} value={form.solicitante} onChange={e=>setForm({...form, solicitante:e.target.value})} placeholder="Nombre de quien rinde"/></Field>
      <Field label="Notas"><input className={inputCls} value={form.notas} onChange={e=>setForm({...form, notas:e.target.value})} placeholder="Ej. Placa/N° del camión, si aplica"/></Field>
      <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
        <button type="button" onClick={onCancel} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-[#1E2430]">Cancelar</button>
        <button type="submit" className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">Guardar fondo</button>
      </div>
    </form>
  );
}

function EnviarCorreoModal({fondo, proyecto, config, onClose}){
  const tituloTipo = fondo.tipo==='Adelanto' ? 'Rendición de Fondo' : 'Rendición de Gastos';
  const [destinatario, setDestinatario] = useState(config.correoRendicion || '');
  const [asunto, setAsunto] = useState(`${tituloTipo} N°${fondo.numero||''} — ${proyecto?proyecto.nombre:''}`);
  const [mensaje, setMensaje] = useState(
`Estimados,

Adjunto la ${tituloTipo.toLowerCase()} N°${fondo.numero||''} correspondiente a la obra ${proyecto?proyecto.nombre:''}, junto con las fotos de los comprobantes.

Quedo atento a cualquier consulta.

Saludos.`
  );
  const [descargando, setDescargando] = useState(false);

  const enviar = async () => {
    if(!destinatario.trim()){ alert('Escribe un destinatario.'); return; }
    setDescargando(true);
    try {
      await exportFondoToExcel(fondo, proyecto);
      const conFoto = (fondo.gastos||[]).filter(g=>g.comprobanteImagen);
      if(conFoto.length>0){
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit:'mm', format:'a4' });
        for(let i=0;i<conFoto.length;i++){
          const g = conFoto[i];
          if(i>0) doc.addPage();
          doc.setFontSize(11); doc.text(`${formatDate(g.fecha)} — ${g.concepto}`, 10, 12);
          doc.setFontSize(9); doc.text(`${g.proveedorNombre||''}  ${g.documento?'· '+g.documento:''}  ·  ${formatMoneyCur(g.montoTotal, fondo.moneda)}`, 10, 18);
          const img = new Image();
          await new Promise(res => { img.onload = res; img.src = g.comprobanteImagen; });
          const ratio = Math.min(190/(img.width*0.264583), 250/(img.height*0.264583));
          doc.addImage(g.comprobanteImagen, 'JPEG', 10, 24, img.width*0.264583*ratio, img.height*0.264583*ratio);
        }
        doc.save(`Comprobantes ${fondo.numero||''} - ${proyecto?proyecto.nombre:''}.pdf`);
      }
    } catch(err){ console.error(err); }
    setDescargando(false);
    const mailto = `mailto:${encodeURIComponent(destinatario.trim())}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(mensaje)}`;
    window.location.href = mailto;
    onClose();
  };

  return (
    <Modal title="Enviar rendición por correo" onClose={onClose}>
      <p className="text-xs text-amber-400 mb-3">⚠️ El navegador no puede adjuntar archivos automáticamente a un correo. Al enviar, se descargan el Excel y el PDF de comprobantes, y se abre tu programa de correo con todo escrito — solo arrastra esos 2 archivos descargados al mensaje antes de darle enviar.</p>
      <Field label="Destinatario" required><input type="email" className={inputCls} value={destinatario} onChange={e=>setDestinatario(e.target.value)} placeholder="correo@empresa.pe"/></Field>
      <Field label="Asunto"><input className={inputCls} value={asunto} onChange={e=>setAsunto(e.target.value)}/></Field>
      <Field label="Mensaje"><textarea className={inputCls} rows={6} value={mensaje} onChange={e=>setMensaje(e.target.value)}/></Field>
      <div className="flex justify-end gap-2 pt-2 border-t border-[#1E2330]">
        <button type="button" onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-[#1E2430]">Cancelar</button>
        <button type="button" disabled={descargando} onClick={enviar} className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-50">{descargando?'Preparando archivos…':'📧 Descargar archivos y abrir correo'}</button>
      </div>
    </Modal>
  );
}

function FondoDetalleModal({fondo, proyecto, config, onClose, onSave, onEditar}){
  const [showGastoForm, setShowGastoForm] = useState(false);
  const [showBulk, setShowBulk] = useState(false);
  const [editingGasto, setEditingGasto] = useState(null);
  const [imagenAmpliada, setImagenAmpliada] = useState(null);
  const [generandoPdf, setGenerandoPdf] = useState(false);
  const [showEnviarCorreo, setShowEnviarCorreo] = useState(false);
  const gastos = fondo.gastos || [];
  const totalGastado = gastos.reduce((s,g)=>s+(Number(g.montoTotal)||0),0);
  const saldo = (Number(fondo.montoEntregado)||0) - totalGastado;
  const conFoto = gastos.filter(g=>g.comprobanteImagen);

  const guardarGasto = (g) => {
    const next = gastos.some(x=>x.id===g.id) ? gastos.map(x=>x.id===g.id?g:x) : [...gastos, g];
    onSave({...fondo, gastos: next});
    setShowGastoForm(false); setEditingGasto(null);
  };
  const guardarGastosMasivo = (nuevosGastos) => {
    onSave({...fondo, gastos: [...gastos, ...nuevosGastos]});
    setShowBulk(false);
  };
  const eliminarGasto = (id) => {
    if(!confirm('¿Eliminar este gasto?')) return;
    onSave({...fondo, gastos: gastos.filter(x=>x.id!==id)});
  };

  const descargarComprobantesPdf = async () => {
    if(conFoto.length===0){ alert('Ninguno de los gastos de este fondo tiene una foto de comprobante guardada.'); return; }
    setGenerandoPdf(true);
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      for(let i=0;i<conFoto.length;i++){
        const g = conFoto[i];
        if(i>0) doc.addPage();
        doc.setFontSize(11);
        doc.text(`${formatDate(g.fecha)} — ${g.concepto}`, 10, 12);
        doc.setFontSize(9);
        doc.text(`${g.proveedorNombre||''}  ${g.documento?'· '+g.documento:''}  ·  ${formatMoneyCur(g.montoTotal, fondo.moneda)}`, 10, 18);
        const img = new Image();
        await new Promise(res => { img.onload = res; img.src = g.comprobanteImagen; });
        const maxW = 190, maxH = 250;
        const ratio = Math.min(maxW / (img.width*0.264583), maxH / (img.height*0.264583));
        const wMm = img.width*0.264583*ratio, hMm = img.height*0.264583*ratio;
        doc.addImage(g.comprobanteImagen, 'JPEG', 10, 24, wMm, hMm);
      }
      doc.save(`Comprobantes ${fondo.numero||''} - ${proyecto?proyecto.nombre:''}.pdf`);
    } catch(err){
      console.error(err);
      alert('No se pudo generar el PDF de comprobantes: ' + err.message);
    }
    setGenerandoPdf(false);
  };

  return (
    <Modal title={`Fondo · ${proyecto?proyecto.nombre:'—'}`} onClose={onClose} wide>
      <div className="flex items-center justify-between mb-3 -mt-1">
        <p className="text-xs text-[#8B92A5]">{fondo.categoria==='Combustible' ? `⛽ Combustible · N°${fondo.numero}` : `N°${fondo.numero}`} · {fondo.concepto}</p>
        <button type="button" onClick={()=>onEditar(fondo)} className="text-xs text-[#5C6376] hover:text-[#E1602A] underline">✏️ Editar datos del fondo</button>
      </div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2">
          <p className="text-[11px] text-[#5C6376] uppercase">Entregado</p>
          <p className="font-mono font-semibold text-sm text-[#DADDE5]">{formatMoneyCur(fondo.montoEntregado, fondo.moneda)}</p>
        </div>
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2">
          <p className="text-[11px] text-[#5C6376] uppercase">Rendido</p>
          <p className="font-mono font-semibold text-sm text-[#DADDE5]">{formatMoneyCur(totalGastado, fondo.moneda)}</p>
        </div>
        <div className="bg-[#1A1F2A] border border-[#232838] rounded-lg px-3 py-2">
          <p className="text-[11px] text-[#5C6376] uppercase">{saldo>=0?'Por devolver':'Por reembolsar'}</p>
          <p className={`font-mono font-semibold text-sm ${saldo>=0?'text-emerald-400':'text-red-400'}`}>{formatMoneyCur(Math.abs(saldo), fondo.moneda)}</p>
        </div>
      </div>

      {showGastoForm ? (
        <GastoQuickForm initial={editingGasto} onSave={guardarGasto} onCancel={()=>{setShowGastoForm(false); setEditingGasto(null);}}/>
      ) : showBulk ? (
        <GastosBulkImport onConfirmar={guardarGastosMasivo} onCancelar={()=>setShowBulk(false)}/>
      ) : (
        <div className="flex gap-2 mb-3">
          <button onClick={()=>{setEditingGasto(null); setShowGastoForm(true);}} className="flex-1 px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">+ Agregar 1 gasto</button>
          {!READONLY && <button onClick={()=>setShowBulk(true)} className="flex-1 px-3 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">📷 Cargar varias fotos</button>}
        </div>
      )}

      <div className="border border-[#232838] rounded-lg overflow-hidden max-h-72 overflow-y-auto">
        <table className="w-full text-sm">
          <thead className="bg-[#1A1F2A] text-[#8B92A5] text-xs uppercase sticky top-0"><tr><th className="text-left px-3 py-2">Fecha</th><th className="text-left px-3 py-2">Concepto</th><th className="text-left px-3 py-2">Proveedor</th><th className="text-right px-3 py-2">Monto</th><th className="text-center px-3 py-2">📷</th><th></th></tr></thead>
          <tbody className="divide-y divide-[#1E2330]">
            {gastos.map(g=>(
              <tr key={g.id}>
                <td className="px-3 py-2 text-[#B4B9C6]">{formatDate(g.fecha)}</td>
                <td className="px-3 py-2 text-[#DADDE5]">{g.concepto}</td>
                <td className="px-3 py-2 text-[#8B92A5]">{g.proveedorNombre || '—'}{g.ruc && <span className="font-mono text-[10px]"> · {g.ruc}</span>}</td>
                <td className="px-3 py-2 text-right font-mono text-[#DADDE5]">{formatMoneyCur(g.montoTotal, fondo.moneda)}</td>
                <td className="px-3 py-2 text-center">{g.comprobanteImagen ? <img src={g.comprobanteImagen} onClick={()=>setImagenAmpliada(g.comprobanteImagen)} className="w-8 h-8 object-cover rounded border border-[#2E3547] cursor-pointer inline-block hover:border-[#E1602A]"/> : <span className="text-[#3A4152]">—</span>}</td>
                <td className="px-3 py-2"><div className="flex gap-2 justify-end"><button onClick={()=>{setEditingGasto(g); setShowGastoForm(true);}} className="text-[#5C6376] hover:text-[#DADDE5]">✏️</button><button onClick={()=>eliminarGasto(g.id)} className="text-[#5C6376] hover:text-red-400">🗑️</button></div></td>
              </tr>
            ))}
            {gastos.length===0 && <tr><td colSpan={6} className="text-center text-[#5C6376] py-6 text-sm">Sin gastos registrados todavía.</td></tr>}
          </tbody>
        </table>
      </div>
      {imagenAmpliada && (
        <div className="fixed inset-0 z-[2100] bg-black/80 flex items-center justify-center p-6" onClick={()=>setImagenAmpliada(null)}>
          <img src={imagenAmpliada} className="max-w-full max-h-full rounded-lg shadow-2xl"/>
        </div>
      )}
      <div className="flex justify-end gap-2 pt-4">
        <button onClick={onClose} className="px-4 py-2 text-sm rounded-lg text-[#B4B9C6] hover:bg-white/5">Cerrar</button>
        <button onClick={descargarComprobantesPdf} disabled={generandoPdf} className="px-4 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5 disabled:opacity-50">{generandoPdf?'Generando…':`📄 Comprobantes en PDF (${conFoto.length})`}</button>
        <button onClick={()=>exportFondoToExcel(fondo, proyecto)} className="px-4 py-2 text-sm rounded-lg border border-[#2E3547] text-[#B4B9C6] hover:bg-white/5">📥 Descargar Excel</button>
        <button onClick={()=>setShowEnviarCorreo(true)} className="px-4 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A]">📧 Enviar por correo</button>
      </div>
      {showEnviarCorreo && <EnviarCorreoModal fondo={fondo} proyecto={proyecto} config={config} onClose={()=>setShowEnviarCorreo(false)}/>}
    </Modal>
  );
}

function FondosView({fondos, setFondos, proyectos, config}){
  const [showForm, setShowForm] = useState(false);
  const [editingFondo, setEditingFondo] = useState(null);
  const [detalle, setDetalle] = useState(null);
  const [obraFilter, setObraFilter] = useState('');

  const proyectoDe = (id) => proyectos.find(p=>p.id===id);
  const filtered = fondos.filter(f => !obraFilter || f.proyectoId===obraFilter);

  const save = (form) => { setFondos(prev => prev.some(f=>f.id===form.id) ? prev.map(f=>f.id===form.id?form:f) : [...prev, form]); setShowForm(false); setEditingFondo(null); };
  const remove = (id) => { if(confirm('¿Eliminar este fondo y sus gastos registrados?')) setFondos(prev=>prev.filter(f=>f.id!==id)); };
  const editar = (f) => { setDetalle(null); setEditingFondo(f); setShowForm(true); };

  const resumenCombustible = useMemo(() => {
    if(!obraFilter) return null;
    const deCombustible = fondos.filter(f => f.proyectoId===obraFilter && f.categoria==='Combustible');
    if(deCombustible.length===0) return null;
    let entregado={soles:0,dolares:0}, gastado={soles:0,dolares:0};
    deCombustible.forEach(f=>{
      const campo = f.moneda==='DOLARES' ? 'dolares' : 'soles';
      entregado[campo] += Number(f.montoEntregado)||0;
      gastado[campo] += (f.gastos||[]).reduce((s,g)=>s+(Number(g.montoTotal)||0),0);
    });
    return { cantidad: deCombustible.length, entregado, gastado };
  }, [fondos, obraFilter]);

  return (
    <div>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select className={inputCls+' w-auto'} value={obraFilter} onChange={e=>setObraFilter(e.target.value)}><option value="">Todas las obras</option>{proyectos.map(p=><option key={p.id} value={p.id}>{p.nombre}</option>)}</select>
        <div className="flex-1"/>
        {!READONLY && <button onClick={()=>{setEditingFondo(null); setShowForm(true);}} disabled={proyectos.length===0} className="px-3 py-2 text-sm rounded-lg text-white font-medium bg-[#E1602A] disabled:opacity-40">+ Nuevo fondo</button>}
      </div>

      {resumenCombustible && (
        <div className="bg-[#141821] border border-[#232838] rounded-xl p-4 mb-4 flex items-center gap-6">
          <span className="text-2xl">⛽</span>
          <div>
            <p className="text-xs text-[#8B92A5] uppercase tracking-wide">Resumen de combustible en esta obra ({resumenCombustible.cantidad} fondo{resumenCombustible.cantidad===1?'':'s'})</p>
            <div className="flex gap-6 mt-1">
              <div><span className="text-[11px] text-[#5C6376]">Entregado: </span><MoneyDual soles={resumenCombustible.entregado.soles} dolares={resumenCombustible.entregado.dolares} className="font-mono text-sm text-[#DADDE5]"/></div>
              <div><span className="text-[11px] text-[#5C6376]">Gastado: </span><MoneyDual soles={resumenCombustible.gastado.soles} dolares={resumenCombustible.gastado.dolares} className="font-mono text-sm text-[#DADDE5]"/></div>
            </div>
          </div>
        </div>
      )}

      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
        {filtered.map(f => {
          const gastos = f.gastos || [];
          const totalGastado = gastos.reduce((s,g)=>s+(Number(g.montoTotal)||0),0);
          const saldo = (Number(f.montoEntregado)||0) - totalGastado;
          return (
            <div key={f.id} onClick={()=>setDetalle(f)} className="bg-[#141821] rounded-xl border border-[#232838] p-4 cursor-pointer hover:border-[#E1602A] transition-colors">
              <div className="flex items-start justify-between mb-2">
                <div className="flex items-center gap-1.5">
                  <Badge className={f.tipo==='Adelanto'?'bg-blue-500/15 text-blue-300 border-blue-500/30':'bg-purple-500/15 text-purple-300 border-purple-500/30'}>{f.tipo}</Badge>
                  {f.categoria==='Combustible' && <Badge className="bg-amber-500/15 text-amber-300 border-amber-500/30">⛽ N°{f.numero}</Badge>}
                </div>
                <div className="flex gap-2" onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>remove(f.id)} className="text-[#5C6376] hover:text-red-400 text-xs">🗑️</button>
                </div>
              </div>
              <p className="font-semibold text-[#DADDE5]">{(proyectoDe(f.proyectoId)||{}).nombre || '—'}</p>
              <p className="text-xs text-[#5C6376] mb-2">{f.categoria!=='Combustible' && `N°${f.numero} · `}{formatDate(f.fecha)} · {gastos.length} gasto{gastos.length===1?'':'s'}</p>
              <div className="pt-2 border-t border-[#1E2330] flex justify-between items-baseline">
                <span className="text-xs text-[#8B92A5]">{f.tipo==='Adelanto' && `Entregado ${formatMoneyCur(f.montoEntregado, f.moneda)}`}</span>
                <span className={`font-mono text-sm font-semibold ${saldo>=0?'text-emerald-400':'text-red-400'}`}>{saldo>=0?'':'−'}{formatMoneyCur(Math.abs(saldo), f.moneda)}</span>
              </div>
            </div>
          );
        })}
        {filtered.length===0 && <div className="col-span-full bg-[#141821] border border-dashed border-[#2E3547] rounded-xl p-10 text-center text-[#5C6376] text-sm">Aún no registras fondos.</div>}
      </div>

      {showForm && <Modal title={editingFondo?'Editar fondo':'Nuevo fondo'} onClose={()=>{setShowForm(false); setEditingFondo(null);}}><FondoForm initial={editingFondo} proyectos={proyectos} fondos={fondos} onSave={save} onCancel={()=>{setShowForm(false); setEditingFondo(null);}}/></Modal>}
      {detalle && <FondoDetalleModal fondo={fondos.find(f=>f.id===detalle.id)||detalle} proyecto={proyectoDe(detalle.proyectoId)} config={config} onClose={()=>setDetalle(null)} onSave={(f)=>{save(f); setDetalle(f);}} onEditar={editar}/>}
    </div>
  );
}
